<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="老楊輪羽班的點名、繳費與出席統計">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%230a4a5f'/%3E%3Cpath d='M12 9 L20 24 L28 9 Z' fill='white'/%3E%3Ccircle cx='20' cy='28' r='5' fill='%23f0b400'/%3E%3C/svg%3E">
<title>老楊輪羽班點名簿</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0a4a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="輪羽點名簿">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one-column phone-first app. Court-blue sticky header with four tabs; each tab is a list of member rows with large tap targets. */
:root{
  --bg:#eef3f5;
  --surface:#ffffff;
  --surface-2:#f6f9fa;
  --fg:#11222c;
  --muted:#566874;
  --line:#d5dfe4;
  --court:#0d5870;
  --court-2:#0a4a5f;
  --court-ink:#ffffff;
  --court-soft:rgba(255,255,255,.72);
  --shuttle:#f0b400;
  --accent:#0d6f8c;
  --accent-soft:#dcedf2;
  --ok:#1b7445; --ok-bg:#ddf1e5;
  --warn:#8f5500; --warn-bg:#fcefd3;
  --bad:#ad2a22; --bad-bg:#fae2df;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c161c; --surface:#13222b; --surface-2:#182a34; --fg:#e7f0f3; --muted:#9bb0ba; --line:#28404c;
    --court:#0b3f51; --court-2:#08323f; --court-ink:#f2f8fa; --court-soft:rgba(242,248,250,.7);
    --shuttle:#ffc933; --accent:#5ec3df; --accent-soft:#163947;
    --ok:#6fd49b; --ok-bg:#153626; --warn:#f2bb5c; --warn-bg:#3a2a0d; --bad:#ff8f86; --bad-bg:#3d1714;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c161c; --surface:#13222b; --surface-2:#182a34; --fg:#e7f0f3; --muted:#9bb0ba; --line:#28404c;
  --court:#0b3f51; --court-2:#08323f; --court-ink:#f2f8fa; --court-soft:rgba(242,248,250,.7);
  --shuttle:#ffc933; --accent:#5ec3df; --accent-soft:#163947;
  --ok:#6fd49b; --ok-bg:#153626; --warn:#f2bb5c; --warn-bg:#3a2a0d; --bad:#ff8f86; --bad-bg:#3d1714;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--court)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--shuttle);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--court);color:var(--court-ink)}
.top .wrap{padding-block:14px 0;display:grid;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;flex:none}
.brand h1{margin:0;font-size:1.3rem;font-weight:900;letter-spacing:.02em;line-height:1.2;text-wrap:balance}
.brand p{margin:0;font-size:.88rem;color:var(--court-soft)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{background:none;border:0;border-bottom:4px solid transparent;color:var(--court-soft);padding:10px 4px 9px;font-size:1.02rem;font-weight:700;min-height:48px}
.tabs button[aria-selected="true"]{color:var(--court-ink);border-bottom-color:var(--shuttle)}

main{padding-block:18px 48px;display:grid;gap:16px}
.admin{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;padding:10px 14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:.92rem}
.admin > span{align-self:center}
.admin.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.notice{margin-top:14px;padding:12px 14px;border-radius:var(--radius);background:var(--warn-bg);color:var(--warn);font-weight:500}

.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.5rem;line-height:1;display:grid;place-items:center}
.nav:disabled{opacity:.4;cursor:not-allowed}
.picker{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;height:48px;border-radius:24px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:1.08rem;padding:0 12px}
.picker input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.picker.static{cursor:default}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 6px;min-height:44px}

.banner{padding:12px 14px;border-radius:var(--radius);font-weight:700;display:grid;gap:2px}
.banner small{font-weight:500;font-size:.9rem}
.banner.ok{background:var(--accent-soft);color:var(--accent)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.rules{background:var(--warn-bg);color:var(--fg);border-left:5px solid var(--shuttle);border-radius:var(--radius);padding:12px 14px 12px 16px;display:grid;gap:6px}
.rules b{color:var(--warn);font-size:.95rem;letter-spacing:.04em}
.rules ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.rules li{font-size:.95rem}
.rules strong{font-weight:900}
.rules .rule-list{margin:0;padding-left:1.3em;display:grid;gap:10px}
.rules .rule-list > li::marker{color:var(--warn)}
.rules ol.rule-list ul{margin-top:4px}

.summary{display:flex;flex-wrap:nowrap;gap:6px}
/* 繳費頁：這堂摘要卡 */
.hero{background:linear-gradient(135deg,var(--accent) 0%,#0a4a5f 100%);color:#fff;border-radius:var(--radius);padding:16px 18px;display:grid;gap:10px;box-shadow:0 6px 18px rgba(10,74,95,.18)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:.95rem;opacity:.95}
.hero-chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 10px;font-size:.85rem;white-space:nowrap}
.hero-main{display:flex;align-items:baseline;gap:8px}
.hero-main b{font-size:2.4rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:#ffc933}
.hero-main span{font-weight:700;opacity:.9}
.hero-meta{font-size:.9rem;opacity:.92;line-height:1.5}
.hero-prog{display:grid;gap:5px;font-size:.88rem;font-weight:700}
.hero-bar{height:10px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden}
.hero-bar i{display:block;height:100%;border-radius:999px;background:#ffc933;transition:width .3s}
.hero-note{font-size:.82rem;opacity:.85;border-top:1px dashed rgba(255,255,255,.3);padding-top:8px}
/* 錢怎麼走：流向圖 */
.flowmap{display:grid;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px}
.fm-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px}
.fm-node{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:900;font-size:.9rem;white-space:nowrap}
.fm-node.hub{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.fm-arrow{position:relative;text-align:center;font-size:.82rem;font-weight:900;color:var(--accent);padding-bottom:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fm-arrow::after{content:"";position:absolute;left:4px;right:10px;bottom:2px;border-bottom:2px solid var(--accent)}
.fm-arrow::before{content:"";position:absolute;right:2px;bottom:-2px;border:5px solid transparent;border-left:8px solid var(--accent)}
/* 規則收合 */
details.rules > summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.rules > summary::-webkit-details-marker{display:none}
details.rules > summary::after{content:"點開看 ▾";font-size:.8rem;font-weight:700;color:var(--warn)}
details.rules[open] > summary::after{content:"收起 ▴"}
.deadline{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--radius);background:var(--surface);border:1px dashed var(--line);font-size:.92rem}
.deadline b{color:var(--warn)}
.deadline.past b{color:var(--muted)}
/* 統計頁：對帳表 */
.ledger td.ok{color:var(--ok)} .ledger td.bad{color:var(--bad)}
.ledger small{font-size:.72rem;font-weight:700}
.tablewrap table.ledger{min-width:0;font-size:.9rem}
.tablewrap table.ledger th,.tablewrap table.ledger td{padding:8px 5px}
.tablewrap table.ledger td.num{font-size:.92rem}
@media (prefers-reduced-motion: reduce){.hero-bar i{transition:none}}
.stat{flex:1 1 0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center}
.stat b{display:block;font-size:1.15rem;font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{display:block;font-size:.75rem;color:var(--muted);line-height:1.25}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}

.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions.stack{flex-direction:column;align-items:flex-end;gap:6px}
.btn{min-height:48px;padding:0 18px;border-radius:24px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:40px;padding:0 14px;font-size:.92rem}
.btn:disabled,.seg button:disabled{opacity:.45;cursor:not-allowed}

.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;padding:12px 14px;flex-wrap:wrap}
.row+.row{border-top:1px solid var(--line)}
.who{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1 1 140px;flex-wrap:wrap}
.who b{font-size:1.12rem;font-weight:700}
.tag{font-size:.75rem;font-weight:700;letter-spacing:.06em;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.tag.role{background:var(--warn-bg);color:var(--warn)}
.steps{margin:0;padding-left:1.4em;display:grid;gap:10px}
.steps li{line-height:1.55}
.steps li::marker{font-weight:900;color:var(--accent)}
.big-money{margin:0;font-size:1.8rem;font-weight:900;color:var(--warn);font-variant-numeric:tabular-nums}
button.pill{border:0;cursor:pointer;font:inherit;font-size:.85rem;font-weight:700}
.sub{font-size:.88rem;color:var(--muted);flex-basis:100%}

.seg{display:grid;grid-template-columns:repeat(3,minmax(64px,1fr));gap:6px;flex:1 1 240px;max-width:330px}
.seg button{min-height:52px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);font-weight:700;font-size:1.02rem}
.seg button[aria-pressed="true"][data-s="present"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed="true"][data-s="leave"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.seg button[aria-pressed="true"][data-s="absent"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg.two button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
/* 點名：兩人一排 */
.list.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.list.pair .row{flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:space-between;gap:8px;padding:10px;border-top:0;min-width:0}
.list.pair .row:nth-child(n+3){border-top:1px solid var(--line)}
.list.pair .row:nth-child(odd){border-right:1px solid var(--line)}
.list.pair .who{flex:none;gap:4px 6px}
.list.pair .seg{flex:none;max-width:none;grid-template-columns:repeat(var(--n,3),1fr);gap:4px}
.list.pair .seg button{min-height:46px;padding:0;font-size:.92rem}
.list.pair .row.wide{grid-column:1/-1;border-right:0}
/* 統計卡片：出席／請假／缺席小格＋付款狀態 */
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.mini div{background:var(--surface-2);border-radius:8px;text-align:center;padding:5px 0 4px}
.mini b{display:block;font-size:1.15rem;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums}
.mini span{display:block;font-size:.72rem;color:var(--muted)}
.mini .ok{background:var(--ok-bg)} .mini .ok b{color:var(--ok)}
.mini .warn{background:var(--warn-bg)} .mini .warn b{color:var(--warn)}
.mini .bad{background:var(--bad-bg)} .mini .bad b{color:var(--bad)}
.mini .zero b{color:var(--muted);opacity:.55}
.paybar{border-radius:8px;padding:6px 8px;font-size:.88rem;display:grid;gap:6px;text-align:center}
.paybar.ok{background:var(--ok-bg);color:var(--ok)}
.paybar.bad{background:var(--bad-bg);color:var(--bad)}
.paybar .chips{justify-content:center}
.list.pair .actions{gap:6px}
.list.pair .actions.stack{align-items:flex-start}

.pill{display:inline-block;font-size:.85rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.form{flex-basis:100%;display:grid;gap:12px;padding:14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field span{font-size:.85rem;font-weight:700;color:var(--muted)}
.field input,.field select{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:12px}
h2{margin:0;font-size:1.1rem;font-weight:900;text-wrap:balance}
h3{margin:4px 0 0;font-size:.95rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dates{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.date{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2);display:grid;gap:4px;justify-items:start}
.date b{font-size:1.02rem;font-variant-numeric:tabular-nums}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:var(--radius);padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:1.1rem;margin-bottom:4px}
.muted{color:var(--muted);font-size:.9rem;margin:0}
.notes{margin:0;padding-left:1.2em;color:var(--muted);font-size:.92rem;display:grid;gap:4px}
.notes strong{color:var(--fg)}

.calc{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.calc td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:baseline}
.calc td:nth-child(2){color:var(--muted);font-size:.9rem}
.calc td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.calc tr.total td{font-weight:900;font-size:1.08rem;color:var(--fg)}
.calc tr.big td{font-size:1.25rem;color:var(--accent);border-bottom:0}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.tablewrap table{border-collapse:collapse;width:100%;min-width:520px;font-variant-numeric:tabular-nums}
.tablewrap th,.tablewrap td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.tablewrap th{font-size:.82rem;color:var(--muted);font-weight:700;letter-spacing:.04em;background:var(--surface-2)}
.tablewrap tr:last-child td{border-bottom:0}
.tablewrap td.num{text-align:center;font-weight:700;font-size:1.05rem}
.tablewrap th.num{text-align:center}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center;z-index:20}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--warn-bg);color:var(--warn);border-top:2px solid var(--warn);font-weight:700;box-shadow:0 -4px 14px rgba(0,0,0,.12)}
.savebar[hidden]{display:none}
.savebar span{flex:1 1 auto;min-width:0}
body.has-save{padding-bottom:84px}
body.has-save #toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="19" fill="var(--court-2)"/>
        <path d="M12 9 L20 24 L28 9 Z" fill="var(--court-ink)" opacity=".9"/>
        <path d="M16 9 L20 24 M24 9 L20 24" stroke="var(--court-2)" stroke-width="1.2"/>
        <circle cx="20" cy="28" r="5" fill="var(--shuttle)"/>
      </svg>
      <div>
        <h1 id="groupName">老楊輪羽班</h1>
        <p id="groupSub">輪椅羽球點名簿</p>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="功能">
      <button role="tab" data-tab="checkin" aria-selected="true">點名</button>
      <button role="tab" data-tab="pay" aria-selected="false">繳費</button>
      <button role="tab" data-tab="stats" aria-selected="false">統計</button>
      <button role="tab" data-tab="members" aria-selected="false">隊友</button>
    </nav>
  </div>
</header>
<div class="wrap"><div id="adminBar" hidden></div><div id="notice" class="notice" hidden></div></div>
<main id="app" class="wrap">
  <div class="empty"><b>名單載入中…</b>馬上就好，請稍等一下。</div>
</main>
<div id="saveBar" class="savebar" role="region" aria-label="儲存修改" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const CLASSES = ["WH1","WH2","SL3","SL4","SU5","SH6","未分級"];
  const METHODS = ["現金","LINE Pay"];
  const ST = {present:"出席", leave:"請假", absent:"缺席"};
  const DEF = { group:"老楊輪羽班", location:"", time:"每週六 14:00–17:00", start:"2026-12-05",
    coachHours:2, coachRate:1000, venueHours:3, venueRate:300, venueRate2:500, bigMin:6,
    venuePayer:"m03", treasurer:"m04", payInfo:"", manager:"m01", trNick:"吉哥", vpNick:"芳玉", coachNick:"楊教練" };   // 誰先付場地費、誰負責收錢、收款方式說明、誰負責維護管理
  const NUMS = ["coachHours","coachRate","venueHours","venueRate","venueRate2","bigMin"];

  const pad = n => String(n).padStart(2,"0");
  const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const today = () => fmtDate(new Date());
  const shiftDate = (s,n) => { const [y,m,d] = s.split("-").map(Number); return fmtDate(new Date(y,m-1,d+n)); };
  const WD = "日一二三四五六";

  const S = {
    tab:"checkin", date:null, payDate:null,

    loaded:{members:false, settings:false},

  const app = document.getElementById("app");

  function toast(msg){ if(typeof staged !== "undefined" && staged.size && /^記下了：/.test(msg)) msg = msg.replace(/^記下了：/, "已暫存：") + "（記得按確認儲存）"; toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove("show"), 2400); }
  function notice(msg){ noticeEl.textContent = msg || ""; noticeEl.hidden = !msg; }
  // 資料存在 Google 試算表，透過 Apps Script 的資料接口（Api.gs）讀寫
  const API = "https://script.google.com/macros/s/AKfycbypMOtouElSK96qRdenjKcePDF58TBFmw1pree2OhDxBy0iXvNorCRlhpGdFkCYEbKe/exec";
  async function gs(fn, ...args){

  // 排序：先依分級（WH1 → WH2 → SL3 → SL4 → SU5 → SH6 → 未分級），同分級再依姓名筆畫由少到多
  let strokeSort;

  const classRank = c => { const i = CLASSES.indexOf(c || "未分級"); return i < 0 ? CLASSES.length : i; };
  const byClassThenStroke = (a, b) => (classRank(a.cls) - classRank(b.cls)) || strokeSort.compare(a.name || "", b.name || "");
  const active = () => S.members.filter(m => m.active !== false);

    + (m.id === S.settings.manager ? `<span class="tag role">管理</span>` : "")

  const treasurerOf = () => active().find(m => m.id === S.settings.treasurer) || null;
  const venuePayerOf = () => active().find(m => m.id === S.settings.venuePayer) || null;
  const trName = () => (treasurerOf() && S.settings.trNick) || (treasurerOf() || {}).name || "財務";
  const vpName = () => (venuePayerOf() && S.settings.vpNick) || (venuePayerOf() || {}).name || "負責場地的人";

  // 點名頁：請假規則
  const leaveBox = () => { const big = S.settings.bigMin; return `<details class="rules">
    <summary><b>請假規則・場地安排</b></summary>
    <b>請假規則</b>
    <ul class="rule-list">
      <li><strong>事先請假：</strong>最晚請提前一週告知，課程費用由實際出席人數平均分攤。若上課人數少於 4 人，則由大家討論是否停課。</li>

  // 繳費頁：收費小提醒
  const rulesBox = d => {

    return `<details class="rules">
    <summary><b>收費小提醒</b></summary>
    <ul class="rule-list">
      <li><strong>課費分攤：</strong>每堂教練費＋場地費，由當天出席的人平均分攤。</li>

    </ul>

  };

  // ---------- 課表與費用 ----------
  function statusOf(d){
    const doc = S.att[d] || {};
    const vals = Object.values(doc.records || {});
    if(vals.includes("leave")) return doc.mode === "single" ? "single" : "paused";
    if(vals.includes("present") || vals.includes("absent")) return "held";
    return d < today() ? "unmarked" : "planned";
  }
  function leaversOf(d){
    const r = (S.att[d] && S.att[d].records) || {};
    return Object.keys(r).filter(id => r[id] === "leave").map(nameOf);
  }
  // 從開課日起每週一次，排到今天之後 8 週；點名過的非固定日期（補課）也算一堂
  function schedule(){
    const start = S.settings.start || today();
    const until = shiftDate(today() > start ? today() : start, 56);
    const extra = Object.keys(S.att).filter(d => d >= start && Object.keys(S.att[d].records || {}).length);
    const set = new Set(extra);
    for(let w = start, g = 0; w <= until && g < 600; w = shiftDate(w, 7), g++) set.add(w);
    return [...set].sort().map(d => ({ date: d, status: statusOf(d) }));
  }
  const billable = st => st !== "paused";
  // 這堂要分攤的人：沒請假的學員（整班暫停就沒有人要付）
  function classInfo(d){
    const st = statusOf(d);
    const r = (S.att[d] && S.att[d].records) || {};
    const ids = billable(st) ? players().filter(m => r[m.id] !== "leave").map(m => m.id) : [];
    const n = ids.length;
    return { st, ids, n, pp: n ? Math.ceil(fees(n).session / n) : 0 };
  }
  const leaveCount = d => players().filter(m => ((S.att[d] && S.att[d].records) || {})[m.id] === "leave").length;
  const payKey = d => "class-" + d;
  const paidRec = (d, id) => ((S.pay[payKey(d)] || {}).records || {})[id];
  function nextClassDate(sch){
    const t = today();
    const next = sch.find(i => i.date >= t);
    return next ? next.date : (S.settings.start || t);
  }
  // 這堂的錢怎麼走：訂場地的人先付場地費，他的課費從裡面扣，差額由財務匯還（或由他補給財務）
  function flowOf(d){
    const ci = classInfo(d), f = fees(ci.n);
    const vp = venuePayerOf(), tr = treasurerOf();
    const coachPaid = (S.pay[payKey(d)] || {}).coachPaid || null;   // 財務付給教練的紀錄
    const venuePaid = (S.pay[payKey(d)] || {}).venuePaid || null;   // 場地負責人付給館方的紀錄
    if(!ci.n || !vp) return { ci, vp: null, tr, venue: f.venue, coach: f.coach, coachPaid, venuePaid };
    const vpShare = ci.ids.includes(vp.id) ? ci.pp : 0;
    const net = f.venue - vpShare;   // >0：財務要匯給訂場地的人；<0：訂場地的人要補給財務
    const reimb = (S.pay[payKey(d)] || {}).reimb || null;
    return { ci, vp, tr, venue: f.venue, coach: f.coach, vpShare, net, reimb, coachPaid, venuePaid };
  }
  // 訂場地的人這堂不用另外繳（課費已從代墊的場地費扣掉）
  const settledByVenue = (m, d) => { const fl = flowOf(d); return !!fl.vp && fl.vp.id === m.id && fl.net >= 0; };
  // 財務自己的課費本來就在他手上，不用轉
  const isTreasurer = m => !!treasurerOf() && treasurerOf().id === m.id;
  const selfSettled = (m, d) => settledByVenue(m, d) || isTreasurer(m);
  const pastClasses = sch => { const t = today(); return sch.filter(i => i.date <= t && i.date >= S.settings.start && billable(i.status) && i.status !== "planned"); };
  // 已經上過、還沒繳的課
  function owedBy(m, sch){
    return pastClasses(sch)
      .filter(i => classInfo(i.date).ids.includes(m.id) && !paidRec(i.date, m.id) && !selfSettled(m, i.date))
      .map(i => i.date);
  }
  // 財務還沒匯還給訂場地的人的課
  const reimbOwed = sch => pastClasses(sch).map(i => ({ d: i.date, fl: flowOf(i.date) })).filter(x => x.fl.vp && x.fl.net > 0 && !x.fl.reimb);
  // 財務還沒付給教練的課
  const coachOwed = sch => pastClasses(sch).map(i => ({ d: i.date, fl: flowOf(i.date) })).filter(x => x.fl.ci.n && !x.fl.coachPaid);
  // 「記下已付款」的小按鈕組：選付款方式＋記下；已付就顯示紀錄和取消
  const paidControl = (done, d, kind, draftKey, label) => !S.canWrite ? "" : done
    ? `<br><span class="pill ok">已付款・${esc(done.method||"")}・${esc(md(done.date||today()))}</span>${S.canWrite ? ` <button class="link" data-act="${kind}-undo" data-date="${d}">取消紀錄</button>` : ""}`
    : (S.canWrite ? `<div class="actions" style="margin-top:6px">${METHODS.map(x => `<button class="btn small${x === (S.draft[draftKey] || "LINE Pay") ? " primary" : ""}" data-act="${kind}-method" data-v="${x}">${x}</button>`).join("")}<button class="btn small" data-act="${kind}-save" data-date="${d}">${label}</button></div>` : `<br><span class="pill bad">還沒付</span>`);
  // n：這堂上課人數（不給就用全部隊友）；人數達 bigMin 就開 2 面場地
  const twoCourts = n => S.settings.bigMin > 0 && n >= S.settings.bigMin;
  function fees(n){
    const s = S.settings;
    if(n == null) n = players().length;
    const two = twoCourts(n), rate = two ? s.venueRate2 : s.venueRate;
    const coach = s.coachHours * s.coachRate, venue = s.venueHours * rate;
    const session = coach + venue;
    const pp = n ? Math.ceil(session / n) : 0;
    return { coach, venue, session, n, pp, two, rate, exact: n ? session % n === 0 : true };
  }
  const courtText = f => `${f.two ? 2 : 1} 面場地，${S.settings.venueHours} 小時 × ${money(f.rate)}`;
  function feeCard(){
    const f = fees(), s = S.settings;
    return `<div class="card">
      <h2>費用怎麼算？</h2>
      <table class="calc">
        <tr><td>教練費</td><td>${s.coachHours} 小時 × ${money(s.coachRate)}</td><td>${money(f.coach)}</td></tr>
        <tr><td>場地費</td><td>${courtText(f)}</td><td>${money(f.venue)}</td></tr>
        <tr class="total"><td>一堂總共</td><td></td><td>${money(f.session)}</td></tr>
        <tr class="total big"><td>每人每堂</td><td>${f.n} 位隊友平分</td><td>${money(f.pp)}</td></tr>
      </table>
      <ul class="notes">
        <li><strong>一堂一收</strong>，上一次課收一次，不用先繳一整期。</li>
        ${s.bigMin > 0 ? `<li><strong>${s.bigMin} 人以上開 2 面場地</strong>（包場，身障半價後每小時 ${money(s.venueRate2)}）；${s.bigMin - 1} 人以下開 1 面（身障半價後每小時 ${money(s.venueRate)}）。</li>` : ""}
        ${venuePayerOf() ? `<li><strong>${esc(vpName())}</strong> 先幫忙付場地費 ${money(f.venue)} 給館方，他的 ${money(f.pp)} 直接扣掉，${esc(trName())} 再匯 <strong>${money(f.venue - f.pp)}</strong> 還給他（${f.n} 人都上課時）。</li>` : ""}
        <li><strong>事先請假</strong>選「整班暫停」：這週不上課、不收錢。</li>
        <li>有人請假、其他人<strong>照上</strong>：由沒請假的人平分，例如 ${[...new Set([f.n - 1, s.bigMin - 1, s.bigMin - 2])].filter(k => k > 0 && k < f.n).sort((a, b) => b - a).map(k => `${k} 人上課每人 ${money(fees(k).pp)}`).join("、")}。</li>
        <li><strong>沒請假就缺席</strong>：照樣要分攤費用。</li>
        <li>隊友人數有變動時，金額會自動重算；已經收的錢不會跟著改。</li>
        ${f.exact ? "" : "<li>除不盡的零頭，進位到整數元。</li>"}
      </ul>
    </div>`;
  }

  // ---------- writes: one at a time per document ----------
  const queues = {};
  // 修改先暫存，按「確認儲存」才一次寫進雲端
  const staged = new Map();
  let changes = 0;   // 點了幾次修改
  function write(path, fn){
    if(!S.online || !S.canWrite) return;
    staged.delete(path); staged.set(path, fn); changes++;   // 同一筆資料只留最後一次
    renderSaveBar();
  }
  function flush(){
    if(!staged.size) return;
    const jobs = [...staged]; staged.clear(); changes = 0;
    let failed = false;
    const all = jobs.map(([path, fn]) => {
      pendingWrites++;
      return queues[path] = (queues[path] || Promise.resolve()).then(fn).catch(e => { failed = true; handleErr(e); })
        .finally(() => { pendingWrites--; if(!pendingWrites) load(); });
    });
    S.saving = true; renderSaveBar();
    Promise.all(all).then(() => { S.saving = false; renderSaveBar(); toast(failed ? "有資料沒存成功，請再試一次" : "已儲存 ✓"); });
  }
  function discard(){
    staged.clear(); changes = 0; renderSaveBar();
    S.editId = null; S.payOpen = null; S.payConfirm = null;
    load(); toast("已放棄修改，恢復成雲端的資料");
  }
  const saveBar = document.getElementById("saveBar");
  function renderSaveBar(){
    const n = staged.size ? Math.max(changes, 1) : 0;
    if(S.saving){ saveBar.hidden = false; saveBar.innerHTML = `<span>儲存中…</span>`; document.body.classList.add("has-save"); return; }
    saveBar.hidden = !n; document.body.classList.toggle("has-save", !!n);

  }

  const save = (c, id, data) => () => gs("saveDoc", S.pw, c, id, data);

  function handleErr(e){
    const msg = String(e && e.message || e || "");

    }
  }

  // ---------- render ----------
  let pendingRender = false;
  function scheduleRender(){
    const a = document.activeElement;

      pendingRender = true; return;
    }
    render();
  }
  app.addEventListener("focusout", () => { if(pendingRender){ setTimeout(()=>{ if(pendingRender){ pendingRender=false; render(); } }, 0); } });

  function render(){
    const s = S.settings;
    document.getElementById("groupName").textContent = s.group || "輪椅羽球點名簿";
    document.getElementById("groupSub").textContent = [s.location && "📍 " + s.location, s.time].filter(Boolean).join("　") || "輪椅羽球點名簿";

  }

  // 點名頁的說明橫幅

  // 點名
  function viewCheckin(sch){
    const list = active();

    let h = `
      <div class="bar">

      </div>
      ${S.date !== nextClassDate(sch) ? `<div><button class="link" data-act="date-next">回到最近一次上課</button></div>` : ""}
      ${classBanner(S.date)}
      ${(() => { const dl = shiftDate(S.date, -7), past = today() > dl; return S.date >= today() ? `<div class="deadline${past ? " past" : ""}">🗓️ <span>這堂請假截止：<b>${labelDate(dl)}</b>${past ? "（已過，之後請假一樣要分攤）" : " 前告知"}</span></div>` : ""; })()}`;
    if(!list.length) return h + noMembers();
    h += `
      <div class="summary">
        <div class="stat ok"><b>${c.present}</b><span>出席</span></div>
        <div class="stat warn"><b>${c.leave}</b><span>請假</span></div>
        <div class="stat bad"><b>${c.absent}</b><span>缺席</span></div>      </div>
      ${S.canWrite && unmarked && (!c.leave || st === "single") ? `<div class="actions"><button class="btn" data-act="all-present"${dis()}>其他人都到了，全部標出席</button></div>` : ""}
      <ul class="list pair">` +
      list.map(m => {
        const s = rec[m.id];
        return `<li class="row">
          <div class="who"><b>${esc(m.name)}</b>${tagHtml(m)}</div>
          <div class="seg" style="--n:${st === "single" ? 2 : 3}" role="group" aria-label="${esc(m.name)} 的出席狀態">
            ${(st === "single" ? ["present","leave"] : ["present","leave","absent"]).map(k => `<button data-act="att" data-id="${m.id}" data-s="${k}" aria-pressed="${s===k}"${dis()}>${ST[k]}</button>`).join("")}
          </div></li>`;
      }).join("") + `</ul>
      ${adminHintP("點完記得按畫面下方的「確認儲存」；點錯的話，再點一次同一個按鈕就能取消。")}
      ${leaveBox()}`;
    return h;
  }

  // 繳費（每堂）
  function viewPay(sch){
    const d = S.payDate, ci = classInfo(d);
    const key = payKey(d);
    const rec = (S.pay[key] && S.pay[key].records) || {};
    let h = `
      <div class="bar">
        <button class="nav" data-act="paydate" data-n="-1" aria-label="上一堂"${d <= S.settings.start ? " disabled" : ""}>‹</button>
        <label class="picker"><span>${labelDate(d)}</span><input type="date" id="payDatePick" value="${d}" min="${S.settings.start}" aria-label="選擇哪一堂"></label>
        <button class="nav" data-act="paydate" data-n="1" aria-label="下一堂">›</button>
      </div>
      ${d !== nextClassDate(sch) ? `<div><button class="link" data-act="paydate-next">回到最近一堂</button></div>` : ""}
      ${payNotice(d)}`;
    if(!players().length) return h + noMembers();
    if(ci.n && d >= S.settings.start){
      const fl = flowOf(d);
      const who = players().filter(m => ci.ids.includes(m.id));
      const mustPay = who.filter(m => !selfSettled(m, d));
      const paid = mustPay.filter(m => rec[m.id]);
      const unpaid = mustPay.filter(m => !rec[m.id]);
      // 財務、場地負責人不用轉課費，另外列在下面（財務在前）
      const special = who.filter(m => !mustPay.includes(m) && !rec[m.id]).sort((a, b) => isTreasurer(b) - isTreasurer(a));
      const listed = [...unpaid, ...paid, ...who.filter(m => !mustPay.includes(m) && rec[m.id])];
      const total = Object.values(rec).reduce((a,r) => a + Number(r.amount||0), 0);
      h += `
        ${heroCard(d, ci, mustPay.length, paid.length)}
        ${unpaid.length ? (S.canWrite ? `<div class="actions"><button class="btn small" data-act="copy-class" data-date="${d}">複製收費訊息，貼到 LINE</button></div>` : "") : `<div class="banner ok">大家的錢都收齊了，辛苦了！</div>`}
        <h3>隊友課費（還沒轉的排前面）</h3>
        ${payList(key, listed, ci.pp, d, "pair")}
        ${special.length ? `<h3>${special.map(m => esc(m.name)).join("・")} 收付情況</h3>${payList(key, special, ci.pp, d, "pair")}` : ""}
        ${flowCard(d, fl)}`;
    }
    h += rulesBox(ci.n && d >= S.settings.start ? d : null);
    return h;
  }

  // 繳費頁最上面：這堂摘要
  function heroCard(d, ci, need, done){
    const num = x => Number(x).toLocaleString("en-US");
    const f = fees(ci.n), lv = leaveCount(d), extra = ci.pp * ci.n - f.session;
    const pct = need ? Math.round(done / need * 100) : 100;
    return `<div class="hero">
      <div class="hero-top"><span>${labelDate(d)} 這堂</span><span class="hero-chip">${f.two ? 2 : 1} 面場地</span></div>
      <div class="hero-main"><b>${money(ci.pp)}</b><span>每人</span></div>
      <div class="hero-meta">出席 ${ci.n} 人${lv ? `・請假 ${lv} 人` : ""}<br>教練費 ${num(f.coach)}＋場地費 ${num(f.venue)}＝${num(f.session)}，${ci.n} 人平分</div>
      <div class="hero-prog"><span>已付 ${done}／${need} 人</span><div class="hero-bar" role="progressbar" aria-label="已付人數" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>
      ${extra > 0 ? `<div class="hero-note">每人金額進位到整數，這堂多收 ${money(extra)}，存入班費。</div>` : ""}
    </div>`;
  }

  // 某人這堂要繳多少（訂場地的人如果課費比場地費多，只要補差額）
  function oweAmount(m, d){
    const fl = flowOf(d);
    if(fl.vp && fl.vp.id === m.id && fl.net < 0) return -fl.net;
    return fl.ci.pp;
  }

  // 這堂的錢怎麼走
  function flowCard(d, fl){
    if(!fl.vp && !fl.tr) return "";
    const tr = esc(trName()), vp = esc(vpName());
    const others = fl.ci.ids.filter(id => !fl.vp || id !== fl.vp.id).length;
    const skip = [fl.vp && fl.ci.ids.includes(fl.vp.id) ? vp : "", fl.tr && fl.ci.ids.includes(fl.tr.id) ? tr : ""].filter(Boolean);
    const num = x => Number(x).toLocaleString("en-US");
    let steps = [];
    const lv = leaveCount(d), cf0 = fees(fl.ci.n);
    steps.push(`<li><b>付給${tr}：</b>當天出席 ${fl.ci.n} 人${lv ? `（${lv} 人請假）` : ""}，教練費＋場地費共 ${money(cf0.session)}，每人 <strong>${money(fl.ci.pp)}</strong>${skip.length ? `（${skip.join("和")}自己不用轉）` : ""}。${S.settings.payInfo ? `<br><span class="muted">${esc(S.settings.payInfo)}</span>` : ""}</li>`);
    if(fl.vp){
      const cf = fees(fl.ci.n);
      steps.push(`<li><b>場地費：</b>當天共 ${fl.ci.n} 人，租用 <strong>${cf.two ? 2 : 1} 面</strong>場地，每小時 ${money(cf.rate)}，租 ${S.settings.venueHours} 小時，共 <strong>${money(fl.venue)}</strong>，請${vp}先付給館方${fl.vpShare ? `，自己的課費 ${money(fl.vpShare)} 直接從中扣除。` : `（${vp}當天請假，不用分攤課費）。`}</li>`);
      if(fl.net > 0){
        const done = fl.reimb;
        steps.push(`<li><b>${tr}付給${vp}：</b>${fl.vpShare ? `場地費扣除${vp}自己的課費後，付還 <strong>${money(fl.net)}</strong>（${num(fl.venue)}－${num(fl.vpShare)}）。` : `${vp}當天請假，場地費全額付還 <strong>${money(fl.net)}</strong>。`}</li>`);
      } else if(fl.net < 0){
        steps.push(`<li><b>${vp}補給${tr}：</b>${vp}的課費 ${money(fl.vpShare)} 比場地費多，要再補 <strong>${money(-fl.net)}</strong>。</li>`);
      }
    }
    steps.push(`<li><b>${tr}付給${esc(S.settings.coachNick || "教練")}：</b>教練費 ${money(fl.coach)}。</li>`);
    const payers = fl.ci.ids.filter(id => !(fl.vp && id === fl.vp.id) && !(fl.tr && id === fl.tr.id)).length;
    const row = (a, amt, b, hubA, hubB) => `<div class="fm-row"><span class="fm-node${hubA ? " hub" : ""}">${a}</span><span class="fm-arrow">${amt}</span><span class="fm-node${hubB ? " hub" : ""}">${b}</span></div>`;
    const map = `<div class="flowmap" role="img" aria-label="錢的流向圖">
      ${row(`隊友 ${payers} 人`, `每人 ${num(fl.ci.pp)}`, tr, false, true)}
      ${fl.vp ? row(vp, num(fl.venue), "館方", false, false) : ""}
      ${fl.vp && fl.net > 0 ? row(tr, num(fl.net), vp, true, false) : ""}
      ${row(tr, num(fl.coach), esc(S.settings.coachNick || "教練"), true, false)}
    </div>`;
    return `<div class="card flow"><h2>錢怎麼走？</h2>${map}<ol class="steps">${steps.join("")}</ol>
      </div>`;
  }

  // 繳費文件：class-<日期>（保留匯款紀錄）
  const payDoc = (key, records) => ({ ...(S.pay[key] || {}), date: key.slice(6), records });
  const payLabel = key => `${md(key.slice(6))} `;

  // 收付狀態標籤：管理員點一下可記下／取消
  const flowPill = (ok, text, kind, d) => S.canWrite
    ? `<button class="pill ${ok ? "ok" : "bad"} tap" data-act="${kind}-${ok ? "undo" : "save"}" data-date="${d}"${dis()}>${text}</button>`
    : `<span class="pill ${ok ? "ok" : "bad"}">${text}</span>`;

  // 一份繳費名單
  function payList(key, list, defAmt, d, cls = ""){
    const rec = (S.pay[key] && S.pay[key].records) || {};
    return `<ul class="list${cls ? " " + cls : ""}">` + list.map(m => {
      const r = rec[m.id], tok = key + "|" + m.id;
      const amt = d ? oweAmount(m, d) : defAmt;
      if(!r && d && settledByVenue(m, d)){
        return `<li class="row"><div class="who"><b>${esc(m.name)}</b>${tagHtml(m)}</div><div class="actions stack">${(ok => flowPill(ok, ok ? "✓ 已付給館方" : "還沒付給館方", "venue", d))(!!flowOf(d).venuePaid)}</div></li>`;
      }
      if(!r && d && isTreasurer(m)){
        return `<li class="row"><div class="who"><b>${esc(m.name)}</b>${tagHtml(m)}</div>${(() => { const fl = flowOf(d), cn = esc(S.settings.coachNick || "教練"), pill = (ok, t, k) => flowPill(ok, (ok ? "✓ 已付給" : "還沒付給") + t, k, d); return `<div class="actions stack">${fl.vp && fl.net > 0 ? pill(!!fl.reimb, esc(vpName()), "reimb") : ""}${pill(!!fl.coachPaid, cn, "coach")}</div>`; })()}</li>`;
      }
      const right = `<div class="actions">${S.canWrite
        ? `<button class="pill ${r ? "ok" : "bad"}" data-act="${r ? "pay-del" : "pay-save"}" data-key="${key}" data-id="${m.id}" data-amt="${amt}">${r ? "✓ 已付" : "還沒付"}</button>`
        : `<span class="pill ${r ? "ok" : "bad"}">${r ? "✓ 已付" : "還沒付"}</span>`}</div>`;
      return `<li class="row">
        <div class="who"><b>${esc(m.name)}</b>${tagHtml(m)}
</div>
        ${right}</li>`;
    }).join("") + `</ul>`;
  }

  // 統計
  function viewStats(sch){
    const list = active();
    if(!list.length) return noMembers();
    const t = today();
    const past = sch.filter(i => i.date <= t && i.date >= S.settings.start);
    const held = past.filter(i => i.status === "held" || i.status === "single").length;
    const paused = past.filter(i => i.status === "paused");
    const rows = list.map(m => {
      let p=0, l=0, a=0;
      Object.keys(S.att).filter(d => d >= S.settings.start).forEach(d => { const s = (S.att[d].records||{})[m.id]; if(s==="present")p++; if(s==="leave")l++; if(s==="absent")a++; });
      const owed = m.role === "coach" ? [] : owedBy(m, sch);
      return {m, p, l, a, owed};
    });
    const owing = rows.filter(r => r.owed.length).length;
    return `
      <div class="summary">
        <div class="stat ok"><b>${held}</b><span>已經上了幾堂</span></div>
        <div class="stat warn"><b>${paused.length}</b><span>請假暫停幾週</span></div>
        <div class="stat bad"><b>${owing}</b><span>有欠費的隊友</span></div>
      </div>
      <ul class="list pair">${rows.map(r => `<li class="row">
        <div class="who"><b>${esc(r.m.name)}</b>${tagHtml(r.m)}</div>
        <div class="mini">${[["ok", "出席", r.p], ["warn", "請假", r.l], ["bad", "缺席", r.a]].map(([c, k, n]) => `<div class="${n ? c : "zero"}"><b>${n}</b><span>${k}</span></div>`).join("")}</div>
        ${r.owed.length
          ? `<div class="paybar bad"><b>還沒付 ${r.owed.length} 堂</b><div class="chips">${r.owed.map(x => `<span class="pill warn">${md(x)}</span>`).join("")}</div></div>`
          : `<div class="paybar ok"><b>✓ 都付清了</b></div>`}
      </li>`).join("")}</ul>
      <p class="muted">只算已經上過的課；整班暫停的那週不收費，有人請假時只算沒請假的人。</p>
      ${ledgerCard(sch)}
      ${paused.length ? `<div class="card"><h2>哪幾週暫停過</h2><ul class="list">${paused.map(i => `<li class="row"><div class="who"><b>${labelDate(i.date)}</b><span class="sub">${esc(leaversOf(i.date).join("、"))} 請假</span></div></li>`).join("")}</ul></div>` : ""}`;
  }

  // 吉哥對帳：有點名或收款紀錄、或已經上過的每一堂
  function ledgerRows(sch){
    const t = today();
    return sch.filter(i => i.date >= S.settings.start && billable(i.status) && (i.date <= t || S.att[i.date] || S.pay[payKey(i.date)]))
      .map(i => { const d = i.date, ci = classInfo(d); if(!ci.n) return null;
        const fl = flowOf(d), f = fees(ci.n), rec = (S.pay[payKey(d)] || {}).records || {};
        const must = players().filter(m => ci.ids.includes(m.id) && !selfSettled(m, d));
        const due = must.length * ci.pp, got = must.reduce((a, m) => a + (rec[m.id] ? Number(rec[m.id].amount || ci.pp) : 0), 0);
        return { d, n: ci.n, pp: ci.pp, due, got, left: must.filter(m => !rec[m.id]).length,
          reimb: fl.vp && fl.net > 0 ? fl.net : 0, reimbDone: !!fl.reimb, coach: f.coach, coachDone: !!fl.coachPaid,
          extra: ci.pp * ci.n - f.session };
      }).filter(Boolean);
  }
  function ledgerCard(sch){
    const rows = ledgerRows(sch);
    if(!rows.length) return "";
    const num = x => Number(x).toLocaleString("en-US"), tr = esc(trName()), vp = esc(vpName()), cn = esc(S.settings.coachNick || "教練");
    const sum = k => rows.reduce((a, r) => a + r[k], 0);
    const settled = rows.filter(r => !r.left && (r.reimbDone || !r.reimb) && r.coachDone);
    const ok = (b, t) => `<td class="num ${b ? "ok" : "bad"}">${b ? "✓" : t}</td>`;
    return `<div class="card">
      <h2>${tr}對帳</h2>
      <div class="tablewrap"><table class="ledger">
        <thead><tr><th>日期</th><th class="num">人數</th><th class="num">應收</th><th class="num">已收</th><th class="num">付${vp}</th><th class="num">付${cn}</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td>${md(r.d)}</td><td class="num">${r.n}</td><td class="num">${num(r.due)}</td><td class="num ${r.left ? "bad" : "ok"}">${num(r.got)}${r.left ? `<br><small>差 ${r.left} 人</small>` : ""}</td>${r.reimb ? ok(r.reimbDone, num(r.reimb)) : `<td class="num">—</td>`}${ok(r.coachDone, num(r.coach))}</tr>`).join("")}</tbody>
      </table></div>
      <table class="calc">
        <tr><td>隊友應付給${tr}</td><td></td><td>${money(sum("due"))}</td></tr>
        <tr><td>已經收到</td><td></td><td>${money(sum("got"))}</td></tr>
        <tr><td>還沒收到</td><td></td><td>${money(sum("due") - sum("got"))}</td></tr>
        <tr class="total"><td>班費（進位多收的零頭）</td><td>已結清 ${settled.length} 堂</td><td>${money(settled.reduce((a, r) => a + r.extra, 0))}</td></tr>
      </table>
      <p class="muted">「付${vp}」「付${cn}」欄：✓ 代表已付，紅字是還沒付的金額。班費只算錢都收付完的那幾堂。</p>
      ${S.canWrite ? `<div class="actions"><button class="btn small" data-act="export-csv">匯出 Excel 備份</button></div>` : ""}
    </div>`;
  }
  function exportCsv(){
    const sch = schedule(), out = [["日期","姓名","分級","出席狀態","應付","已付"]];
    const STN = { present: "出席", leave: "請假", absent: "缺席" };
    ledgerRows(sch).forEach(r => {
      const rec = (S.att[r.d] && S.att[r.d].records) || {}, pay = (S.pay[payKey(r.d)] || {}).records || {};
      const ids = classInfo(r.d).ids;
      players().forEach(m => {
        const going = ids.includes(m.id), self = going && selfSettled(m, r.d);
        out.push([r.d, m.name, m.cls || "", STN[rec[m.id]] || (going ? "出席" : ""), going ? r.pp : 0, !going ? "" : self ? "免轉（財務／場地）" : pay[m.id] ? "已付" : "還沒付"]);
      });
    });
    const csv = "\ufeff" + out.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = (S.settings.group || "點名簿") + "_備份_" + today() + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    toast("已下載備份，可以用 Excel 打開");
  }

  // 隊友
  function viewMembers(){

        : `<button class="btn small danger" data-act="del-ask" data-id="${m.id}"${dis()}>刪除</button>`;

        <div class="stat"><b>${money(f.pp)}</b><span>每人每堂</span></div>
        <div class="stat"><b>${money(f.session)}</b><span>一堂總共</span></div>
      </div>
      ${on.length ? `<h3>上課中的隊友（${on.length} 人）</h3><ul class="list pair">${on.map(row).join("")}</ul>${adminHintP("排序：先看分級，同分級再照姓名筆畫。")}` : `<div class="empty"><b>名單還是空的</b>${S.canWrite ? "用下面的表單加入第一位隊友吧。" : "請管理員登入後加入隊友。"}</div>`}
      ${!S.canWrite ? "" : `<div class="card">
        <h2>加入新隊友</h2>
        <div class="fields">
          <label class="field"><span>姓名</span><input id="newName" placeholder="例如：陳小美" value="${v("newName")}"${dis()}></label>
          <label class="field"><span>分級</span><select id="newCls"${dis()}>${CLASSES.map(c => `<option${(d.newCls||"未分級")===c?" selected":""}>${c}</option>`).join("")}</select></label>
          <label class="field"><span>備註（可以不填）</span><input id="newNote" placeholder="例如：運輪放球館" value="${v("newNote")}"${dis()}></label>

        <p class="muted">加人或有人停課後，每個人的費用會自動重算。</p>
      </div>`}
      ${off.length ? `<h3>暫時停課（${off.length} 人）</h3><p class="muted">停課的隊友不會出現在點名和繳費名單，也不分攤費用；以前的紀錄都還在。</p><ul class="list pair">${off.map(row).join("")}</ul>` : ""}
      ${!S.canWrite ? "" : `<div class="card">
        <h2>課程和費用設定</h2>
        <div class="fields">
          <label class="field"><span>班名</span><input id="set_group" value="${v("set_group", s.group)}"${dis()}></label>
          <label class="field"><span>地點</span><input id="set_location" value="${v("set_location", s.location)}"${dis()}></label>
          <label class="field"><span>上課時間</span><input id="set_time" value="${v("set_time", s.time)}"${dis()}></label>
          <label class="field"><span>第一堂是哪天</span><input id="set_start" type="date" value="${v("set_start", s.start)}"${dis()}></label>
          <label class="field"><span>教練課幾小時（每堂）</span><input id="set_coachHours" type="number" inputmode="decimal" min="0" step="0.5" value="${v("set_coachHours", s.coachHours)}"${dis()}></label>
          <label class="field"><span>教練費（每小時）</span><input id="set_coachRate" type="number" inputmode="numeric" min="0" value="${v("set_coachRate", s.coachRate)}"${dis()}></label>
          <label class="field"><span>場地租幾小時（每堂）</span><input id="set_venueHours" type="number" inputmode="decimal" min="0" step="0.5" value="${v("set_venueHours", s.venueHours)}"${dis()}></label>
          <label class="field"><span>1 面場地費（每小時，身障半價後）</span><input id="set_venueRate" type="number" inputmode="numeric" min="0" value="${v("set_venueRate", s.venueRate)}"${dis()}></label>
          <label class="field"><span>幾人以上開 2 面場地（填 0 ＝不開）</span><input id="set_bigMin" type="number" inputmode="numeric" min="0" value="${v("set_bigMin", s.bigMin)}"${dis()}></label>
          <label class="field"><span>2 面包場費（每小時，身障半價後）</span><input id="set_venueRate2" type="number" inputmode="numeric" min="0" value="${v("set_venueRate2", s.venueRate2)}"${dis()}></label>
          <label class="field"><span>誰負責維護管理</span><select id="set_manager"${dis()}><option value="">（沒有指定）</option>${on.map(m => `<option value="${m.id}"${(d.set_manager ?? s.manager) === m.id ? " selected" : ""}>${esc(m.name)}</option>`).join("")}</select></label>
          <label class="field"><span>財務</span><select id="set_treasurer"${dis()}><option value="">（沒有指定）</option>${on.map(m => `<option value="${m.id}"${(d.set_treasurer ?? s.treasurer) === m.id ? " selected" : ""}>${esc(m.name)}</option>`).join("")}</select></label>
          <label class="field"><span>場地（先付場地費給館方）</span><select id="set_venuePayer"${dis()}><option value="">（沒有指定）</option>${on.map(m => `<option value="${m.id}"${(d.set_venuePayer ?? s.venuePayer) === m.id ? " selected" : ""}>${esc(m.name)}</option>`).join("")}</select></label>
          <label class="field"><span>財務的稱呼（提醒裡用）</span><input id="set_trNick" placeholder="例如：吉哥" value="${v("set_trNick", s.trNick)}"${dis()}></label>
          <label class="field"><span>場地的稱呼（提醒裡用）</span><input id="set_vpNick" placeholder="例如：芳玉" value="${v("set_vpNick", s.vpNick)}"${dis()}></label>
          <label class="field" style="grid-column:1/-1"><span>收款方式（會顯示給大家看）</span><input id="set_payInfo" placeholder="例如：LINE Pay 轉給吳宗吉，或上課時給現金" value="${v("set_payInfo", s.payInfo)}"${dis()}></label>
        </div>
        <div class="actions"><button class="btn primary" data-act="settings-save"${dis()}>存檔</button></div>
      </div>`}
      `;
  }

  // ---------- events ----------
  document.querySelector(".tabs").addEventListener("click", e => {
    const b = e.target.closest("[data-tab]"); if(!b) return;
    S.tab = b.dataset.tab; S.payOpen = S.payConfirm = S.editId = S.delConfirm = null; render(); window.scrollTo(0,0);
  });
  app.addEventListener("input", e => { if(e.target.id) S.draft[e.target.id] = e.target.value; });
  app.addEventListener("change", e => {
    const t = e.target;
    // 開課日（12/5）之前的日期不列，選到更早就跳回開課日
    const clamp = v => v < S.settings.start ? S.settings.start : v;
    if(t.id === "datePick" && t.value){ S.date = clamp(t.value); render(); }
    else if(t.id === "payDatePick" && t.value){ S.payDate = clamp(t.value); S.payOpen = S.payConfirm = null; render(); }
    else if(t.id) S.draft[t.id] = t.value;
  });

  app.addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
    const act = b.dataset.act, id = b.dataset.id;

    switch(act){
      case "goto": S.tab = b.dataset.tab; render(); break;
      case "date": {
        const dates = schedule().map(i => i.date);
        const n = +b.dataset.n, i = dates.indexOf(S.date);
        if(i >= 0 && dates[i+n]) S.date = dates[i+n];
        else if(i < 0){ const nb = n > 0 ? dates.find(d => d > S.date) : [...dates].reverse().find(d => d < S.date); S.date = nb || shiftDate(S.date, 7*n); }
        else S.date = shiftDate(S.date, 7*n);
        if(S.date < S.settings.start) S.date = S.settings.start;
        render(); break;
      }
      case "date-next": S.date = nextClassDate(schedule()); render(); break;
      case "paydate": {
        const dates = schedule().map(i => i.date);
        const n = +b.dataset.n, i = dates.indexOf(S.payDate);
        if(i >= 0 && dates[i+n]) S.payDate = dates[i+n];
        else if(i < 0){ const nb = n > 0 ? dates.find(d => d > S.payDate) : [...dates].reverse().find(d => d < S.payDate); S.payDate = nb || shiftDate(S.payDate, 7*n); }
        else S.payDate = shiftDate(S.payDate, 7*n);
        if(S.payDate < S.settings.start) S.payDate = S.settings.start;
        S.payOpen = S.payConfirm = null; render(); break;
      }
      case "paydate-next": S.payDate = nextClassDate(schedule()); S.payOpen = S.payConfirm = null; render(); break;
      case "paydate-go": S.payDate = b.dataset.date; S.payOpen = S.payConfirm = null; render(); window.scrollTo(0,0); break;

      case "att": {
        const date = S.date, s = b.dataset.s;
        const cur = { ...((S.att[date] && S.att[date].records) || {}) };
        const hadLeave = Object.values(cur).includes("leave");
        if(cur[id] === s) delete cur[id]; else cur[id] = s;
        const hasLeave = Object.values(cur).includes("leave");
        const mode = S.att[date] && S.att[date].mode;
        const doc = { date, records: cur };
        if(hasLeave && mode) doc.mode = mode;
        S.att[date] = doc;
        render();
        write("attendance/"+date, save("attendance", date, doc));
        if(hasLeave && !hadLeave) toast(mode === "single" ? "已記請假，其他人照上" : "有人請假，這週先暫停（也可以改成其他人照上）");
        else if(!hasLeave && hadLeave) toast("沒人請假了，這週照常上團課");
        break;
      }
      case "mode": {
        const date = S.date, v = b.dataset.v;
        const doc = { date, records: { ...((S.att[date] && S.att[date].records) || {}) }, mode: v };
        S.att[date] = doc; render();
        write("attendance/"+date, save("attendance", date, doc));
        toast(v === "single" ? "其他人照上，費用由沒請假的人平分" : "改回整班暫停，這週不收費");
        break;
      }
      case "all-present": {
        const date = S.date;
        const cur = { ...((S.att[date] && S.att[date].records) || {}) };
        active().forEach(m => { if(!cur[m.id]) cur[m.id] = "present"; });
        const doc = { date, records: cur };
        if(S.att[date] && S.att[date].mode && Object.values(cur).includes("leave")) doc.mode = S.att[date].mode;
        S.att[date] = doc; render();
        write("attendance/"+date, save("attendance", date, doc));
        toast("全部標好出席了");
        break;
      }

      case "pay-open": S.payOpen = id ? b.dataset.key + "|" + id : null; S.payConfirm = null; delete S.draft.payAmt; delete S.draft.payDate; delete S.draft.payMethod; render(); break;
      case "pay-method": S.draft.payMethod = b.dataset.v; render(); break;
      case "pay-save": {
        const amt = Number(b.dataset.amt) || 0, date = today();
        const key = b.dataset.key;
        const recs = { ...((S.pay[key] && S.pay[key].records) || {}) };
        recs[id] = { amount: amt, date, method: "" };
        const doc = payDoc(key, recs);
        S.pay[key] = doc; S.payOpen = null; render();
        write("payments/"+key, save("payments", key, doc));
        toast(`記下了：${nameOf(id)} ${payLabel(key)}的錢已經${treasurerOf() ? "給" + trName() : "收到"}`);
        break;
      }
      case "pay-confirm": S.payConfirm = id ? b.dataset.key + "|" + id : null; render(); break;
      case "reimb-method": S.draft.reimbMethod = b.dataset.v; render(); break;
      case "coach-method": S.draft.coachMethod = b.dataset.v; render(); break;
      case "venue-method": S.draft.venueMethod = b.dataset.v; render(); break;
      case "venue-save":
      case "venue-undo": {
        const d = b.dataset.date, key = payKey(d), fl = flowOf(d);
        const doc = { ...(S.pay[key] || {}), date: d, records: (S.pay[key] && S.pay[key].records) || {} };
        if(act === "venue-save") doc.venuePaid = { amount: fl.venue, date: today(), method: S.draft.venueMethod || "LINE Pay" };
        else delete doc.venuePaid;
        S.pay[key] = doc; render();
        write("payments/"+key, save("payments", key, doc));
        toast(act === "venue-save" ? `記下了：${vpName()} 已付館方場地費 ${money(fl.venue)}` : "付館方紀錄取消了");
        break;
      }
      case "coach-save":
      case "coach-undo": {
        const d = b.dataset.date, key = payKey(d), fl = flowOf(d);
        const doc = { ...(S.pay[key] || {}), date: d, records: (S.pay[key] && S.pay[key].records) || {} };
        if(act === "coach-save") doc.coachPaid = { amount: fl.coach, date: today(), method: S.draft.coachMethod || "LINE Pay" };
        else delete doc.coachPaid;
        S.pay[key] = doc; render();
        write("payments/"+key, save("payments", key, doc));
        toast(act === "coach-save" ? `記下了：${trName()} 已匯給${S.settings.coachNick || "教練"} ${money(fl.coach)}` : "教練費紀錄取消了");
        break;
      }
      case "reimb-save":
      case "reimb-undo": {
        const d = b.dataset.date, key = payKey(d), fl = flowOf(d);
        const doc = { ...(S.pay[key] || {}), date: d, records: (S.pay[key] && S.pay[key].records) || {} };
        if(act === "reimb-save") doc.reimb = { amount: fl.net, date: today(), method: S.draft.reimbMethod || "LINE Pay" };
        else delete doc.reimb;
        S.pay[key] = doc; render();
        write("payments/"+key, save("payments", key, doc));
        toast(act === "reimb-save" ? `記下了：${trName()} 已匯 ${money(fl.net)} 給 ${vpName()}` : "匯款紀錄取消了");
        break;
      }
      case "pay-del": {
        const key = b.dataset.key;
        const recs = { ...((S.pay[key] && S.pay[key].records) || {}) };
        delete recs[id];
        const doc = payDoc(key, recs);
        S.pay[key] = doc; S.payConfirm = null; render();
        write("payments/"+key, save("payments", key, doc));
        toast(`${nameOf(id)} 改回還沒付`);
        break;
      }
      case "export-csv": exportCsv(); break;
      case "copy-class":
      case "copy-owed": {
        let text;
        const tr = trName(), info = S.settings.payInfo ? `（${S.settings.payInfo}）` : "";
        if(act === "copy-class"){
          const d = b.dataset.date, fl = flowOf(d), ci = fl.ci;
          const rec = (S.pay[payKey(d)] && S.pay[payKey(d)].records) || {};
          const unpaid = players().filter(m => ci.ids.includes(m.id) && !rec[m.id] && !selfSettled(m, d)).map(m => m.name);
          const leave = leaversOf(d);
          text = `🏸【${S.settings.group}】${labelDate(d)} 課費\n` +
            (leave.length ? `${leave.join("、")} 請假，其他 ${ci.n} 位照常上課。\n` : "") +
            `一堂 ${money(fees(ci.n).session)}（${fees(ci.n).two ? 2 : 1} 面場地），${ci.n} 位平分，每人 ${money(ci.pp)}。\n` +
            (treasurerOf() ? `👉 請把 ${money(ci.pp)} 轉給 ${tr}${info}。\n` : "") +
            (fl.vp && fl.vpShare && fl.net >= 0 ? `${vpName()} 已經先付場地費 ${money(fl.venue)}，他的課費直接扣掉，${tr} 會再匯 ${money(fl.net)} 給他。\n` : "") +
            (fl.vp && !fl.vpShare && fl.net > 0 ? `${vpName()} 已經先付場地費 ${money(fl.venue)}，${tr} 會再匯 ${money(fl.net)} 給他。\n` : "") +
            (unpaid.length ? `還沒轉的：${unpaid.join("、")}，再麻煩大家囉，謝謝！` : `大家的錢都收齊了，謝謝大家！`);
        } else {
          const sch = schedule();
          const lines = players().map(m => ({ m, ds: owedBy(m, sch) })).filter(x => x.ds.length)
            .map(x => `・${x.m.name}：${x.ds.map(md).join("、")}，一共 ${money(x.ds.reduce((a, dd) => a + oweAmount(x.m, dd), 0))}`);
          text = `🏸【${S.settings.group}】還沒繳的課費\n${lines.join("\n")}\n` +
            (treasurerOf() ? `請轉給 ${tr}${info}，` : "") + `再麻煩大家囉，謝謝！`;
        }
        try { await navigator.clipboard.writeText(text); toast("複製好了，可以貼到 LINE 囉"); }
        catch(_) {
          const box = b.closest(".card") || b.parentElement; const ta = document.createElement("textarea");
          ta.value = text; ta.rows = 5; ta.style.width = "100%"; box.appendChild(ta); ta.select(); toast("請長按選取文字再複製");
        }
        break;
      }

      case "add": {
        const name = document.getElementById("newName").value.trim();
        if(!name){ toast("請先填姓名"); document.getElementById("newName").focus(); break; }
        const data = { name, role: "player", cls: document.getElementById("newCls").value,
          phone: "", note: document.getElementById("newNote").value.trim(),
          active: true, createdAt: Date.now() };
        const newId = "m" + Date.now().toString(36);
        S.members = S.members.concat([{ id: newId, ...data }]).sort(byClassThenStroke);
        S.draft.newName = S.draft.newNote = "";
        write("members/"+newId, save("members", newId, data));
        toast(`歡迎 ${name} 加入！`);
        render();
        break;
      }
      case "edit": S.editId = id || null; ["editName","editCls","editNote"].forEach(k => delete S.draft[k]); render(); break;
      case "edit-save": {
        const m = S.members.find(x => x.id === id); if(!m) break;
        const name = document.getElementById("editName").value.trim();
        if(!name){ toast("姓名不能空白喔"); break; }
        const data = { name, role: "player", cls: document.getElementById("editCls").value,
          phone: m.phone || "", note: document.getElementById("editNote").value.trim(),
          active: m.active !== false, createdAt: m.createdAt || Date.now() };
        S.members = S.members.map(x => x.id === id ? { id, ...data } : x).sort(byClassThenStroke);
        S.editId = null; render();
        write("members/"+id, save("members", id, data));
        toast("存好了");
        break;
      }
      case "toggle": {
        const m = S.members.find(x => x.id === id); if(!m) break;
        const next = m.active === false;
        const updated = { ...m, active: next }; delete updated.id;
        S.members = S.members.map(x => x.id === id ? { id, ...updated } : x);
        render();
        write("members/"+id, save("members", id, updated));
        toast(next ? `${m.name} 回來上課了，費用已重算` : `${m.name} 先停課，費用已重算`);
        break;
      }
      case "del-ask": S.delConfirm = id || null; render(); break;
      case "del": {
        S.delConfirm = null;
        const nm = nameOf(id);
        S.members = S.members.filter(x => x.id !== id);
        render();
        write("members/"+id, remove("members", id));
        toast(`已刪除 ${nm}`);
        break;
      }
      case "settings-save": {
        const next = { ...S.settings };
        ["group","location","time","start","manager","treasurer","venuePayer","payInfo","trNick","vpNick"].forEach(k => { next[k] = document.getElementById("set_"+k).value.trim(); });
        NUMS.forEach(k => { const n = Number(document.getElementById("set_"+k).value); next[k] = n >= 0 ? n : DEF[k]; });
        if(!next.start) next.start = DEF.start;
        delete next.perTerm;
        S.settings = next;
        Object.keys(S.draft).filter(k => k.startsWith("set_")).forEach(k => delete S.draft[k]);
        S.date = null; S.payDate = null; render();
        write("settings/main", save("settings", "main", next));
        toast("設定存好了，費用已重算");
        break;
      }
    }
  });

  // ---------- data（Google 試算表） ----------
  let pendingWrites = 0;
  async function load(){
    try {
      const d = await gs("getData");
      if(pendingWrites || staged.size) return; // 還有資料在存或還沒儲存，先不要蓋掉畫面
      S.members = Object.keys(d.members || {}).map(id => ({ id, ...d.members[id] })).sort(byClassThenStroke);
      S.att = d.attendance || {};
      S.pay = d.payments || {};
      const first = !S.loaded.settings;
      const v = (d.settings || {}).main;
      if(v){
        const next = { ...DEF, ...v };
        NUMS.forEach(k => { next[k] = Number(next[k]); if(!(next[k] >= 0)) next[k] = DEF[k]; });
        S.settings = next;
      }
      S.loaded.members = S.loaded.settings = true;
      if(first){ S.date = null; S.payDate = null; }
      if(!S.loginOpen) renderAdminBar();   // 名單載入後補上管理員名字
      if(noticeEl.textContent.startsWith("暫時連不上")) notice("");
      scheduleRender();
    } catch(e){
      if(!S.loaded.members){ S.loaded.members = true; render(); }
      notice("暫時連不上資料，畫面可能不是最新的，檢查一下網路再重新整理。");
    }
  }
  async function start(){
    S.online = true;
    // 記得這台裝置登入過的管理密碼
    let saved = ""; try { saved = localStorage.getItem("ylAdminPw") || ""; } catch(_){}
    if(saved){
      try { if(await gs("checkPassword", saved)){ S.pw = saved; S.canWrite = true; } } catch(_){}
    }
    renderAdminBar();
    await load();
    // 每 30 秒自動更新一次，看到別人剛記的資料
    setInterval(() => { if(document.visibilityState === "visible") load(); }, 30000);
    document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") load(); });
  }

  // ---------- 管理員登入 ----------
  const adminBar = document.getElementById("adminBar");
  function renderAdminBar(){
    if(!S.online){ adminBar.hidden = true; return; }
    adminBar.hidden = false;
    if(S.canWrite){
      adminBar.innerHTML = `<div class="admin on"><span>管理員模式：可以點名、記收款、改設定</span><button class="btn small" id="logoutBtn">登出</button></div>`;
    } else if(S.loginOpen){
      adminBar.innerHTML = `<form class="admin" id="loginForm"><label class="field" style="flex:1 1 180px"><span>管理密碼</span><input id="pwInput" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label><button class="btn small" type="button" id="pwShow">顯示</button><button class="btn small primary" type="submit">登入</button><button class="btn small" type="button" id="loginCancel">先不要</button><span id="pwHint" class="muted" style="flex-basis:100%" hidden>密碼不對喔。請按「顯示」確認打的字：數字和英文要用半形，也要注意瀏覽器是不是自動帶入了舊密碼。</span></form>`;
      setTimeout(() => { const el = document.getElementById("pwInput"); if(el) el.focus(); }, 0);
    } else {
      const mg = active().find(m => m.id === S.settings.manager);
      adminBar.innerHTML = `<div class="admin"><span>目前是查看模式，大家都能看。${mg ? `資料有問題請找管理員 <b>${esc(mg.name)}</b>。` : ""}</span><button class="btn small" id="loginBtn">管理員登入</button></div>`;
    }
  }
  adminBar.addEventListener("click", e => {
    if(e.target.id === "loginBtn"){ S.loginOpen = true; renderAdminBar(); }
    else if(e.target.id === "loginCancel"){ S.loginOpen = false; renderAdminBar(); }
    else if(e.target.id === "pwShow"){
      const el = document.getElementById("pwInput"), show = el.type === "password";
      el.type = show ? "text" : "password"; e.target.textContent = show ? "隱藏" : "顯示"; el.focus();
    }
    else if(e.target.id === "logoutBtn"){
      if(staged.size && !confirm("還有修改沒儲存，登出會放棄這些修改，確定嗎？")) return;
      staged.clear(); changes = 0; renderSaveBar();
      S.pw = ""; S.canWrite = false; S.loginOpen = false;
      try { localStorage.removeItem("ylAdminPw"); } catch(_){}
      renderAdminBar(); render(); toast("登出了，現在是查看模式");
    }
  });
  adminBar.addEventListener("submit", async e => {
    e.preventDefault();
    // 中文輸入法常打出全形數字或多一個空白，先轉成半形、去掉前後空白
    const pw = document.getElementById("pwInput").value.normalize("NFKC").trim();
    if(!pw){ toast("請輸入密碼"); return; }
    try {
      if(await gs("checkPassword", pw)){
        S.pw = pw; S.canWrite = true; S.loginOpen = false;
        try { localStorage.setItem("ylAdminPw", pw); } catch(_){}
        renderAdminBar(); render(); toast("登入成功，可以開始點名了");
      } else {
        toast("密碼不對，再試一次");
        const h = document.getElementById("pwHint"); if(h) h.hidden = false;
      }
    } catch(err){ toast("連不上資料，請檢查網路後重新整理頁面"); }
  });

  render();
  start();
})();
</script>
</body>
</html>
