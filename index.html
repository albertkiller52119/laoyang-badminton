<style>
/* Layout: one-column phone-first app. Court-blue sticky header with four tabs; each tab is a list of member rows with large tap targets. */
:root{
  --bg:#eef3f5;
  --surface:#ffffff;
  --surface-2:#f6f9fa;
  --fg:#11222c;
  --muted:#566874;
  --line:#d5dfe4;
  --court:#0d5870;
  --court-2:#0a4a5f;
  --court-ink:#ffffff;
  --court-soft:rgba(255,255,255,.72);
  --shuttle:#f0b400;
  --accent:#0d6f8c;
  --accent-soft:#dcedf2;
  --ok:#1b7445; --ok-bg:#ddf1e5;
  --warn:#8f5500; --warn-bg:#fcefd3;
  --bad:#ad2a22; --bad-bg:#fae2df;
  --c-coach:#5b45a8; --c-coach-bg:#ebe6f7; --c-venue:#9a5200; --c-venue-bg:#fcebd5;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c161c; --surface:#13222b; --surface-2:#182a34; --fg:#e7f0f3; --muted:#9bb0ba; --line:#28404c;
    --court:#0b3f51; --court-2:#08323f; --court-ink:#f2f8fa; --court-soft:rgba(242,248,250,.7);
    --shuttle:#ffc933; --accent:#5ec3df; --accent-soft:#163947;
    --ok:#6fd49b; --ok-bg:#153626; --warn:#f2bb5c; --warn-bg:#3a2a0d; --bad:#ff8f86; --bad-bg:#3d1714;
    --c-coach:#b8a4f2; --c-coach-bg:#2a2244; --c-venue:#f2bb5c; --c-venue-bg:#3a2a0d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c161c; --surface:#13222b; --surface-2:#182a34; --fg:#e7f0f3; --muted:#9bb0ba; --line:#28404c;
  --court:#0b3f51; --court-2:#08323f; --court-ink:#f2f8fa; --court-soft:rgba(242,248,250,.7);
  --shuttle:#ffc933; --accent:#5ec3df; --accent-soft:#163947;
  --ok:#6fd49b; --ok-bg:#153626; --warn:#f2bb5c; --warn-bg:#3a2a0d; --bad:#ff8f86; --bad-bg:#3d1714;
  --c-coach:#b8a4f2; --c-coach-bg:#2a2244; --c-venue:#f2bb5c; --c-venue-bg:#3a2a0d;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1rem;line-height:1.6;font-variant-numeric:tabular-nums}
html.big{font-size:118.75%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--court)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--shuttle);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--court);color:var(--court-ink)}
.top .wrap{padding-block:14px 0;display:grid;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;flex:none}
.fontbtn{flex:none;min-width:52px;min-height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:var(--court-ink);font-weight:900;font-size:1rem;line-height:1.1}
.fontbtn small{display:block;font-size:.65rem;font-weight:700;opacity:.85}
.fontbtn[aria-pressed="true"]{background:var(--shuttle);border-color:var(--shuttle);color:#11222c}
.top .wrap{transition:padding .2s,gap .2s}
.top.shrunk .wrap{padding-top:6px;gap:4px}
.top.shrunk .brand p{display:none}
.top.shrunk .mark{width:28px;height:28px}
.top.shrunk .brand h1{font-size:1.02rem}
.top.shrunk .fontbtn{min-height:36px;min-width:44px}
.top.shrunk .fontbtn small{display:none}
.top.shrunk .tabs button{min-height:42px}
.brand h1{margin:0;font-size:1.3rem;font-weight:900;letter-spacing:.02em;line-height:1.2;text-wrap:balance}
.brand p{margin:0;font-size:.88rem;color:var(--court-soft)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{background:none;border:0;border-bottom:4px solid transparent;color:var(--court-soft);padding:10px 4px 9px;font-size:1.02rem;font-weight:700;min-height:48px}
.tabs button[aria-selected="true"]{color:var(--court-ink);border-bottom-color:var(--shuttle)}

main{padding-block:18px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.admin{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;padding:10px 14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:.92rem}
.admin > span{align-self:center}
.admin.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.notice{margin-top:14px;padding:12px 14px;border-radius:var(--radius);background:var(--warn-bg);color:var(--warn);font-weight:500}

.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.5rem;line-height:1;display:grid;place-items:center}
.nav:disabled{opacity:.4;cursor:not-allowed}
.picker{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;height:48px;border-radius:24px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:1.08rem;padding:0 12px}
.picker input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.picker.static{cursor:default}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 6px;min-height:44px}

.banner{padding:12px 14px;border-radius:var(--radius);font-weight:700;display:grid;gap:2px}
.banner small{font-weight:500;font-size:.9rem}
.banner.ok{background:var(--accent-soft);color:var(--accent)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.rules{background:var(--warn-bg);color:var(--fg);border-left:5px solid var(--shuttle);border-radius:var(--radius);padding:12px 14px 12px 16px;display:grid;gap:6px}
.rules b{color:var(--warn);font-size:.95rem;letter-spacing:.04em}
.rules ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.rules li{font-size:.95rem}
.rules strong{font-weight:900}
.rules .rule-list{margin:0;padding-left:1.3em;display:grid;gap:10px}
.rules .rule-list > li::marker{color:var(--warn)}
.rules ol.rule-list ul{margin-top:4px}

.summary{display:flex;flex-wrap:nowrap;gap:6px}
/* 繳費頁：這堂摘要卡 */
.hero{background:linear-gradient(135deg,var(--accent) 0%,#0a4a5f 100%);color:#fff;border-radius:var(--radius);padding:16px 18px;display:grid;gap:10px;box-shadow:0 6px 18px rgba(10,74,95,.18)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:.95rem;opacity:.95}
.hero-chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 10px;font-size:.85rem;white-space:nowrap}
.hero-main{display:flex;align-items:baseline;gap:8px}
.hero-main b{font-size:2.4rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:#ffc933}
.hero-main span{font-weight:700;opacity:.9}
.hero-meta{font-size:.9rem;opacity:.92;line-height:1.5}
.hero-prog{display:grid;gap:5px;font-size:.88rem;font-weight:700}
.hero-bar{height:10px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden}
.hero-bar i{display:block;height:100%;border-radius:999px;background:#ffc933;transition:width .3s}
.hero-note{font-size:.82rem;opacity:.85;border-top:1px dashed rgba(255,255,255,.3);padding-top:8px}
/* 錢怎麼走：流向圖 */
/* 規則收合 */
details.rules > summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.rules > summary::-webkit-details-marker{display:none}
details.rules > summary::after{content:"點開看 ▾";font-size:.8rem;font-weight:700;color:var(--warn)}
details.rules[open] > summary::after{content:"收起 ▴"}
.deadline{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--radius);background:var(--surface);border:1px dashed var(--line);font-size:.92rem}
.deadline b{color:var(--warn)}
.deadline.past b{color:var(--muted)}
/* 統計頁：對帳表 */
.ledger td.ok{color:var(--ok)} .ledger td.bad{color:var(--bad)}
.ledger small{display:block;font-size:.72rem;font-weight:700;color:var(--muted);margin-top:2px;white-space:nowrap}
.ledger td.bad small{color:var(--bad)}
.tablewrap table.ledger{min-width:0;font-size:.95rem}
.tablewrap table.ledger th,.tablewrap table.ledger td{padding:12px 6px;line-height:1.25}
.tablewrap table.ledger th{font-size:.78rem;letter-spacing:0;white-space:nowrap}
.tablewrap table.ledger td:first-child{padding-left:12px}
.tablewrap table.ledger td.num{font-size:.98rem;white-space:nowrap}
.tablewrap table.ledger tbody tr:nth-child(even) td{background:var(--surface-2)}
@media (prefers-reduced-motion: reduce){.hero-bar i{transition:none}}
.stat{flex:1 1 0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center}
.stat b{display:block;font-size:1.15rem;font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{display:block;font-size:.75rem;color:var(--muted);line-height:1.25}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}

.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.actions.stack{flex-direction:column;align-items:flex-end;gap:6px}
.btn{min-height:48px;padding:0 18px;border-radius:24px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:44px;padding:0 16px;font-size:.92rem}
.btn:disabled,.seg button:disabled{opacity:.45;cursor:not-allowed}

.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;padding:12px 14px;flex-wrap:wrap}
.row+.row{border-top:1px solid var(--line)}
.who{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1 1 140px;flex-wrap:wrap}
.who b{font-size:1.12rem;font-weight:700}
.tag{font-size:.75rem;font-weight:700;letter-spacing:.06em;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.tag.role{background:var(--warn-bg);color:var(--warn)}
.steps{margin:0;padding-left:1.4em;display:grid;gap:10px}
.steps li{line-height:1.55}
.steps li::marker{font-weight:900;color:var(--accent)}
.sz-ed{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;margin-bottom:10px}
.sz-ed-h{display:grid;gap:2px} .sz-ed-h span{font-size:.84rem;color:var(--muted)}
.dchip{min-height:44px;min-width:58px;padding:6px 10px;border-radius:999px;border:2px solid var(--line);background:var(--surface-2);color:var(--muted);font-weight:800;text-decoration:line-through}
.dchip[aria-pressed="true"]{background:var(--c-venue-bg);border-color:var(--c-venue);color:var(--c-venue);text-decoration:none}
.dchip:disabled{opacity:.5}
.calc.fund td small{display:block;font-size:.76rem;color:var(--muted);font-weight:400}
.calc.fund td.ok{color:var(--ok);font-weight:800} .calc.fund td.bad{color:var(--bad);font-weight:800}
.me-att{font-size:.9rem;padding:8px 10px;border-radius:10px;background:var(--accent-soft)}
.me-att b{font-size:1.1rem;color:var(--accent)} .me-att span{color:var(--muted);font-size:.82rem}
.remember{display:flex;align-items:center;gap:8px;flex-basis:100%;font-size:.9rem;min-height:44px}
.remember input{width:22px;height:22px}
.season h2 small{font-size:.8rem;font-weight:700;color:var(--muted);margin-left:8px}
.sz-top{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sz-top>div{background:var(--c-venue-bg);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.sz-top span,.sz-top small{font-size:.8rem;color:var(--muted)}
.sz-top b{font-size:1.3rem;font-weight:900;color:var(--c-venue)}
.sz-bar{display:flex;height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin:12px 0 4px}
.sz-bar i{display:block;height:100%}
.sz-bar .ok,.sz-dot.ok{background:var(--ok)} .sz-bar .bad,.sz-dot.bad{background:var(--bad)} .sz-bar .warn,.sz-dot.warn{background:var(--warn)}
.sz-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:.05em}
.sz-calc tr.bad td{color:var(--bad);font-weight:800}
.fc{display:grid;margin-top:2px}
.fc-step{display:flex;align-items:center;gap:8px;font-weight:900;font-size:.9rem;color:var(--muted);margin:4px 0 8px}
.fc-step:not(:first-child){margin-top:18px}
.fc-no{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--court);color:var(--court-ink);font-size:.8rem}
.fc-box{border-radius:14px;padding:14px 14px 12px;display:grid;gap:6px}
.fc-head{font-weight:900;font-size:.98rem;text-align:center}
.fc-big{font-weight:900;font-size:1.7rem;line-height:1.1;text-align:center;letter-spacing:.01em}
.fc-notes{margin:0;padding:0;list-style:none;text-align:center;display:grid;gap:2px;font-size:.85rem;line-height:1.5;color:var(--muted)}
.fc-line .fc-big{color:var(--accent)}
.fc-notes li::marker{color:var(--muted)}
.fc-notes b{font-weight:900}
.fc-chip{justify-self:center;font-size:.8rem;font-weight:800;padding:3px 12px;border-radius:999px;background:var(--surface);color:var(--accent)}
.fc-blue{background:var(--accent-soft)} .fc-blue .fc-big{color:var(--accent)}
.fc-line{border:1.5px solid var(--accent);background:var(--surface)}
.fc-green{background:var(--c-coach-bg)} .fc-green .fc-big{color:var(--c-coach)}
.fc-orange{background:var(--c-venue-bg)} .fc-orange .fc-big{color:var(--c-venue)}
.fc-split .fc-big{font-size:1.4rem}
.fc-split .fc-notes{padding:0;list-style:none;text-align:center;font-size:.8rem}
.fc-arrow{display:grid;justify-items:center;gap:3px;padding:8px 0}
.fc-ar{font-size:.8rem;line-height:1}
.fc-tag{font-size:.76rem;font-weight:800;padding:2px 10px;border-radius:999px}
.fc-b .fc-ar,.fc-b .fc-tag{color:var(--accent)} .fc-b .fc-tag{background:var(--accent-soft)}
.fc-g .fc-ar,.fc-g .fc-tag{color:var(--c-coach)} .fc-g .fc-tag{background:var(--c-coach-bg)}
.fc-o .fc-ar,.fc-o .fc-tag{color:var(--c-venue)} .fc-o .fc-tag{background:var(--c-venue-bg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem;font-weight:700;color:var(--muted)}
.legend i,.pill[data-cat]::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:.05em;background:var(--cat)}
[data-cat="class"]{--cat:var(--accent)} [data-cat="venue"]{--cat:var(--c-venue)} [data-cat="coach"]{--cat:var(--c-coach)}
.tablewrap th.c-class,.tablewrap th.c-venue,.tablewrap th.c-coach{box-shadow:inset 0 -3px 0 var(--cat)}
.fc-split{display:grid;gap:10px}
.fc-split.fc-two{grid-template-columns:1fr 1fr}
.fc-col{display:grid;grid-template-rows:auto 1fr}
.fc-sum{margin-top:10px;padding:9px 12px;border:1.5px dashed var(--line);border-radius:10px;font-size:.84rem;text-align:center;color:var(--muted);line-height:1.5}
.fc-sum b{color:var(--fg)}
.big-money{margin:0;font-size:1.8rem;font-weight:900;color:var(--warn);font-variant-numeric:tabular-nums}
button.pill{border:0;cursor:pointer;font:inherit;font-size:.88rem;font-weight:700;min-height:44px;padding:8px 14px;white-space:normal;text-align:left;line-height:1.3}
.sub{font-size:.88rem;color:var(--muted);flex-basis:100%}

.seg{display:grid;grid-template-columns:repeat(3,minmax(64px,1fr));gap:6px;flex:1 1 240px;max-width:330px}
.seg button{min-height:52px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);font-weight:700;font-size:1.02rem}
.seg button[aria-pressed="true"][data-s="present"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed="true"][data-s="leave"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.seg button[aria-pressed="true"][data-s="absent"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg.two button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
/* 點名：兩人一排 */
.list.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.list.pair .row{flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:space-between;gap:8px;padding:10px;border-top:0;min-width:0}
.list.pair .row:nth-child(n+3){border-top:1px solid var(--line)}
.list.pair .row:nth-child(odd){border-right:1px solid var(--line)}
.list.pair .who{flex:none;gap:4px 6px}
.list.pair .seg{flex:none;max-width:none;grid-template-columns:repeat(var(--n,3),1fr);gap:4px}
.list.pair .seg button{min-height:46px;padding:0;font-size:.92rem}
.list.pair .row.wide{grid-column:1/-1;border-right:0}
/* 統計卡片：出席／請假／缺席小格＋付款狀態 */
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.mini div{background:var(--surface-2);border-radius:8px;text-align:center;padding:5px 0 4px}
.mini b{display:block;font-size:1.15rem;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums}
.mini span{display:block;font-size:.72rem;color:var(--muted)}
.mini .ok{background:var(--ok-bg)} .mini .ok b{color:var(--ok)}
.mini .warn{background:var(--warn-bg)} .mini .warn b{color:var(--warn)}
.mini .bad{background:var(--bad-bg)} .mini .bad b{color:var(--bad)}
.mini .zero b{color:var(--muted);opacity:.55}
.paybar{border-radius:8px;padding:6px 8px;font-size:.88rem;display:grid;gap:6px;text-align:center}
.paybar.ok{background:var(--ok-bg);color:var(--ok)}
.paybar.bad{background:var(--bad-bg);color:var(--bad)}
.paybar .chips{justify-content:center}
.list.pair .actions{gap:8px}
.list.pair .actions.stack{align-items:flex-start}

.me{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:var(--radius);padding:12px 14px;display:grid;gap:10px}
.me-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.me-hi{font-weight:900;font-size:1.05rem}
.me-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.me-cell{border-radius:10px;padding:10px 8px;background:var(--accent-soft);display:grid;gap:2px;text-align:center;align-content:start}
.me-cell span{font-size:.8rem;font-weight:700;color:var(--muted)}
.me-cell b{font-size:1.4rem;font-weight:900;color:var(--accent);line-height:1.25}
.me-cell small{font-size:.76rem;color:var(--muted);line-height:1.4}
.me-cell.ok{background:var(--ok-bg)} .me-cell.ok b{color:var(--ok)}
.me-cell.bad{background:var(--bad-bg)} .me-cell.bad b{color:var(--bad)}
.me-cell.mute{background:var(--surface-2)} .me-cell.mute b{color:var(--fg);font-size:1.05rem}
.me .muted{font-size:.82rem}
.pill{display:inline-block;font-size:.85rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.form{flex-basis:100%;display:grid;gap:12px;padding:14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field span{font-size:.85rem;font-weight:700;color:var(--muted)}
.field input,.field select{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:12px}
h2{margin:0;font-size:1.1rem;font-weight:900;text-wrap:balance}
h3{margin:4px 0 0;font-size:.95rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dates{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.date{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2);display:grid;gap:4px;justify-items:start}
.date b{font-size:1.02rem;font-variant-numeric:tabular-nums}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:var(--radius);padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:1.1rem;margin-bottom:4px}
.muted{color:var(--muted);font-size:.9rem;margin:0}
.notes{margin:0;padding-left:1.2em;color:var(--muted);font-size:.92rem;display:grid;gap:4px}
.notes strong{color:var(--fg)}

.calc{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.calc td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:baseline}
.calc td:nth-child(2){color:var(--muted);font-size:.9rem}
.calc td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.calc small{display:block;font-size:.75rem;font-weight:700;color:var(--muted);margin-top:2px}
.calc tr.total td{font-weight:900;font-size:1.08rem;color:var(--fg)}
.calc tr.big td{font-size:1.25rem;color:var(--accent);border-bottom:0}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.tablewrap table{border-collapse:collapse;width:100%;min-width:520px;font-variant-numeric:tabular-nums}
.tablewrap th,.tablewrap td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.tablewrap th{font-size:.82rem;color:var(--muted);font-weight:700;letter-spacing:.04em;background:var(--surface-2)}
.tablewrap tr:last-child td{border-bottom:0}
.tablewrap td.num{text-align:center;font-weight:700;font-size:1.05rem}
.tablewrap th.num{text-align:center}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center;z-index:20}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--warn-bg);color:var(--warn);border-top:2px solid var(--warn);font-weight:700;box-shadow:0 -4px 14px rgba(0,0,0,.12)}
.savebar[hidden]{display:none}
.savebar span{flex:1 1 auto;min-width:0}
body.has-save{padding-bottom:84px}
body.has-save #toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
</style>

<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <button id="fontBtn" class="fontbtn" type="button" aria-pressed="false" aria-label="字放大">A＋<small>字放大</small></button>
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="19" fill="var(--court-2)"/>
        <path d="M12 9 L20 24 L28 9 Z" fill="var(--court-ink)" opacity=".9"/>
        <path d="M16 9 L20 24 M24 9 L20 24" stroke="var(--court-2)" stroke-width="1.2"/>
        <circle cx="20" cy="28" r="5" fill="var(--shuttle)"/>
      </svg>
      <div>
        <h1 id="groupName">老楊輪羽班</h1>
        <p id="groupSub">輪椅羽球點名簿</p>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="功能">
      <button role="tab" data-tab="checkin" aria-selected="true">點名</button>
      <button role="tab" data-tab="pay" aria-selected="false">繳費</button>
      <button role="tab" data-tab="stats" aria-selected="false">統計</button>
      <button role="tab" data-tab="members" aria-selected="false">隊友</button>
    </nav>
  </div>
</header>
<div class="wrap"><div id="adminBar" hidden></div><div id="notice" class="notice" hidden></div></div>
<main id="app" class="wrap">
  <div class="empty"><b>名單載入中…</b>馬上就好，請稍等一下。</div>
</main>
<div id="saveBar" class="savebar" role="region" aria-label="儲存修改" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const CLASSES = ["WH1","WH2","SL3","SL4","SU5","SH6","未分級"];
  const METHODS = ["現金","LINE Pay"];
  const ST = {present:"出席", leave:"請假", absent:"缺席"};
  const DEF = { group:"老楊輪羽班", location:"", time:"每週六 14:00–17:00", start:"2026-12-05",
    coachHours:2, coachRate:1000, venueHours:3, venueRate:300, venueRate2:500, bigMin:6,
    venuePayer:"m03", treasurer:"m04", payInfo:"", manager:"m01", trNick:"吉哥", vpNick:"芳玉", coachNick:"楊教練" };   // 誰先付場地費、誰負責收錢、收款方式說明、誰負責維護管理
  const NUMS = ["coachHours","coachRate","venueHours","venueRate","venueRate2","bigMin"];
  // 季租 2 面場地：從 SEASON_FROM 起不論人數都是 2 面；季內沒列到的週六不上課
  let SEASON_FROM = "2027-01-02";
  const DEF_SEASONS = [
    { name:"2027 年 1～3 月", from:"2027-01-01", to:"2027-03-31", dates:["2027-01-02","2027-01-09","2027-01-16","2027-02-13","2027-02-20","2027-02-27","2027-03-06","2027-03-13","2027-03-20","2027-03-27"] },
  ];
  let SEASONS = [];
  function setSeasons(list){
    SEASONS = (list || []).filter(x => x && x.from && x.to).map(x => ({ name: String(x.name || ""), from: x.from, to: x.to, dates: [...new Set(x.dates || [])].sort() })).sort((a, b) => a.from < b.from ? -1 : 1);
    SEASON_FROM = SEASONS.flatMap(x => x.dates).sort()[0] || "9999-12-31";
  }
  setSeasons(DEF_SEASONS);
  const seasonOf = d => SEASONS.find(x => d >= x.from && d <= x.to) || null;
  // 季內、但沒租到場地的週六（開季租之前的日期不算）
  // 往前／往後跳一週，遇到季內沒租場地的週六再多跳一週
  const stepWeek = (d, n) => { let x = shiftDate(d, 7 * n); for(let g = 0; seasonOff(x) && g < 20; g++) x = shiftDate(x, 7 * n); return x; };
  const seasonOff = d => { const x = seasonOf(d); return !!x && d >= SEASON_FROM && !x.dates.includes(d); };

  const pad = n => String(n).padStart(2,"0");
  const weekday = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d).getDay(); };
  const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const today = () => fmtDate(new Date());
  const shiftDate = (s,n) => { const [y,m,d] = s.split("-").map(Number); return fmtDate(new Date(y,m-1,d+n)); };
  const WD = "日一二三四五六";
  const labelDate = s => { const [y,m,d] = s.split("-").map(Number); return `${m}月${d}日（${WD[new Date(y,m-1,d).getDay()]}）`; };
  const md = s => { const [,m,d] = s.split("-"); return `${+m}/${+d}`; };
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const money = n => "NT$" + Number(n||0).toLocaleString("zh-TW");

  const S = {
    tab:"checkin", date:null, payDate:null,
    members:[], att:{}, pay:{}, settings:{...DEF},
    loaded:{members:false, settings:false},
    online:false, pw:"", canWrite:false, loginOpen:false,
    payOpen:null, payConfirm:null, editId:null, delConfirm:null,
    draft:{}, fund:{ items:[] }, remember:false
  };

  const app = document.getElementById("app");
  const noticeEl = document.getElementById("notice");
  const toastEl = document.getElementById("toast");
  let toastTimer;
  function toast(msg){ if(typeof staged !== "undefined" && staged.size && /^記下了：/.test(msg)) msg = msg.replace(/^記下了：/, "已暫存：") + "（記得按確認儲存）"; toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove("show"), 2400); }
  function notice(msg){ noticeEl.textContent = msg || ""; noticeEl.hidden = !msg; }
  // 資料存在 Google 試算表，透過 Apps Script 的資料接口（Api.gs）讀寫
  const API = "https://script.google.com/macros/s/AKfycbypMOtouElSK96qRdenjKcePDF58TBFmw1pree2OhDxBy0iXvNorCRlhpGdFkCYEbKe/exec";
  async function gs(fn, ...args){
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn, args }) });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || "讀寫失敗");
    return j.data;
  }

  // 排序：先依分級（WH1 → WH2 → SL3 → SL4 → SU5 → SH6 → 未分級），同分級再依姓名筆畫由少到多
  let strokeSort;
  try { strokeSort = new Intl.Collator("zh-Hant-TW-u-co-stroke"); } catch(_) { strokeSort = new Intl.Collator("zh-Hant-TW"); }
  const classRank = c => { const i = CLASSES.indexOf(c || "未分級"); return i < 0 ? CLASSES.length : i; };
  const byClassThenStroke = (a, b) => (classRank(a.cls) - classRank(b.cls)) || strokeSort.compare(a.name || "", b.name || "");
  const active = () => S.members.filter(m => m.active !== false);
  const players = () => active().filter(m => m.role !== "coach");
  const nameOf = id => (S.members.find(m => m.id === id) || {}).name || "（已刪除的隊友）";
  const dis = () => S.canWrite ? "" : " disabled";
  const tagHtml = m => (m.cls && m.cls !== "未分級" ? `<span class="tag">${esc(m.cls)}</span>` : "")
    + (m.id === S.settings.manager ? `<span class="tag role">管理</span>` : "")
    + (m.id === S.settings.treasurer ? `<span class="tag role">財務</span>` : "")
    + (m.id === S.settings.venuePayer ? `<span class="tag role">場地</span>` : "");
  // 財務（收錢的人）和先付場地費的人
  const treasurerOf = () => active().find(m => m.id === S.settings.treasurer) || null;
  const venuePayerOf = () => active().find(m => m.id === S.settings.venuePayer) || null;
  const trName = () => (treasurerOf() && S.settings.trNick) || (treasurerOf() || {}).name || "財務";
  const vpName = () => (venuePayerOf() && S.settings.vpNick) || (venuePayerOf() || {}).name || "負責場地的人";

  // 季租日期清單
  const seasonItems = () => { const t = today(), s = S.settings, per = s.venueHours * s.venueRate2;
    return SEASONS.filter(x => x.to >= t).map(x => `<li><strong>${x.name}（${x.dates.length} 堂）：</strong>${x.dates.map(d => d < t ? `<s>${md(d)}</s>` : md(d)).join("、")}<br><span class="muted">季租場地費 ${x.dates.length} 堂 × ${money(per)}＝${money(x.dates.length * per)}</span></li>`).join(""); };
  // 季租開始前照原規則（人數決定 1 面或 2 面）
  const preSeason = () => today() < SEASON_FROM && S.settings.bigMin > 0;
  const preItem = extra => { const s = S.settings, big = s.bigMin;
    return `<li><strong>季租前（到 ${md(shiftDate(SEASON_FROM, -1))}）：</strong>照原規則，${big} 人以上使用 2 面（${money(s.venueRate2)}／時）、${big - 1} 人以下使用 1 面（${money(s.venueRate)}／時）。${extra || ""}</li>`; };
  // 點名頁：請假規則
  const leaveBox = () => `<div class="rules">
    <b>請假規則</b>
    <ul class="rule-list">
      <li><strong>事先請假：</strong>最晚請提前一週告知，課程費用由實際出席人數平均分攤。若上課人數少於 4 人，則由大家討論是否停課。</li>
      <li><strong>未請假缺席：</strong>課程照常進行，缺席者仍須分攤課程費用。</li>
    </ul>
  </div>`;
  // 繳費頁：收費小提醒
  const rulesBox = d => {
    const s = S.settings, vp = esc(s.vpNick || "芳玉"), tr = esc(s.trNick || "吉哥");
    const ci = d ? classInfo(d) : null, f = ci && ci.n ? fees(ci.n, d) : null, lv = d ? leaveCount(d) : 0;
    const num = x => Number(x).toLocaleString("en-US");
    const pre = !!d && d < SEASON_FROM;
    return `<details class="rules">
    <summary><b>收費小提醒</b></summary>
    <ul class="rule-list">
      <li><strong>課費分攤：</strong>每堂教練費＋場地費，由當天出席的人平均分攤。</li>
      ${preSeason() || pre ? preItem(pre && f ? `這堂出席 ${ci.n} 人${lv ? `（${lv} 人請假）` : ""}，開 ${f.two ? 2 : 1} 面，每人 <strong>${money(ci.pp)}</strong>。` : "") : ""}
      <li><strong>場地季租：</strong>自 ${md(SEASON_FROM)} 起，${vp}負責向館方季租 2 面場地，並先整季預付場地費；每堂${vp}自己的課費直接扣除，剩餘的場地費再由${tr}每堂付還。</li>
      <li><strong>季租每堂費用：</strong>教練費 ${money(s.coachHours * s.coachRate)}＋場地費 ${money(s.venueHours * s.venueRate2)}（2 面 ${money(s.venueRate2)}／時 × ${s.venueHours} 小時）＝${money(s.coachHours * s.coachRate + s.venueHours * s.venueRate2)}。${f && !pre ? `這堂出席 ${ci.n} 人${lv ? `（${lv} 人請假）` : ""}，每人 <strong>${money(ci.pp)}</strong>。` : ""}</li>
      <li><strong>人少每人就多：</strong>季租後場地固定 2 面，出席的人越少、每人分攤越多，例如 ${[8, 7, 6, 5, 4].map(k => `${k} 人 ${money(Math.ceil((s.coachHours * s.coachRate + s.venueHours * s.venueRate2) / k))}`).join("、")}。請假請盡早告知。</li>
      ${seasonItems()}
      <li><strong>繳費方式：</strong>課費統一交給${tr}，可使用 LINE Pay 或現金。</li>
    </ul>
  </details>`;
  };

  // ---------- 課表與費用 ----------
  function statusOf(d){
    const doc = S.att[d] || {};
    const vals = Object.values(doc.records || {});
    if(vals.includes("leave")) return doc.mode === "single" ? "single" : "paused";
    if(vals.includes("present") || vals.includes("absent")) return "held";
    return d < today() ? "unmarked" : "planned";
  }
  function leaversOf(d){
    const r = (S.att[d] && S.att[d].records) || {};
    return Object.keys(r).filter(id => r[id] === "leave").map(nameOf);
  }
  // 從開課日起每週一次，排到今天之後 8 週；點名過的非固定日期（補課）也算一堂
  function schedule(){
    const start = S.settings.start || today();
    const until = shiftDate(today() > start ? today() : start, 56);
    const extra = Object.keys(S.att).filter(d => d >= start && Object.keys(S.att[d].records || {}).length);
    const set = new Set(extra);
    for(let w = start, g = 0; w <= until && g < 600; w = shiftDate(w, 7), g++) if(!seasonOff(w)) set.add(w);
    return [...set].sort().map(d => ({ date: d, status: statusOf(d) }));
  }
  const billable = st => st !== "paused";
  // 這堂要分攤的人：沒請假的學員（整班暫停就沒有人要付）
  function classInfo(d){
    const st = statusOf(d);
    const r = (S.att[d] && S.att[d].records) || {};
    const ids = billable(st) ? players().filter(m => r[m.id] !== "leave").map(m => m.id) : [];
    const n = ids.length;
    return { st, ids, n, pp: n ? Math.ceil(fees(n, d).session / n) : 0 };
  }
  const leaveCount = d => players().filter(m => ((S.att[d] && S.att[d].records) || {})[m.id] === "leave").length;
  const payKey = d => "class-" + d;
  const paidRec = (d, id) => ((S.pay[payKey(d)] || {}).records || {})[id];
  function nextClassDate(sch){
    const t = today();
    const next = sch.find(i => i.date >= t);
    return next ? next.date : (S.settings.start || t);
  }
  // 這堂的錢怎麼走：訂場地的人先付場地費，他的課費從裡面扣，差額由財務匯還（或由他補給財務）
  function flowOf(d){
    const ci = classInfo(d), f = fees(ci.n, d);
    const vp = venuePayerOf(), tr = treasurerOf();
    const coachPaid = (S.pay[payKey(d)] || {}).coachPaid || null;   // 財務付給教練的紀錄
    const venuePaid = (S.pay[payKey(d)] || {}).venuePaid || null;   // 場地負責人付給館方的紀錄
    if(!ci.n || !vp) return { ci, vp: null, tr, venue: f.venue, coach: f.coach, coachPaid, venuePaid };
    const vpShare = ci.ids.includes(vp.id) ? ci.pp : 0;
    const net = f.venue - vpShare;   // >0：財務要匯給訂場地的人；<0：訂場地的人要補給財務
    const reimb = (S.pay[payKey(d)] || {}).reimb || null;
    return { ci, vp, tr, venue: f.venue, coach: f.coach, vpShare, net, reimb, coachPaid, venuePaid };
  }
  // 訂場地的人這堂不用另外繳（課費已從代墊的場地費扣掉）
  const settledByVenue = (m, d) => { const fl = flowOf(d); return !!fl.vp && fl.vp.id === m.id && fl.net >= 0; };
  // 財務自己的課費本來就在他手上，不用轉
  const isTreasurer = m => !!treasurerOf() && treasurerOf().id === m.id;
  const selfSettled = (m, d) => settledByVenue(m, d) || isTreasurer(m);
  const pastClasses = sch => { const t = today(); return sch.filter(i => i.date <= t && i.date >= S.settings.start && billable(i.status) && i.status !== "planned"); };
  // 已經上過、還沒繳的課
  function owedBy(m, sch){
    return pastClasses(sch)
      .filter(i => classInfo(i.date).ids.includes(m.id) && !paidRec(i.date, m.id) && !selfSettled(m, i.date))
      .map(i => i.date);
  }
  // 財務還沒匯還給訂場地的人的課
  const reimbOwed = sch => pastClasses(sch).map(i => ({ d: i.date, fl: flowOf(i.date) })).filter(x => x.fl.vp && x.fl.net > 0 && !x.fl.reimb);
  // 財務還沒付給教練的課
  const coachOwed = sch => pastClasses(sch).map(i => ({ d: i.date, fl: flowOf(i.date) })).filter(x => x.fl.ci.n && !x.fl.coachPaid);
  // 「記下已付款」的小按鈕組：選付款方式＋記下；已付就顯示紀錄和取消
  const paidControl = (done, d, kind, draftKey, label) => !S.canWrite ? "" : done
    ? `<br><span class="pill ok">已付款・${esc(done.method||"")}・${esc(md(done.date||today()))}</span>${S.canWrite ? ` <button class="link" data-act="${kind}-undo" data-date="${d}">取消紀錄</button>` : ""}`
    : (S.canWrite ? `<div class="actions" style="margin-top:6px">${METHODS.map(x => `<button class="btn small${x === (S.draft[draftKey] || "LINE Pay") ? " primary" : ""}" data-act="${kind}-method" data-v="${x}">${x}</button>`).join("")}<button class="btn small" data-act="${kind}-save" data-date="${d}">${label}</button></div>` : `<br><span class="pill bad">還沒付</span>`);
  // n：這堂上課人數（不給就用全部隊友）；人數達 bigMin 就開 2 面場地
  const twoCourts = n => S.settings.bigMin > 0 && n >= S.settings.bigMin;
  function fees(n, d){
    const s = S.settings;
    if(n == null) n = players().length;
    const season = !!d && d >= SEASON_FROM;
    const two = season || twoCourts(n), rate = two ? s.venueRate2 : s.venueRate;
    const coach = s.coachHours * s.coachRate, venue = s.venueHours * rate;
    const session = coach + venue;
    const pp = n ? Math.ceil(session / n) : 0;
    return { coach, venue, session, n, pp, two, rate, season, exact: n ? session % n === 0 : true };
  }
  const courtLabel = f => f.season ? "季租 2 面場地" : `${f.two ? 2 : 1} 面場地`;
  const courtText = f => `${f.two ? 2 : 1} 面場地，${S.settings.venueHours} 小時 × ${money(f.rate)}`;
  function feeCard(){
    const f = fees(), s = S.settings;
    return `<div class="card">
      <h2>費用怎麼算？</h2>
      <table class="calc">
        <tr><td>教練費</td><td>${s.coachHours} 小時 × ${money(s.coachRate)}</td><td>${money(f.coach)}</td></tr>
        <tr><td>場地費</td><td>${courtText(f)}</td><td>${money(f.venue)}</td></tr>
        <tr class="total"><td>一堂總共</td><td></td><td>${money(f.session)}</td></tr>
        <tr class="total big"><td>每人每堂</td><td>${f.n} 位隊友平分</td><td>${money(f.pp)}</td></tr>
      </table>
      <ul class="notes">
        <li><strong>一堂一收</strong>，上一次課收一次，不用先繳一整期。</li>
        ${s.bigMin > 0 ? `<li><strong>${s.bigMin} 人以上開 2 面場地</strong>（包場，身障半價後每小時 ${money(s.venueRate2)}）；${s.bigMin - 1} 人以下開 1 面（身障半價後每小時 ${money(s.venueRate)}）。</li>` : ""}
        ${venuePayerOf() ? `<li><strong>${esc(vpName())}</strong> 先幫忙付場地費 ${money(f.venue)} 給館方，他的 ${money(f.pp)} 直接扣掉，${esc(trName())} 再匯 <strong>${money(f.venue - f.pp)}</strong> 還給他（${f.n} 人都上課時）。</li>` : ""}
        <li><strong>事先請假</strong>選「整班暫停」：這週不上課、不收錢。</li>
        <li>有人請假、其他人<strong>照上</strong>：由沒請假的人平分，例如 ${[...new Set([f.n - 1, s.bigMin - 1, s.bigMin - 2])].filter(k => k > 0 && k < f.n).sort((a, b) => b - a).map(k => `${k} 人上課每人 ${money(fees(k).pp)}`).join("、")}。</li>
        <li><strong>沒請假就缺席</strong>：照樣要分攤費用。</li>
        <li>隊友人數有變動時，金額會自動重算；已經收的錢不會跟著改。</li>
        ${f.exact ? "" : "<li>除不盡的零頭，進位到整數元。</li>"}
      </ul>
    </div>`;
  }

  // ---------- writes: one at a time per document ----------
  const queues = {};
  // 修改先暫存，按「確認儲存」才一次寫進雲端
  const staged = new Map();
  let changes = 0;   // 點了幾次修改
  function write(path, fn){
    if(!S.online || !S.canWrite) return;
    staged.delete(path); staged.set(path, fn); changes++;   // 同一筆資料只留最後一次
    renderSaveBar();
  }
  function flush(){
    if(!staged.size) return;
    const jobs = [...staged]; staged.clear(); changes = 0;
    let failed = false;
    const all = jobs.map(([path, fn]) => {
      pendingWrites++;
      return queues[path] = (queues[path] || Promise.resolve()).then(fn).catch(e => { failed = true; handleErr(e); })
        .finally(() => { pendingWrites--; if(!pendingWrites) load(); });
    });
    S.saving = true; renderSaveBar();
    Promise.all(all).then(() => { S.saving = false; renderSaveBar(); toast(failed ? "有資料沒存成功，請再試一次" : "已儲存 ✓"); });
  }
  function discard(){
    staged.clear(); changes = 0; renderSaveBar();
    S.editId = null; S.payOpen = null; S.payConfirm = null;
    load(); toast("已放棄修改，恢復成雲端的資料");
  }
  const saveBar = document.getElementById("saveBar");
  function renderSaveBar(){
    const n = staged.size ? Math.max(changes, 1) : 0;
    if(S.saving){ saveBar.hidden = false; saveBar.innerHTML = `<span>儲存中…</span>`; document.body.classList.add("has-save"); return; }
    saveBar.hidden = !n; document.body.classList.toggle("has-save", !!n);
    saveBar.innerHTML = n ? `<span>有 <b>${n}</b> 項修改還沒儲存</span><button class="btn small" data-save="discard">放棄</button><button class="btn small primary" data-save="ok">確認儲存</button>` : "";
  }
  saveBar.addEventListener("click", e => {
    const b = e.target.closest("[data-save]"); if(!b) return;
    if(b.dataset.save === "ok") flush(); else discard();
  });
  window.addEventListener("beforeunload", e => { if(staged.size){ e.preventDefault(); e.returnValue = ""; } });
  const save = (c, id, data) => () => gs("saveDoc", S.pw, c, id, data);
  const remove = (c, id) => () => gs("deleteDoc", S.pw, c, id);
  function handleErr(e){
    const msg = String(e && e.message || e || "");
    if(msg.includes("密碼")){
      S.canWrite = false; S.pw = "";
      try { localStorage.removeItem("ylAdminPw"); sessionStorage.removeItem("ylAdminPwS"); } catch(_){}
      renderAdminBar(); render();
      toast("密碼不對或已經換了，請重新登入");
    } else {
      toast("沒存成功，檢查一下網路再試一次");
    }
  }

  // ---------- render ----------
  let pendingRender = false;
  function scheduleRender(){
    const a = document.activeElement;
    if(a && app.contains(a) && (a.tagName === "INPUT" || a.tagName === "SELECT") && a.type !== "date"){
      pendingRender = true; return;
    }
    render();
  }
  app.addEventListener("focusout", () => { if(pendingRender){ setTimeout(()=>{ if(pendingRender){ pendingRender=false; render(); } }, 0); } });

  function render(){
    const s = S.settings;
    document.getElementById("groupName").textContent = s.group || "輪椅羽球點名簿";
    document.getElementById("groupSub").textContent = [s.location && "📍 " + s.location, s.time].filter(Boolean).join("　") || "輪椅羽球點名簿";
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
    if(!S.loaded.members){ app.innerHTML = `<div class="empty"><b>名單載入中…</b>馬上就好，請稍等一下。</div>`; return; }
    const sch = schedule();
    if(!S.date) S.date = nextClassDate(sch);
    if(!S.payDate) S.payDate = nextClassDate(sch);
    app.innerHTML = ({checkin:viewCheckin, pay:viewPay, stats:viewStats, members:viewMembers})[S.tab](sch);
  }

  function noMembers(){
    return `<div class="empty"><b>還沒有隊友喔</b>先到「隊友」把大家加進來，就能開始點名、記帳了。<div style="margin-top:14px"><button class="btn primary" data-act="goto" data-tab="members">去加隊友</button></div></div>`;
  }

  // 我的帳單：隊友選一次自己的名字（記在這支手機），打開就看到自己要付多少（只能看）
  const ME_KEY = "ylMe";
  const getMe = () => { try { return localStorage.getItem(ME_KEY) || ""; } catch(_){ return ""; } };
  const setMe = v => { try { v ? localStorage.setItem(ME_KEY, v) : localStorage.removeItem(ME_KEY); } catch(_){} };
  function meCard(sch){
    const ps = players(); if(!ps.length) return "";
    const id = getMe(), m = ps.find(x => x.id === id);
    if(!m || S.meEdit) return `<div class="me"><label class="field"><span>我是誰？選一次就會記住，打開就看到自己的帳單</span><select id="mePick"><option value="">－ 選自己的名字 －</option>${ps.slice().sort(byClassThenStroke).map(x => `<option value="${x.id}"${x.id === id ? " selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>${m ? `<div><button class="link" data-act="me-cancel">取消</button></div>` : ""}</div>`;
    const nd = nextClassDate(sch), ci = classInfo(nd), rec = ((S.att[nd] || {}).records || {})[m.id];
    let next;
    if(nd < S.settings.start) next = { cls: "mute", big: "還沒開課", note: `第一堂 ${md(S.settings.start)}` };
    else if(ci.st === "paused") next = { cls: "mute", big: "這週暫停", note: "整班暫停，不用付" };
    else if(rec === "leave") next = { cls: "mute", big: "已請假", note: "這堂不用付" };
    else if(isTreasurer(m)) next = { cls: "mute", big: "不用轉", note: "你負責收錢，自己的課費在手上" };
    else if(settledByVenue(m, nd)) next = { cls: "mute", big: "不用轉", note: "課費從你墊的場地費扣" };
    else if(paidRec(nd, m.id)) next = { cls: "ok", big: "✓ 已付", note: money(oweAmount(m, nd)) };
    else next = { cls: "", big: money(oweAmount(m, nd)), note: `照目前 ${ci.n} 人出席算，請假人數變了會跟著調整` };
    const owed = owedBy(m, sch).filter(d => d !== nd), total = owed.reduce((a, d) => a + oweAmount(m, d), 0);
    const pay = owed.length || next.cls === "";
    return `<div class="me">
      <div class="me-top"><span class="me-hi">${esc(m.name)} 的帳單</span><button class="link" data-act="me-change">不是我</button></div>
      <div class="me-grid">
        <div class="me-cell ${next.cls}"><span>下一堂 ${md(nd)}</span><b>${next.big}</b><small>${next.note}</small></div>
        <div class="me-cell ${owed.length ? "bad" : "ok"}"><span>之前的課</span><b>${owed.length ? money(total) : "✓ 付清"}</b><small>${owed.length ? `還沒付 ${owed.length} 堂：${owed.map(md).join("、")}` : "沒有欠款"}</small></div>
      </div>
      ${(() => { const t = today(), x = SEASONS.find(z => z.dates.length && z.dates[0] <= t && z.to >= t);
        const ds = x ? heldDates(x.dates) : pastClasses(sch).map(i => i.date).filter(d => statusOf(d) !== "paused");
        if(!ds.length) return "";
        const a = ds.filter(d => attended(m, d)).length;
        return `<div class="me-att">🏸 ${x ? "本季" : "開課以來"}出席 <b>${a}</b>／${ds.length} 堂${x ? `<span>（本季共 ${x.dates.length} 堂）</span>` : ""}${a === ds.length && a >= 2 ? "　全勤，太棒了！" : ""}</div>`; })()}
      ${pay ? `<p class="muted">課費轉給${esc(trName())}，可用 LINE Pay 或現金。${S.settings.payInfo ? esc(S.settings.payInfo) : ""}</p>` : ""}
    </div>`;
  }

  // 有人請假時：整班暫停，或其他人照上
  const modeSwitch = cur => !S.canWrite ? "" : `<div class="field"><span>有人請假，這週要怎麼辦？</span>
    <div class="seg two" role="group" aria-label="有人請假時這週怎麼辦">
      <button data-act="mode" data-v="paused" aria-pressed="${cur==="paused"}"${dis()}>整班暫停</button>
      <button data-act="mode" data-v="single" aria-pressed="${cur==="single"}"${dis()}>其他人照上</button>
    </div></div>`;

  // 操作說明只給管理員看，一般人只看資訊
  const adminHint = text => S.canWrite ? text : "";
  const adminHintP = text => S.canWrite ? `<p class="muted">${text}</p>` : "";

  // 點名頁的說明橫幅
  function classBanner(d){
    const ci = classInfo(d), f = fees(ci.n, d);
    if(seasonOff(d) && statusOf(d) === "planned") return `<div class="banner mute">這週沒有上課<small>這天不在季租場地的日期裡，不上課、不收費。</small></div>` + (S.canWrite && d >= today() ? `<div class="actions"><button class="btn small" data-act="sz-cancel" data-date="${d}">恢復這堂（有租場地）</button></div>` : "");
    const szCancel = S.canWrite && d >= today() && statusOf(d) === "planned" && seasonOf(d) && seasonOf(d).dates.includes(d) ? `<div class="actions"><button class="btn small" data-act="sz-cancel" data-date="${d}">這堂取消（場地也退）</button></div>` : "";
    if(d < S.settings.start) return `<div class="banner mute">還沒開課喔<small>第一堂是 ${md(S.settings.start)}，這天不收費。</small></div>`;
    if(ci.st === "paused") return `<div class="banner bad">這週團課暫停<small>${esc(leaversOf(d).join("、"))} 請假，這週不上課、不收錢。</small></div>` + modeSwitch("paused");
    if(ci.st === "single") return `<div class="banner ok">這週其他人照上<small>${esc(leaversOf(d).join("、"))} 請假。一堂 ${money(f.session)}（${courtLabel(f)}）由 ${ci.n} 位隊友平分，每人 ${money(ci.pp)}。</small></div>` + modeSwitch("single");
    return `<div class="banner ok">每人 ${money(ci.pp)}<small>一堂 ${money(f.session)}（${courtLabel(f)}）由 ${ci.n} 位隊友平分。${adminHint("有人請假就點「請假」，再選整班暫停或其他人照上。")}</small></div>` + szCancel;
  }
  // 繳費頁只在暫停那週提醒不收費
  const payNotice = d => statusOf(d) === "paused"
    ? `<div class="banner bad">這週團課暫停<small>${esc(leaversOf(d).join("、"))} 請假，這週不上課、不收錢。</small></div>` : "";

  // 點名
  function viewCheckin(sch){
    const list = active();
    const rec = (S.att[S.date] && S.att[S.date].records) || {};
    const st = statusOf(S.date);
    const c = {present:0, leave:0, absent:0};
    list.forEach(m => { if(c[rec[m.id]] !== undefined) c[rec[m.id]]++; });
    const unmarked = list.length - c.present - c.leave - c.absent;
    let h = `
      <div class="bar">
        <button class="nav" data-act="date" data-n="-1" aria-label="上一次上課"${S.date <= S.settings.start ? " disabled" : ""}>‹</button>
        <label class="picker"><span>${labelDate(S.date)}</span><input type="date" id="datePick" value="${S.date}" min="${S.settings.start}" aria-label="選擇上課日期"></label>
        <button class="nav" data-act="date" data-n="1" aria-label="下一次上課">›</button>
      </div>
      ${S.date !== nextClassDate(sch) ? `<div><button class="link" data-act="date-next">回到最近一次上課</button></div>` : ""}
      ${classBanner(S.date)}
      ${(() => { const dl = shiftDate(S.date, -7), past = today() > dl; return S.date >= today() ? `<div class="deadline${past ? " past" : ""}">🗓️ <span>這堂請假截止：<b>${labelDate(dl)}</b>${past ? "（已過，之後請假一樣要分攤）" : " 前告知"}</span></div>` : ""; })()}`;
    if(!list.length) return h + noMembers();
    h += `
      <div class="summary">
        <div class="stat ok"><b>${c.present}</b><span>出席</span></div>
        <div class="stat warn"><b>${c.leave}</b><span>請假</span></div>
        <div class="stat bad"><b>${c.absent}</b><span>缺席</span></div>      </div>
      ${S.canWrite && unmarked && (!c.leave || st === "single") ? `<div class="actions"><button class="btn" data-act="all-present"${dis()}>其他人都到了，全部標出席</button></div>` : ""}
      <ul class="list pair">` +
      list.map(m => {
        const s = rec[m.id];
        return `<li class="row">
          <div class="who"><b>${esc(m.name)}</b>${tagHtml(m)}</div>
          <div class="seg" style="--n:${st === "single" ? 2 : 3}" role="group" aria-label="${esc(m.name)} 的出席狀態">
            ${(st === "single" ? ["present","leave"] : ["present","leave","absent"]).map(k => `<button data-act="att" data-id="${m.id}" data-s="${k}" aria-pressed="${s===k}"${dis()}>${ST[k]}</button>`).join("")}
          </div></li>`;
      }).join("") + `</ul>
      ${adminHintP("點完記得按畫面下方的「確認儲存」；點錯的話，再點一次同一個按鈕就能取消。")}
      ${leaveBox()}`;
    return h;
  }

  // 繳費（每堂）
  function viewPay(sch){
    const d = S.payDate, ci = classInfo(d);
    const key = payKey(d);
    const rec = (S.pay[key] && S.pay[key].records) || {};
    let h = `
      ${meCard(sch)}
      <div class="bar">
        <button class="nav" data-act="paydate" data-n="-1" aria-label="上一堂"${d <= S.settings.start ? " disabled" : ""}>‹</button>
        <label class="picker"><span>${labelDate(d)}</span><input type="date" id="payDatePick" value="${d}" min="${S.settings.start}" aria-label="選擇哪一堂"></label>
        <button class="nav" data-act="paydate" data-n="1" aria-label="下一堂">›</button>
      </div>
      ${d !== nextClassDate(sch) ? `<div><button class="link" data-act="paydate-next">回到最近一堂</button></div>` : ""}
      ${payNotice(d)}`;
    if(!players().length) return h + noMembers();
    if(ci.n && d >= S.settings.start){
      const fl = flowOf(d);
      const who = players().filter(m => ci.ids.includes(m.id));
      const mustPay = who.filter(m => !selfSettled(m, d));
      const paid = mustPay.filter(m => rec[m.id]);
      const unpaid = mustPay.filter(m => !rec[m.id]);
      // 財務、場地負責人不用轉課費，另外列在下面（財務在前）
      const special = who.filter(m => !mustPay.includes(m) && !rec[m.id]).sort((a, b) => isTreasurer(a) - isTreasurer(b));
      const listed = [...unpaid, ...paid, ...who.filter(m => !mustPay.includes(m) && rec[m.id])];
      const total = Object.values(rec).reduce((a,r) => a + Number(r.amount||0), 0);
      h += `
        ${unpaid.length ? (S.canWrite ? `<div class="actions"><button class="btn small" data-act="copy-class" data-date="${d}">複製收費訊息，貼到 LINE</button></div>` : "") : `<div class="banner ok">大家的錢都收齊了，辛苦了！</div>`}
        <div class="legend"><span data-cat="class"><i></i>課費</span><span data-cat="venue"><i></i>場地費</span><span data-cat="coach"><i></i>教練費</span><span>｜綠色＝已付、紅色＝還沒付</span></div>
        <h3>隊友課費・已付 ${paid.length}／${mustPay.length} 人（還沒轉的排前面）</h3>
        ${payList(key, listed, ci.pp, d, "pair")}
        ${special.length ? `<h3>教練費、場地費收付</h3>${payList(key, special, ci.pp, d, "pair")}` : ""}
        ${flowCard(d, fl)}`;
    }
    h += rulesBox(ci.n && d >= S.settings.start ? d : null);
    return h;
  }


  // 某人這堂要繳多少（訂場地的人如果課費比場地費多，只要補差額）
  function oweAmount(m, d){
    const fl = flowOf(d);
    if(fl.vp && fl.vp.id === m.id && fl.net < 0) return -fl.net;
    return fl.ci.pp;
  }

  // 這堂的錢怎麼走
  function flowCard(d, fl){
    if(!fl.vp && !fl.tr) return "";
    const tr = esc(trName()), vp = esc(vpName()), cn = esc(S.settings.coachNick || "教練");
    const num = x => Number(x).toLocaleString("en-US");
    const lv = leaveCount(d), cf = fees(fl.ci.n, d), s = S.settings, n = fl.ci.n, pp = fl.ci.pp;
    const trIn = !!fl.tr && fl.ci.ids.includes(fl.tr.id), vpIn = !!fl.vp && fl.ci.ids.includes(fl.vp.id);
    const payers = fl.ci.ids.filter(id => !(fl.vp && id === fl.vp.id) && !(fl.tr && id === fl.tr.id)).length;
    const got = payers * pp + (trIn ? pp : 0) + (fl.vp && fl.net < 0 ? -fl.net : 0);   // 吉哥手上的錢
    const out = fl.coach + (fl.vp && fl.net > 0 ? fl.net : 0);                          // 吉哥要付出去的錢
    const left = got - out;
    const box = (cls, head, big, notes, foot) => `<div class="fc-box ${cls}"><div class="fc-head">${head}</div>${big ? `<div class="fc-big">${big}</div>` : ""}${notes.length ? `<ul class="fc-notes">${notes.filter(Boolean).map(t => `<li>${t}</li>`).join("")}</ul>` : ""}${foot ? `<div class="fc-chip">${foot}</div>` : ""}</div>`;

    }

    const venue = fl.vp ? box("fc-orange fc-soft", `${vp}付給館方`, money(fl.venue), [

      vpIn ? `自己的課費從這裡扣` : `這堂請假，不用分攤`,
    ]) : "";

    return `<div class="card flow"><h2>錢怎麼走？</h2>
      <div class="fc">
        ${step(1, "隊友轉帳")}${top}
        ${arrow("fc-b", `轉給${tr}`)}
        ${step(2, `${tr}付款`)}${mid}
        <div class="fc-split${vpCol ? " fc-two" : ""}"><div class="fc-col">${arrow("fc-g", "付教練費")}${coachBox}</div>${vpCol}</div>
        ${sum}
        ${venue ? `${step(3, "場地費")}${venue}` : ""}
      </div>
      </div>`;
  }

  // 繳費文件：class-<日期>（保留匯款紀錄）

  // 一份繳費名單

      }

        ? `<button class="pill ${r ? "ok" : "bad"}" data-cat="class" data-act="${r ? "pay-del" : "pay-save"}" data-key="${key}" data-id="${m.id}" data-amt="${amt}">${r ? "✓ 已付" : "還沒付"}</button>`
        : `<span class="pill ${r ? "ok" : "bad"}" data-cat="class">${r ? "✓ 已付" : "還沒付"}</span>`}</div>`;
      return `<li class="row">
        <div class="who"><b>${esc(m.name)}</b>${tagHtml(m)}
</div>

  // 統計
  function viewStats(sch){
    const list = active();
    if(!list.length) return noMembers();

    const past = sch.filter(i => i.date <= t && i.date >= S.settings.start);

  // ---------- 季租日期編輯 ----------
  const classDay = () => weekday(S.settings.start || SEASON_FROM);
  function seasonWeeks(x){
    const wd = classDay(), out = [];
    let d = x.from; for(let g = 0; weekday(d) !== wd && g < 7; g++) d = shiftDate(d, 1);
    for(let g = 0; d <= x.to && g < 60; d = shiftDate(d, 7), g++) out.push(d);
    return out;
  }
  const saveSeasons = () => write("settings/seasons", save("settings", "seasons", { list: JSON.parse(JSON.stringify(SEASONS)) }));
  function toggleSeasonDate(d){
    const x = seasonOf(d); if(!x) return false;
    x.dates = x.dates.includes(d) ? x.dates.filter(y => y !== d) : [...x.dates, d].sort();
    setSeasons(SEASONS); saveSeasons(); return true;
  }
  function seasonEditor(){
    const t = today(), per = S.settings.venueHours * S.settings.venueRate2, num = v => Number(v).toLocaleString("en-US");
    const last = SEASONS[SEASONS.length - 1];
    const nf = last ? shiftDate(last.to, 1) : today();
    const [ny, nm] = nf.split("-").map(Number);

    const v = (k, fb) => esc(S.draft[k] ?? fb);
    return `<div class="card">
      <h2>季租場地日期</h2>

      ${SEASONS.map((x, i) => `<div class="sz-ed">
        <div class="sz-ed-h"><b>${esc(x.name)}</b><span>${md(x.from)}～${md(x.to)}・${x.dates.length} 堂 × ${num(per)}＝${money(x.dates.length * per)}</span></div>
        <div class="chips">${seasonWeeks(x).map(d => `<button class="dchip" data-act="sz-date" data-date="${d}" aria-pressed="${x.dates.includes(d)}"${d < t ? " disabled" : ""}>${md(d)}</button>`).join("")}</div>
        <div class="actions">${S.szDel === i
          ? `<span class="muted">整季刪掉，這一季的日期都會不見，確定嗎？</span><button class="btn small danger" data-act="sz-del" data-i="${i}">確定刪除</button><button class="btn small" data-act="sz-del-ask" data-i="">先不要</button>`
          : `<button class="link" data-act="sz-del-ask" data-i="${i}">刪除這一季</button>`}</div>
      </div>`).join("") || `<p class="muted">還沒有季租，下面新增一季。</p>`}
      <h3>新增一季</h3>
      <div class="fields">
        <label class="field"><span>名稱</span><input id="sz_name" placeholder="例如：2027 年 4～6 月" value="${v("sz_name", `${ny} 年 ${nm}～${nm + 2 > 12 ? nm + 2 - 12 : nm + 2} 月`)}"></label>
        <label class="field"><span>從哪天</span><input id="sz_from" type="date" value="${v("sz_from", nf)}"></label>
        <label class="field"><span>到哪天</span><input id="sz_to" type="date" value="${v("sz_to", nt)}"></label>
      </div>
      <div class="actions"><button class="btn" data-act="sz-add">新增這一季（先把每週${WD[classDay()]}都選上）</button></div>
    </div>`;

  // ---------- 班費收支 ----------
  function fundInfo(sch){
    const rows = ledgerRows(sch);
    const settled = rows.filter(r => !r.left && (r.reimbDone || !r.reimb) && r.coachDone);
    const extra = settled.reduce((a, r) => a + r.extra, 0);
    const items = (S.fund.items || []).slice().sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
    const inc = items.filter(i => i.type === "in").reduce((a, i) => a + Number(i.amount || 0), 0);
    const out = items.filter(i => i.type !== "in").reduce((a, i) => a + Number(i.amount || 0), 0);
    return { extra, settledN: settled.length, inc, out, bal: extra + inc - out, items };
  }
  const saveFund = () => write("settings/fund", save("settings", "fund", { items: JSON.parse(JSON.stringify(S.fund.items)) }));
  function fundCard(sch){
    const fi = fundInfo(sch), num = v => Number(v).toLocaleString("en-US");
    if(!S.canWrite && !fi.items.length && !fi.extra) return "";
    const type = S.draft.fdType || "out", v = (k, fb) => esc(S.draft[k] ?? fb);
    return `<div class="card">
      <h2>班費收支</h2>
      <div class="summary">
        <div class="stat ok"><b>${money(fi.extra + fi.inc)}</b><span>收入</span></div>
        <div class="stat bad"><b>${money(fi.out)}</b><span>支出</span></div>
        <div class="stat"><b>${money(fi.bal)}</b><span>結餘</span></div>
      </div>
      <table class="calc fund">
        <tr><td>進位零頭<small>已結清 ${fi.settledN} 堂，自動計算</small></td><td></td><td class="ok">＋${num(fi.extra)}</td></tr>
        ${fi.items.map(i => `<tr><td>${esc(i.what)}<small>${md(i.date)}</small></td><td>${S.canWrite ? `<button class="link" data-act="fund-del" data-id="${esc(i.id)}">刪除</button>` : ""}</td><td class="${i.type === "in" ? "ok" : "bad"}">${i.type === "in" ? "＋" : "－"}${num(i.amount)}</td></tr>`).join("")}
        <tr class="total"><td>結餘</td><td></td><td>${money(fi.bal)}</td></tr>
      </table>
      ${S.canWrite ? `<h3>記一筆</h3>
      <div class="seg two" role="group" aria-label="收入或支出" style="max-width:260px"><button data-act="fd-type" data-v="out" aria-pressed="${type === "out"}">支出</button><button data-act="fd-type" data-v="in" aria-pressed="${type === "in"}">收入</button></div>
      <div class="fields">
        <label class="field"><span>日期</span><input id="fd_date" type="date" value="${v("fd_date", today())}"></label>
        <label class="field"><span>項目</span><input id="fd_what" placeholder="${type === "in" ? "例如：隊友贊助" : "例如：買羽球一打"}" value="${v("fd_what", "")}"></label>
        <label class="field"><span>金額</span><input id="fd_amt" type="number" inputmode="numeric" min="0" value="${v("fd_amt", "")}"></label>
      </div>
      <div class="actions"><button class="btn" data-act="fund-add">記下這一筆</button></div>` : ""}
      <p class="muted">班費來自每堂進位多收的零頭；買球、雜支等花費記在這裡，大家都看得到。</p>
    </div>`;
  }

  // ---------- 出席次數 ----------
  const attended = (m, d) => classInfo(d).ids.includes(m.id) && ((S.att[d] || {}).records || {})[m.id] !== "absent";
  const heldDates = ds => ds.filter(d => d <= today() && !["planned", "paused"].includes(statusOf(d)));

  // ---------- 季末結算（複製到 LINE） ----------
  function seasonReport(){
    const t = today(), x = SEASONS.find(z => z.to >= t) || SEASONS[SEASONS.length - 1]; if(!x) return "";
    const sch = schedule(), N = x.dates.length, sc = seasonCalc(x), num = v => Number(v).toLocaleString("en-US");
    const held = heldDates(x.dates), done = sc.done + sc.paused >= N;
    const att = players().map(m => ({ m, n: held.filter(d => attended(m, d)).length })).sort((a, b) => b.n - a.n);
    const owe = players().map(m => ({ m, ds: owedBy(m, sch).filter(d => x.dates.includes(d)) })).filter(o => o.ds.length);
    const fi = fundInfo(sch);
    return `🏸【${S.settings.group}】${x.name}${done ? "結算" : "到目前為止"}\n` +
      `上課 ${held.length} 堂${sc.paused ? `、暫停 ${sc.paused} 堂` : ""}（共 ${N} 堂${done ? "" : `，還有 ${N - sc.done - sc.paused} 堂`}）\n\n` +
      `📋 出席\n${att.map(a => `${a.m.name} ${a.n} 堂`).join("、")}\n\n` +
      `💰 課費\n${owe.length ? owe.map(o => `${o.m.name} 還沒付 ${o.ds.length} 堂，${money(o.ds.reduce((a, d) => a + oweAmount(o.m, d), 0))}`).join("\n") : "大家都付清了 👍"}\n\n` +
      (venuePayerOf() ? `🏟️ 季租場地\n${vpName()}預付 ${num(sc.total)}，已拿回 ${num(sc.back)}${sc.total - sc.back ? `，還差 ${num(sc.total - sc.back)}` : "，已經結清"}\n\n` : "") +
      `🪙 班費結餘 ${money(fi.bal)}\n` +
      `謝謝大家${done ? "這一季" : ""}的努力，下次球場見！`;
  }

  // 季租總帳：芳玉整季預付場地費，每堂先扣她自己的課費，其餘由吉哥還她
  function seasonCard(){
    const t = today(), s = S.settings, per = s.venueHours * s.venueRate2;
    const x = SEASONS.find(z => z.to >= t);
    if(!x || !venuePayerOf()) return "";
    const vp = esc(vpName()), tr = esc(trName()), num = v => Number(v).toLocaleString("en-US");
    const { N, total, done, paused, repaid, offset, owe, later, back } = seasonCalc(x);
    const pct = v => (total ? Math.round(v / total * 1000) / 10 : 0) + "%";
    const started = done + paused > 0;
    return seasonHtml();
    function seasonHtml(){ return `<div class="card season">
      <h2>季租總帳<small>${esc(x.name)}</small></h2>
      <div class="sz-top">
        <div><span>${vp}整季預付</span><b>${money(total)}</b><small>${N} 堂 × ${num(per)}</small></div>
        <div><span>上課進度</span><b>${started ? `第 ${done + paused}／${N} 堂` : `${md(x.dates[0])} 開始`}</b><small>${started ? `還有 ${N - done - paused} 堂` : `共 ${N} 堂`}</small></div>
      </div>
      <div class="sz-bar" role="img" aria-label="已拿回 ${pct(back)}"><i class="ok" style="width:${pct(back)}"></i><i class="bad" style="width:${pct(owe)}"></i><i class="warn" style="width:${pct(paused * per)}"></i></div>
      <table class="calc sz-calc">
        <tr><td><i class="sz-dot ok"></i>${tr}已經還</td><td></td><td>${money(repaid)}</td></tr>
        <tr><td><i class="sz-dot ok"></i>${vp}自己的課費抵掉</td><td></td><td>${money(offset)}</td></tr>
        ${owe ? `<tr class="bad"><td><i class="sz-dot bad"></i>已上課、${tr}還沒還</td><td></td><td>${money(owe)}</td></tr>` : ""}
        ${paused ? `<tr><td><i class="sz-dot warn"></i>暫停 ${paused} 堂（場地費另外討論）</td><td></td><td>${money(paused * per)}</td></tr>` : ""}
        <tr><td><i class="sz-dot"></i>還沒上的課</td><td></td><td>${money(later)}</td></tr>
        <tr class="total"><td>${vp}還沒拿回</td><td></td><td>${money(total - back)}</td></tr>
      </table>
      <p class="muted">每堂場地費 ${num(per)}：${vp}有來上課就先扣她自己的課費，剩下的由${tr}還她。${started ? "" : "開季後每上完一堂，這裡會自動更新。"}</p>
      ${S.canWrite ? `<div class="actions"><button class="btn small" data-act="copy-season">複製${done + paused >= N ? "季末結算" : "本季目前結算"}，貼到 LINE</button></div>` : ""}
    </div>`; }
  }
  function seasonCalc(x){
    const t = today(), s = S.settings, per = s.venueHours * s.venueRate2;
    const N = x.dates.length, total = N * per;
    let done = 0, paused = 0, repaid = 0, offset = 0, owe = 0;
    x.dates.forEach(d => {
      const st = statusOf(d);
      if(d > t || st === "planned") return;
      if(st === "paused"){ paused++; return; }
      done++;
      const fl = flowOf(d);
      if(!fl.vp) return;
      offset += Math.min(fl.vpShare || 0, fl.venue);
      if(fl.net > 0){ if(fl.reimb) repaid += Number(fl.reimb.amount || fl.net); else owe += fl.net; }
    });
    const later = (N - done - paused) * per, back = repaid + offset;
    return { N, total, per, done, paused, repaid, offset, owe, later, back };
  }

  // 吉哥對帳：有點名或收款紀錄、或已經上過的每一堂
  function ledgerRows(sch){
    const t = today();
    return sch.filter(i => i.date >= S.settings.start && billable(i.status) && (i.date <= t || S.att[i.date] || S.pay[payKey(i.date)]))
      .map(i => { const d = i.date, ci = classInfo(d); if(!ci.n) return null;
        const fl = flowOf(d), f = fees(ci.n, d), rec = (S.pay[payKey(d)] || {}).records || {};
        const must = players().filter(m => ci.ids.includes(m.id) && !selfSettled(m, d));
        const due = must.length * ci.pp, got = must.reduce((a, m) => a + (rec[m.id] ? Number(rec[m.id].amount || ci.pp) : 0), 0);
        return { d, n: ci.n, pp: ci.pp, due, got, left: must.filter(m => !rec[m.id]).length,
          reimb: fl.vp && fl.net > 0 ? fl.net : 0, reimbDone: !!fl.reimb, coach: f.coach, coachDone: !!fl.coachPaid,
          extra: ci.pp * ci.n - f.session };
      }).filter(Boolean);
  }
  function ledgerCard(sch){
    const rows = ledgerRows(sch);
    if(!rows.length) return "";
    const num = x => Number(x).toLocaleString("en-US"), tr = esc(trName()), vp = esc(vpName()), cn = esc(S.settings.coachNick || "教練");
    const sum = k => rows.reduce((a, r) => a + r[k], 0);
    const settled = rows.filter(r => !r.left && (r.reimbDone || !r.reimb) && r.coachDone);
    const ok = (b, t) => `<td class="num ${b ? "ok" : "bad"}">${b ? "✓ " + t : t}<small>${b ? "已付" : "還沒付"}</small></td>`;
    return `<div class="card">
      <h2>財務對帳</h2>
      <div class="tablewrap"><table class="ledger">
        <thead><tr><th>日期</th><th class="num c-class" data-cat="class">隊友繳費</th><th class="num c-venue" data-cat="venue">付${vp}</th><th class="num c-coach" data-cat="coach">付${cn}</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td><b>${md(r.d)}</b><small>${r.n} 人</small></td><td class="num ${r.left ? "bad" : "ok"}">${r.left ? num(r.got) : "✓ " + num(r.got)}<small>${r.left ? `差 ${r.left} 人` : "收齊"}</small></td>${r.reimb ? ok(r.reimbDone, num(r.reimb)) : `<td class="num muted">—</td>`}${ok(r.coachDone, num(r.coach))}</tr>`).join("")}</tbody>
      </table></div>
      <table class="calc">
        <tr><td>隊友應付給${tr}</td><td></td><td>${money(sum("due"))}</td></tr>
        <tr><td>已經收到</td><td></td><td>${money(sum("got"))}</td></tr>
        <tr><td>還沒收到</td><td></td><td>${money(sum("due") - sum("got"))}</td></tr>
        <tr class="total"><td>班費<small>進位多收的零頭，已結清 ${settled.length} 堂</small></td><td></td><td>${money(settled.reduce((a, r) => a + r.extra, 0))}</td></tr>
      </table>
      <div class="legend"><span data-cat="class"><i></i>課費</span><span data-cat="venue"><i></i>場地費</span><span data-cat="coach"><i></i>教練費</span><span>｜綠色＝已付、紅色＝還沒付</span></div>
      <p class="muted">「付${vp}」「付${cn}」欄：✓ 代表已付，紅字是還沒付的金額。班費只算錢都收付完的那幾堂。</p>
      ${S.canWrite ? `<div class="actions"><button class="btn small" data-act="export-csv">匯出 Excel 備份</button></div>` : ""}
    </div>`;
  }
  function exportCsv(){
    const sch = schedule(), out = [["日期","姓名","分級","出席狀態","應付","已付"]];
    const STN = { present: "出席", leave: "請假", absent: "缺席" };
    ledgerRows(sch).forEach(r => {
      const rec = (S.att[r.d] && S.att[r.d].records) || {}, pay = (S.pay[payKey(r.d)] || {}).records || {};
      const ids = classInfo(r.d).ids;
      players().forEach(m => {
        const going = ids.includes(m.id), self = going && selfSettled(m, r.d);
        out.push([r.d, m.name, m.cls || "", STN[rec[m.id]] || (going ? "出席" : ""), going ? r.pp : 0, !going ? "" : self ? "免轉（財務／場地）" : pay[m.id] ? "已付" : "還沒付"]);
      });
    });
    const csv = "\ufeff" + out.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = (S.settings.group || "點名簿") + "_備份_" + today() + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    toast("已下載備份，可以用 Excel 打開");
  }

          <label class="field"><span>場地（先付場地費給館方）</span><select id="set_venuePayer"${dis()}><option value="">（沒有指定）</option>${on.map(m => `<option value="${m.id}"${(d.set_venuePayer ?? s.venuePayer) === m.id ? " selected" : ""}>${esc(m.name)}</option>`).join("")}</select></label>
          <label class="field"><span>財務的稱呼（提醒裡用）</span><input id="set_trNick" placeholder="例如：吉哥" value="${v("set_trNick", s.trNick)}"${dis()}></label>
          <label class="field"><span>場地的稱呼（提醒裡用）</span><input id="set_vpNick" placeholder="例如：芳玉" value="${v("set_vpNick", s.vpNick)}"${dis()}></label>
          <label class="field" style="grid-column:1/-1"><span>收款方式（會顯示給大家看）</span><input id="set_payInfo" placeholder="例如：LINE Pay 轉給吳宗吉，或上課時給現金" value="${v("set_payInfo", s.payInfo)}"${dis()}></label>
