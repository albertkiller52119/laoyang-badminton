<style>
/* Layout: one-column phone-first app. Court-blue sticky header with four tabs; each tab is a list of member rows with large tap targets. */
:root{
  --bg:#eef3f5;
  --surface:#ffffff;
  --surface-2:#f6f9fa;
  --fg:#11222c;
  --muted:#566874;
  --line:#d5dfe4;
  --court:#0d5870;
  --court-2:#0a4a5f;
  --court-ink:#ffffff;
  --court-soft:rgba(255,255,255,.72);
  --shuttle:#f0b400;
  --accent:#0d6f8c;
  --accent-soft:#dcedf2;
  --ok:#1b7445; --ok-bg:#ddf1e5;
  --warn:#8f5500; --warn-bg:#fcefd3;
  --bad:#ad2a22; --bad-bg:#fae2df;
  --c-coach:#5b45a8; --c-coach-bg:#ebe6f7; --c-venue:#9a5200; --c-venue-bg:#fcebd5;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c161c; --surface:#13222b; --surface-2:#182a34; --fg:#e7f0f3; --muted:#9bb0ba; --line:#28404c;
    --court:#0b3f51; --court-2:#08323f; --court-ink:#f2f8fa; --court-soft:rgba(242,248,250,.7);
    --shuttle:#ffc933; --accent:#5ec3df; --accent-soft:#163947;
    --ok:#6fd49b; --ok-bg:#153626; --warn:#f2bb5c; --warn-bg:#3a2a0d; --bad:#ff8f86; --bad-bg:#3d1714;
    --c-coach:#b8a4f2; --c-coach-bg:#2a2244; --c-venue:#f2bb5c; --c-venue-bg:#3a2a0d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c161c; --surface:#13222b; --surface-2:#182a34; --fg:#e7f0f3; --muted:#9bb0ba; --line:#28404c;
  --court:#0b3f51; --court-2:#08323f; --court-ink:#f2f8fa; --court-soft:rgba(242,248,250,.7);
  --shuttle:#ffc933; --accent:#5ec3df; --accent-soft:#163947;
  --ok:#6fd49b; --ok-bg:#153626; --warn:#f2bb5c; --warn-bg:#3a2a0d; --bad:#ff8f86; --bad-bg:#3d1714;
  --c-coach:#b8a4f2; --c-coach-bg:#2a2244; --c-venue:#f2bb5c; --c-venue-bg:#3a2a0d;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1rem;line-height:1.6;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--court)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--shuttle);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--court);color:var(--court-ink)}
.top .wrap{padding-block:14px 0;display:grid;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;flex:none}
.top .wrap{transition:padding .2s,gap .2s}
.top.shrunk .wrap{padding-top:6px;gap:4px}
.top.shrunk .brand p{display:none}
.top.shrunk .mark{width:28px;height:28px}
.top.shrunk .brand h1{font-size:1.02rem}
.top.shrunk .tabs button{min-height:42px}
.brand h1{margin:0;font-size:1.3rem;font-weight:900;letter-spacing:.02em;line-height:1.2;text-wrap:balance}
.brand p{margin:0;font-size:.88rem;color:var(--court-soft)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{background:none;border:0;border-bottom:4px solid transparent;color:var(--court-soft);padding:10px 4px 9px;font-size:1.02rem;font-weight:700;min-height:48px}
.tabs button[aria-selected="true"]{color:var(--court-ink);border-bottom-color:var(--shuttle)}

main{padding-block:18px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.admin{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;padding:10px 14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:.92rem}
.admin > span{align-self:center}
.admin.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.notice{margin-top:14px;padding:12px 14px;border-radius:var(--radius);background:var(--warn-bg);color:var(--warn);font-weight:500}

.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.5rem;line-height:1;display:grid;place-items:center}
.nav:disabled{opacity:.4;cursor:not-allowed}
.picker{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;height:48px;border-radius:24px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:1.08rem;padding:0 12px}
.picker input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.picker.static{cursor:default}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 6px;min-height:44px}

.banner{padding:12px 14px;border-radius:var(--radius);font-weight:700;display:grid;gap:2px}
.banner small{font-weight:500;font-size:.9rem}
.banner.ok{background:var(--accent-soft);color:var(--accent)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.rules{background:var(--warn-bg);color:var(--fg);border-left:5px solid var(--shuttle);border-radius:var(--radius);padding:12px 14px 12px 16px;display:grid;gap:6px}
.rules b{color:var(--warn);font-size:.95rem;letter-spacing:.04em}
.rules ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.rules li{font-size:.95rem}
.rules strong{font-weight:900}
.rules .rule-list{margin:0;padding-left:1.3em;display:grid;gap:10px}
.rules .rule-list > li::marker{color:var(--warn)}
.rules .lv-top{margin:0;font-size:.97rem;line-height:1.6}
.rules .lv-chip{margin:0;justify-self:start;padding:2px 10px;border-radius:999px;background:var(--surface);font-size:.85rem;font-weight:700;color:var(--warn)}
.lv-t{width:100%;border-collapse:collapse;font-size:.93rem;background:var(--surface);border-radius:10px;overflow:hidden}
.lv-t th{font-size:.8rem;color:var(--muted);font-weight:700;padding:6px 10px;text-align:center}
.lv-t th:first-child,.lv-t td:first-child{text-align:left}
.lv-t td{padding:7px 10px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
.lv-t td:first-child{white-space:normal;font-weight:700}
.lv-t td small{display:block;font-weight:400;font-size:.75rem;color:var(--muted)}
.lv-y{color:var(--bad);font-weight:700}.lv-n{color:var(--ok);font-weight:700}.lv-k{color:var(--warn);font-weight:700}
.sp-box h3:first-child{margin-top:0}
.rules ol.rule-list ul{margin-top:4px}
.rb .rb-sec{display:grid;gap:6px;padding-top:12px}
.rb .rb-sec + .rb-sec{border-top:1px dashed var(--line);margin-top:4px}
.rb h4{margin:0;font-size:.98rem;display:flex;align-items:center;gap:6px;color:var(--fg)}
.rb ul ul{margin-top:4px;gap:2px}
.rb li b{color:var(--fg);font-size:inherit;letter-spacing:0}
.rb-t{border-collapse:collapse;font-size:.95rem;min-width:200px}
.rb-t th,.rb-t td{padding:5px 14px;border-bottom:1px solid var(--line);text-align:left}
.rb-t th{font-size:.82rem;color:var(--muted);font-weight:700}
.rb-t td:last-child,.rb-t th:last-child{text-align:right;font-weight:800}
.rb-t td:nth-child(3):not(:last-child),.rb-t th:nth-child(3):not(:last-child){text-align:right;font-weight:800}
.rb-t th{font-weight:700!important;color:var(--muted)}
.rb .muted{margin:2px 0 0;font-size:.85rem}
.rb h5{margin:6px 0 0;font-size:.92rem;font-weight:800;color:var(--fg)}
.rb h5 small{font-weight:600;color:var(--muted);font-size:.85rem;margin-left:4px}
.rb .rb-p{margin:0;font-size:.95rem}
.rb-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.rb-t5{min-width:0;width:100%;font-size:.9rem}
.rb-t5 th,.rb-t5 td{padding:5px 4px;white-space:nowrap}
.rb-t5 th{font-size:.78rem}
.rb-t5 td:nth-child(n+3),.rb-t5 th:nth-child(n+3){text-align:right}
.rb-t5 td:not(:last-child){font-weight:400}

.summary{display:flex;flex-wrap:nowrap;gap:6px}
/* 繳費頁：這堂摘要卡 */
.hero{background:linear-gradient(135deg,var(--accent) 0%,#0a4a5f 100%);color:#fff;border-radius:var(--radius);padding:16px 18px;display:grid;gap:10px;box-shadow:0 6px 18px rgba(10,74,95,.18)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:.95rem;opacity:.95}
.hero-chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 10px;font-size:.85rem;white-space:nowrap}
.hero-main{display:flex;align-items:baseline;gap:8px}
.hero-main b{font-size:2.4rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:#ffc933}
.hero-main span{font-weight:700;opacity:.9}
.hero-meta{font-size:.9rem;opacity:.92;line-height:1.5}
.hero-prog{display:grid;gap:5px;font-size:.88rem;font-weight:700}
.hero-bar{height:10px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden}
.hero-bar i{display:block;height:100%;border-radius:999px;background:#ffc933;transition:width .3s}
.hero-note{font-size:.82rem;opacity:.85;border-top:1px dashed rgba(255,255,255,.3);padding-top:8px}
/* 錢怎麼走：流向圖 */
/* 規則收合 */
details.rules > summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.rules > summary::-webkit-details-marker{display:none}
details.rules > summary::after{content:"點開看 ▾";font-size:.8rem;font-weight:700;color:var(--warn)}
details.rules[open] > summary::after{content:"收起 ▴"}
.deadline{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--radius);background:var(--surface);border:1px dashed var(--line);font-size:.92rem}
.deadline b{color:var(--warn)}
.deadline.past b{color:var(--muted)}
/* 統計頁：對帳表 */
.ledger td.ok{color:var(--ok)} .ledger td.bad{color:var(--bad)}
.ledger small{display:block;font-size:.72rem;font-weight:700;color:var(--muted);margin-top:2px;white-space:nowrap}
.ledger td.bad small{color:var(--bad)}
.tablewrap table.ledger{min-width:0;font-size:.95rem}
.tablewrap table.ledger th,.tablewrap table.ledger td{padding:12px 6px;line-height:1.25}
.tablewrap table.ledger th{font-size:.78rem;letter-spacing:0;white-space:nowrap}
.tablewrap table.ledger td:first-child{padding-left:12px}
.tablewrap table.ledger td.num{font-size:.98rem;white-space:nowrap}
.tablewrap table.ledger tbody tr:nth-child(even) td{background:var(--surface-2)}
@media (prefers-reduced-motion: reduce){.hero-bar i{transition:none}}
.stat{flex:1 1 0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center}
.stat b{display:block;font-size:1.15rem;font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{display:block;font-size:.75rem;color:var(--muted);line-height:1.25}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}

.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.actions.stack{flex-direction:column;align-items:flex-end;gap:6px}
.btn{min-height:48px;padding:0 18px;border-radius:24px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:44px;padding:0 16px;font-size:.92rem}
.btn:disabled,.seg button:disabled{opacity:.45;cursor:not-allowed}

.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;padding:12px 14px;flex-wrap:wrap}
.row+.row{border-top:1px solid var(--line)}
.who{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1 1 140px;flex-wrap:wrap}
.who b{font-size:1.12rem;font-weight:700}
.tag{font-size:.75rem;font-weight:700;letter-spacing:.06em;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.tag.role{background:var(--warn-bg);color:var(--warn)}
.steps{margin:0;padding-left:1.4em;display:grid;gap:10px}
.steps li{line-height:1.55}
.steps li::marker{font-weight:900;color:var(--accent)}
.sheet-alert{background:var(--warn-bg);border:1.5px solid var(--warn);border-radius:var(--radius);padding:12px 14px;display:grid;gap:6px;font-size:.92rem;line-height:1.5}
.sheet-alert .sa-h{color:var(--warn);font-size:1rem}
.sheet-alert a.btn{text-decoration:none;display:inline-flex;align-items:center}
.rules a{color:var(--accent);font-weight:800}
.sheet-hint a{color:var(--accent);font-weight:800}
.sz-ed{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;margin-bottom:10px}
.sz-ed-h{display:grid;gap:2px} .sz-ed-h span{font-size:.84rem;color:var(--muted)}
.dchip{min-height:44px;min-width:58px;padding:6px 10px;border-radius:999px;border:2px solid var(--line);background:var(--surface-2);color:var(--muted);font-weight:800;text-decoration:line-through}
.dchip[aria-pressed="true"]{background:var(--c-venue-bg);border-color:var(--c-venue);color:var(--c-venue);text-decoration:none}
.dchip:disabled{opacity:.5}
.calc.fund td small{display:block;font-size:.76rem;color:var(--muted);font-weight:400}
.calc.fund td.ok{color:var(--ok);font-weight:800} .calc.fund td.bad{color:var(--bad);font-weight:800}
.me-att{font-size:.9rem;padding:8px 10px;border-radius:10px;background:var(--accent-soft)}
.me-att b{font-size:1.1rem;color:var(--accent)} .me-att span{color:var(--muted);font-size:.82rem}
.remember{display:flex;align-items:center;gap:8px;flex-basis:100%;font-size:.9rem;min-height:44px}
.remember input{width:22px;height:22px}
.season h2 small{font-size:.8rem;font-weight:700;color:var(--muted);margin-left:8px}
.sz-top{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sz-top>div{background:var(--c-venue-bg);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.sz-top span,.sz-top small{font-size:.8rem;color:var(--muted)}
.sz-top b{font-size:1.3rem;font-weight:900;color:var(--c-venue)}
.sz-bar{display:flex;height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin:12px 0 4px}
.sz-bar i{display:block;height:100%}
.sz-bar .ok,.sz-dot.ok{background:var(--ok)} .sz-bar .bad,.sz-dot.bad{background:var(--bad)} .sz-bar .warn,.sz-dot.warn{background:var(--warn)}
.sz-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:.05em}
.sz-paid{margin-top:10px;padding:8px 12px;border-radius:10px;font-weight:800;font-size:.9rem}
.sz-paid.ok{background:var(--ok-bg);color:var(--ok)} .sz-paid.bad{background:var(--bad-bg);color:var(--bad)}
.sz-calc tr.bad td{color:var(--bad);font-weight:800}
.sz-rules{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.sz-rules>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sz-rules>summary::-webkit-details-marker{display:none}
.sz-rules>summary b{display:flex;align-items:center;gap:6px;font-size:1rem;color:var(--fg)}
.sz-rules>summary::after{content:"點開看 ▾";font-size:.8rem;font-weight:700;color:var(--muted)}
.sz-rules[open]>summary::after{content:"收起 ▴"}
.sz-rules[open] .rule-list{margin-top:8px}
.sz-rules .rule-list{margin:0;font-size:.93rem;line-height:1.65}
.stats-empty{text-align:center;margin:4px 0 14px}
.fc{display:grid;margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem;font-weight:700;color:var(--muted)}
.legend i,.pill[data-cat]::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:.05em;background:var(--cat)}
[data-cat="class"]{--cat:var(--accent)} [data-cat="venue"]{--cat:var(--c-venue)} [data-cat="coach"]{--cat:var(--c-coach)}
.tablewrap th.c-class,.tablewrap th.c-venue,.tablewrap th.c-coach{box-shadow:inset 0 -3px 0 var(--cat)}
.big-money{margin:0;font-size:1.8rem;font-weight:900;color:var(--warn);font-variant-numeric:tabular-nums}
button.pill{border:0;cursor:pointer;font:inherit;font-size:.88rem;font-weight:700;min-height:44px;padding:8px 14px;white-space:normal;text-align:left;line-height:1.3}
.sub{font-size:.88rem;color:var(--muted);flex-basis:100%}

.seg{display:grid;grid-template-columns:repeat(3,minmax(64px,1fr));gap:6px;flex:1 1 240px;max-width:330px}
.seg button{min-height:52px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);font-weight:700;font-size:1.02rem}
.seg button[aria-pressed="true"][data-s="present"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed="true"][data-s="leave"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.seg button[aria-pressed="true"][data-s="absent"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg.two button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
/* 點名：兩人一排 */
.list.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.list.pair .row{flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:space-between;gap:8px;padding:10px;border-top:0;min-width:0}
.list.pair .row:nth-child(n+3){border-top:1px solid var(--line)}
.list.pair .row:nth-child(odd){border-right:1px solid var(--line)}
.list.pair .who{flex:none;gap:4px 6px}
.list.pair .seg{flex:none;max-width:none;grid-template-columns:repeat(var(--n,3),1fr);gap:4px}
.list.pair .seg button{min-height:46px;padding:0;font-size:.92rem}
.list.pair .row.wide{grid-column:1/-1;border-right:0}
/* 統計卡片：出席／請假／缺席小格＋付款狀態 */
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}

<script>
(function(){
  const CLASSES = ["WH1","WH2","SL3","SL4","SU5","SH6","未分級"];
  const METHODS = ["現金","LINE Pay"];
  const ST = {present:"出席", leave:"請假", absent:"缺席", practice:"只打球", late:"臨時請假"};
  const DEF = { group:"老楊輪羽班", location:"", time:"每週六 14:00–17:00", start:"2026-12-12",
    coachHours:2, coachRate:1000, venueHours:3, venueRate:300, venueRate2:500, bigMin:5,
    venuePayer:"", treasurer:"mmwrwo34l", keeper:"m04", payInfo:"", manager:"m01", trNick:"建民", keeperNick:"吉哥", vpNick:"芳玉", bookerNick:"芳玉", coachNick:"楊教練" };   // 誰先付場地費、誰負責收錢、收款方式說明、誰負責維護管理
  const NUMS = ["coachHours","coachRate","venueHours","venueRate","venueRate2","bigMin"];
  // 2026/11 開會決定不租季，改成每月統計人數再訂場地（季租程式保留，沒有季就不作用）
  let SEASON_FROM = "9999-12-31";
  const DEF_SEASONS = [];
  let SEASONS = [];
  function setSeasons(list){
    SEASONS = (list || []).filter(x => x && x.from && x.to).map(x => ({ name: String(x.name || ""), from: x.from, to: x.to, dates: [...new Set(x.dates || [])].sort(), ...(x.paid ? { paid: x.paid } : {}) })).sort((a, b) => a.from < b.from ? -1 : 1);
    SEASON_FROM = SEASONS.flatMap(x => x.dates).sort()[0] || "9999-12-31";
  }
  setSeasons(DEF_SEASONS);
  const liveDates = x => x.dates.filter(d => !offReason(d));
  const seasonOf = d => SEASONS.find(x => d >= x.from && d <= x.to) || null;
  // 季內、但沒租到場地的週六（開季租之前的日期不算）
  // 往前／往後跳一週，遇到季內沒租場地的週六再多跳一週
  const stepWeek = (d, n) => { let x = shiftDate(d, 7 * n); for(let g = 0; seasonOff(x) && g < 20; g++) x = shiftDate(x, 7 * n); return x; };
  // 季租以外、個別指定的日期：取消的週六（含原因），和固定開幾面場地的週六
  const FIRST_DAY = "2026-12-12";   // 團課第一堂，之前的日期都不算
  // 停課日、指定開幾面、場地費預付到哪天：管理員在「隊友」頁的「特別日期」改，存在 settings/special
  // bookedTo：芳玉已經向館方訂好場地到哪天（每月 15 日統計後再往下訂）
  const DEF_SPECIAL = { off: { "2026-12-05": "沒借到場地" }, courts: {}, prepaidTo: "", bookedTo: "2027-01-31" };
  let OFF_DATES = {}, COURT_FIX = {}, VENUE_PREPAID_TO = "", BOOKED_TO = "";
  function setSpecial(x){ x = x || DEF_SPECIAL; OFF_DATES = { ...(x.off || {}) }; COURT_FIX = { ...(x.courts || {}) }; VENUE_PREPAID_TO = x.prepaidTo || ""; BOOKED_TO = x.bookedTo ?? DEF_SPECIAL.bookedTo; }
  // 請假截止：上課那個月的前一個月 15 日（例：1/9 的課，12/15 前要說）
  const leaveDeadline = d => { const [y, m] = d.split("-").map(Number); return m === 1 ? `${y - 1}-12-15` : `${y}-${pad(m - 1)}-15`; };
  const monthEnd = (y, m) => fmtDate(new Date(y, m, 0));
  setSpecial(DEF_SPECIAL);
  // ---------- 請假紀錄試算表：請假、停課、教練請假都以試算表為準（自動同步，有變動會提醒） ----------
  const SHEET_ID = "1o25HNU0IXbPkbgb9Zk37M_DjVjSo9zOCqqp34Ke1U_Y", SHEET_GID = "361843830";
  const SHEET_CSV = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}`;
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?gid=${SHEET_GID}`;
  function parseCsv(t){
    const rows = []; let row = [], v = "", q = false;
    for(let i = 0; i < t.length; i++){
      const c = t[i];
      if(q){ if(c === '"'){ if(t[i + 1] === '"'){ v += '"'; i++; } else q = false; } else v += c; }
      else if(c === '"') q = true;
      else if(c === ","){ row.push(v); v = ""; }
      else if(c === "\n"){ row.push(v); rows.push(row); row = []; v = ""; }
      else if(c !== "\r") v += c;
    }
    if(v || row.length){ row.push(v); rows.push(row); }
    return rows;
  }
  // 格子裡的付款日期（12/10、2026/12/10、12月10日），回傳 "YYYY-MM-DD" 或 "MM-DD"；沒有就回傳 ""
  const cellDate = v => { const s = String(v || "").trim(); let m = s.match(/(?:(\d{4})\s*[\/\-.年]\s*)?(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})\s*日?/);
    if(!m || +m[2] < 1 || +m[2] > 12 || +m[3] < 1 || +m[3] > 31) return ""; return (m[1] ? m[1] + "-" : "") + pad(m[2]) + "-" + pad(m[3]); };

  // ---------- 課表與費用 ----------
  function statusOf(d){

  }
  function leaversOf(d){

  }
  // 從開課日起每週一次，排到今天之後 8 週；點名過的非固定日期（補課）也算一堂
  function schedule(){
    const start = S.settings.start || today();
    const until = shiftDate(today() > start ? today() : start, 56);

  const billable = st => st !== "paused";
  // 這堂要分攤的人：沒請假的學員（整班暫停就沒有人要付）
  // 場地費：訂場地時算進來的人平分（不訓、臨時請假也要分攤）；教練費：當天實際上課的人分攤
  function classInfo(d){
    const st = statusOf(d);
    const r = (S.att[d] && S.att[d].records) || {};
    let ids = billable(st) ? players().filter(m => r[m.id] !== "leave").map(m => m.id) : [];
    if(practiceDay(d) && sheetDay(d) && sheetDay(d).practice.length) ids = ids.filter(id => r[id] === "practice" || r[id] === "late");   // 停課週只算來自主練習的人
    const prac = ids.filter(id => r[id] === "practice" || r[id] === "late"), n = ids.length - prac.length, k = prac.length;

    if(!n){ f.coach = 0; f.session = f.venue; }
    // 每堂都付給財務：pv＝每人場地費（上課＋臨時請假＋只打球平分）、pc＝每人教練費（上課的人平分）、pp＝上課的人一共要付
    let pv = n + k ? Math.ceil(f.venue / (n + k)) : 0, pc = n ? Math.ceil(f.coach / n) : 0;
    const sd = sheetDay(d);   // 人數和試算表一樣，就照試算表的每人金額，兩邊才對得起來
    if(sd && sd.nTrain === n && sd.nVenue === n + k && sd.pv > 0){ pv = sd.pv; pc = n ? (sd.pc || 0) : 0; }
    const pp = pv + pc;
    f.n = n; f.pp = pp;
    const amt = id => prac.includes(id) ? pv : pp;
    const payers = ids.filter(id => amt(id) > 0);
    return { st, ids, prac, n, k, pp, pv, pc, f, payers, total: n * pp + k * pv, amt,

  }
  // 上課（不含不訓、臨時請假）少於 4 人：提醒大家討論要不要停課
  const few = (d, ci) => ci.n > 0 && ci.n < 4 && !coachOff(d);
  const leaveCount = d => players().filter(m => ((S.att[d] && S.att[d].records) || {})[m.id] === "leave").length;
  const payKey = d => "class-" + d;
  // 繳費紀錄：網頁記的＋試算表名字格填「已付」的（試算表的只讀）
  function payRecs(key){
    const out = { ...((S.pay[key] || {}).records || {}) }, x = sheetDay(key.slice(6));
    if(x && x.paid) x.paid.forEach(n => { const m = memberByName(n); if(m && !out[m.id]) out[m.id] = { amount: classInfo(key.slice(6)).amt(m.id), date: fullDate((x.paidOn || {})[n], key.slice(6)) || "", method: "試算表", sheet: true }; });

  function flowOf(d){
    const ci = classInfo(d), f = ci.f;

    const coachPaid = (S.pay[payKey(d)] || {}).coachPaid || (sheetDay(d) && sheetDay(d).coachPaid ? { date: fullDate(sheetDay(d).coachPaidOn, d), method: "試算表", sheet: true } : null);   // 財務付給教練的紀錄（試算表「給教費」有填也算）

  // n：分攤場地費的人數（不給就用全部隊友）；4 人以下訂 1 面、5 人以上訂 2 面

  const courtLabel = f => `${f.two ? 2 : 1} 面場地` + (f.coachOff ? "，沒有教練課，只收場地費" : "");
  // ---------- writes: one at a time per document ----------
  const queues = {};
  // 修改先暫存，按「確認儲存」才一次寫進雲端
  const staged = new Map();
  let changes = 0;   // 點了幾次修改
  function write(path, fn){
    if(!S.online || !S.canWrite) return;

        .finally(() => { pendingWrites--; if(!pendingWrites) load(); });

  function noMembers(){

  // 我的帳單：隊友選一次自己的名字（記在這支手機），打開就看到自己要付多少（只能看）
  const ME_KEY = "ylMe";

  const setMe = v => { try { v ? localStorage.setItem(ME_KEY, v) : localStorage.removeItem(ME_KEY); } catch(_){} };
  function meCard(sch){
    const ps = players(); if(!ps.length) return "";
    const id = getMe(), m = ps.find(x => x.id === id);
    if(!m || S.meEdit) return `<div class="me"><label class="field"><span>選你的名字，就能看自己的帳單（這支手機會記住）</span><select id="mePick"><option value="">－ 選自己的名字 －</option>${ps.slice().sort(byClassThenStroke).map(x => `<option value="${x.id}"${x.id === id ? " selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>${m ? `<div><button class="link" data-act="me-cancel">取消</button></div>` : ""}</div>`;
    const nd = S.date || nextClassDate(sch), ci = classInfo(nd), rec = ((S.att[nd] || {}).records || {})[m.id], tr0 = esc(trName()), how = `轉帳請提前轉給${tr0}，付現金當天交給${tr0}${S.settings.payInfo ? "・" + esc(S.settings.payInfo) : ""}`;
    let next;
    if(nd < S.settings.start) next = { cls: "mute", big: "還沒開課", note: `第一堂 ${md(S.settings.start)}` };
    else if(offReason(nd) || seasonOff(nd) || ci.st === "paused") next = { cls: "mute", big: "停課", note: "這週不用付" };
    else if(rec === "leave") next = { cls: "mute", big: "已請假", note: "場地費、教練費都不用付" };
    else if(isTreasurer(m)) next = { cls: "mute", big: "不用付", note: "你負責收錢，自己那份不用轉" };
    else if(paidRec(nd, m.id)) next = { cls: "ok", big: "✓ 已付", note: money(oweAmount(m, nd)) };
    else if(rec === "late") next = { cls: "", big: money(ci.pv), note: `臨時請假：場地費照付，教練費不用付・${how}` };
    else if(rec === "practice") next = { cls: "", big: money(ci.pv), note: `只打球：只付場地費・${how}` };
    else next = { cls: "", big: money(oweAmount(m, nd)), note: `${ci.pc ? `場地 ${money(ci.pv)}＋教練 ${money(ci.pc)}` : "教練請假，只收場地費"}・${how}` };
    const owed = owedBy(m, sch).filter(d => d !== nd), total = owed.reduce((a, d) => a + oweAmount(m, d), 0);
    
    return `<div class="me">
      <div class="me-top"><span class="me-hi">${esc(m.name.length >= 3 ? m.name.slice(1) : m.name)}，這是你的帳單</span><button class="link" data-act="me-change">不是我</button></div>
      <div class="me-grid">
        <div class="me-cell ${next.cls}"><span>${md(nd)} 這堂</span><b>${next.big}</b><small>${next.note}</small></div>
        <div class="me-cell ${owed.length ? "bad" : "ok"}"><span>之前的課</span><b>${owed.length ? money(total) : "都付清了 ✓"}</b>${owed.length ? `<small>還沒付 ${owed.length} 堂：${owed.map(md).join("、")}</small>` : ""}</div>
      </div>
      ${(() => { const t = today(), x = SEASONS.find(z => z.dates.length && z.dates[0] <= t && z.to >= t);
        const ds = x ? heldDates(liveDates(x)) : pastClasses(sch).map(i => i.date).filter(d => statusOf(d) !== "paused");
        if(!ds.length) return "";
        const a = ds.filter(d => attended(m, d)).length;
        return `<div class="me-att">🏸 ${x ? "本季" : "開課以來"}出席 <b>${a}</b>／${ds.length} 堂${x ? `<span>（本季共 ${liveDates(x).length} 堂）</span>` : ""}${a === ds.length && a >= 2 ? "　全勤，太棒了！" : ""}</div>`; })()}
      ${owed.length && next.cls !== "" ? `<p class="muted">${how}</p>` : ""}
    </div>`;
  }

  // 有人請假時：整班暫停，或其他人照上
  const modeSwitch = cur => !S.canWrite || sheetDay(S.date) ? "" : `<div class="field"><span>有人請假，這週要怎麼辦？</span>
    <div class="seg two" role="group" aria-label="有人請假時這週怎麼辦">
      <button data-act="mode" data-v="paused" aria-pressed="${cur==="paused"}"${dis()}>整班停課</button>
      <button data-act="mode" data-v="single" aria-pressed="${cur==="single"}"${dis()}>其他人照上</button>
    </div></div>`;

  // 操作說明只給管理員看，一般人只看資訊
  const adminHint = text => S.canWrite ? text : "";
  const adminHintP = text => S.canWrite ? `<p class="muted">${text}</p>` : "";

  // 這堂：日期切換＋人數、每人、場地＋請假名單、截止日（點名、繳費共用一張）
  function classCard(sch, where){
    const d = S.date, nd = nextClassDate(sch), isNext = d === nd, t = today();
    const nav = `<div class="cc-nav">
        <button class="nav" data-act="date" data-n="-1" aria-label="上一堂"${d <= S.settings.start ? " disabled" : ""}>‹</button>
        <label class="picker"><span><small>${isNext ? "下一堂" : d < t ? "上過的課" : "之後的課"}</small><b class="pk-d">${+d.slice(5, 7)}月${+d.slice(8)}日<i>（${WD[weekday(d)]}）</i></b></span><input type="date" id="datePick" value="${d}" min="${S.settings.start}" aria-label="選擇哪一堂"></label>
        <button class="nav" data-act="date" data-n="1" aria-label="下一堂">›</button>
      </div>`;
    const back = isNext ? "" : `<div><button class="link" data-act="date-next">回到下一堂（${md(nd)}）</button></div>`;
    const box = (cls, body, after = "") => `<div class="next ${cls}">${nav}${body}</div>${back}${where === "checkin" ? after : ""}`;
    const msg = x => `<div class="nx-f">${x}</div>`;
    if(offReason(d)) return box("off", msg(`這週停課${offReason(d) !== "停課" ? `（${esc(offReason(d))}）` : ""}，不上課、不收費`));
    if(seasonOff(d) && statusOf(d) === "planned") return box("off", msg("停課：這天沒租場地，不上課、不收費"),
      S.canWrite && d >= t ? `<div class="actions"><button class="btn small" data-act="sz-cancel" data-date="${d}">恢復這堂（有租場地）</button></div>` : "");
    if(d < S.settings.start) return box("off", msg(`還沒開課，第一堂是 ${md(S.settings.start)}`));
    const ci = classInfo(d), f = ci.f, lv = leaversOf(d);
    if(ci.st === "paused") return box("off", msg(`停課：${esc(lv.join("、"))} 請假，這週不上課、不收費`), modeSwitch("paused"));
    const dl = leaveDeadline(d);
    const foot = [
      d >= t ? `請假截止 ${mdw(dl)}${t > dl ? "・已過，現在請假算臨時請假" : ""}` : "",
      d >= t && BOOKED_TO && d > BOOKED_TO ? "場地還沒訂" : "",
      f.coachOff ? coachOffText(d) : ""].filter(Boolean).join("・");
    const rec = (S.att[d] && S.att[d].records) || {}, on = active().filter(m => ci.ids.includes(m.id));
    const nm = a => a.map(m => esc(m.name)).join("、");
    const pracL = on.filter(m => rec[m.id] === "practice"), lateL = on.filter(m => rec[m.id] === "late");
    const goL = on.filter(m => !["absent", "practice", "late"].includes(rec[m.id])), leaveL = active().filter(m => rec[m.id] === "leave"), absentL = on.filter(m => rec[m.id] === "absent");
    const pracLine = (lateL.length ? `<div class="nx-pr"><b>臨時請假</b><span>${nm(lateL)}：場地費照付 ${money(ci.pv)}，教練費不用付</span></div>` : "")
      + (pracL.length ? `<div class="nx-pr"><b>只打球</b><span>${nm(pracL)}：不上教練課，只付場地費 ${money(ci.pv)}</span></div>` : "");
    const fewLine = few(d, ci) && d >= t ? `<div class="nx-warn">上課只有 ${ci.n} 人（只打球、臨時請假不算），少於 4 人，請大家討論要不要停課</div>` : "";
    const who = where === "checkin" && !(S.canWrite && d <= t) ? `<div class="nx-who">
        <p><b>${d <= t ? "出席" : f.coachOff ? "下場" : "上課"}</b>${nm(goL) || "－"}</p>
        ${leaveL.length ? `<p><b>請假</b>${nm(leaveL)}</p>` : ""}
        ${absentL.length ? `<p><b>缺席</b>${nm(absentL)}</p>` : ""}
      </div>` : "";
    const szCancel = S.canWrite && d >= t && statusOf(d) === "planned" && seasonOf(d) && seasonOf(d).dates.includes(d)
      ? `<div class="actions"><button class="btn small" data-act="sz-cancel" data-date="${d}">這堂停課（場地也退）</button></div>` : "";
    return box("", `<div class="nx-s">
        <div><span>${ic("people")}${f.coachOff ? "下場" : "上課"}</span><b>${ci.n} 人</b></div>
        <div><span>${ic("coin")}每人</span><b>${money(ci.pp).replace("NT$", '<i class="cur">NT$</i>')}</b><small>${ci.pc ? `場地 ${ci.pv}＋教練 ${ci.pc}` : "只收場地費"}</small></div>
        <div><span>${ic("court")}場地</span><b>${f.two ? 2 : 1} 面</b><small>${ci.n + ci.k} 人分攤</small></div>
      </div>
      ${fewLine}${pracLine}${who}
      <div class="nx-f">${ic("clock")}<span>${foot}</span></div>`, (ci.st === "single" ? modeSwitch("single") : "") + szCancel);
  }

  // 點名
  function viewCheckin(sch){
    const list = active();
    const rec = (S.att[S.date] && S.att[S.date].records) || {};
    const st = statusOf(S.date);
    const c = {present:0, leave:0, absent:0};
    list.forEach(m => { if(c[rec[m.id]] !== undefined) c[rec[m.id]]++; });
    const unmarked = list.length - c.present - c.leave - c.absent;
    const past = S.date <= today();
    const ci0 = classInfo(S.date), on = active().filter(m => ci0.ids.includes(m.id));
    const absentL = on.filter(m => rec[m.id] === "absent"), goL = on.filter(m => rec[m.id] !== "absent"), leaveL = active().filter(m => rec[m.id] === "leave");
    let h = `
      ${classCard(sch, "checkin")}
`;
    if(!list.length) return h + noMembers();
    h += `
      ${!S.canWrite || S.date > today() ? adminHintP("上課當天才能點名，請假會自動帶入。") + leaveBox() : `<ul class="list pair">` +
      list.map(m => {
        const s = rec[m.id];
        return `<li class="row">
          <div class="who"><b>${esc(m.name)}</b>${tagHtml(m)}</div>
          ${s === "practice" || s === "late" ? `<span class="pill" title="試算表登記${ST[s]}">${s === "late" ? "臨時請假・付場地費" : "只打球・不上課"}</span>` : `<div class="seg" style="--n:3" role="group" aria-label="${esc(m.name)} 的出席狀態">
            ${["present","leave","absent"].map(k => `<button data-act="att" data-id="${m.id}" data-s="${k}" aria-pressed="${s===k}"${sheetDay(S.date) && (k === "leave" || s === "leave") ? " disabled" : dis()}>${ST[k]}</button>`).join("")}
          </div>`}</li>`;
      }).join("") + `</ul>
      <p class="muted">沒請假就算出席，只要點缺席的人，最後按「確認儲存」。</p>
      ${leaveBox()}`}`;
    return h;
  }

  // 繳費（每堂）
  function viewPay(sch){
    const d = S.date, ci = classInfo(d);
    const key = payKey(d);
    const rec = payRecs(key);
    let h = `
      ${classCard(sch, "pay")}
      ${meCard(sch)}`;
    if(!players().length) return h + noMembers();
    const offWhy = offReason(d) || (seasonOff(d) ? "這天沒租場地" : "");
    if(!offWhy && ci.ids.length && d >= S.settings.start){
      const fl = flowOf(d);
      const who = players().filter(m => ci.payers.includes(m.id) || (isTreasurer(m) && ci.ids.includes(m.id)));
      const mustPay = who.filter(m => !selfSettled(m, d));
      const paid = mustPay.filter(m => rec[m.id]);
      const unpaid = mustPay.filter(m => !rec[m.id]);
      // 財務、場地負責人不用轉課費，另外列在下面（財務在前）
      const special = who.filter(m => !mustPay.includes(m) && !rec[m.id]).sort((a, b) => isTreasurer(a) - isTreasurer(b));
      const listed = [...unpaid, ...paid, ...who.filter(m => !mustPay.includes(m) && rec[m.id])];
      const total = Object.values(rec).reduce((a,r) => a + Number(r.amount||0), 0);
      h += `
        ${unpaid.length || !mustPay.length ? "" : `<div class="banner ok">✓ 大家都已付，辛苦了！</div>`}
        ${fl.tr ? moneyCard(d, fl, paid.length, mustPay.length, S.canWrite || !mustPay.length ? "" : payList(key, listed, ci.pp, d, "pair")) : ""}
        ${S.canWrite && who.length ? `<h3>隊友繳費・已付 ${paid.length}／${mustPay.length} 人</h3>
        <p class="muted">點按鈕記已付，再點一下取消；試算表勾了收費日期、「已付款」或「臨假已付款」也會自動打勾。</p>${payList(key, listed, ci.pp, d, "pair")}${unpaid.length ? `<div class="actions"><button class="btn block" data-act="copy-class" data-date="${d}">複製收費訊息</button></div>` : ""}`
          : fl.tr || !who.length ? "" : `<details class="fold"><summary>大家繳費狀況（已付 ${paid.length}／${mustPay.length} 人）</summary>${payList(key, listed, ci.pp, d, "pair")}</details>`}
        `;
    }
    h += rulesBox();
    return h;
  }


  // 某人這堂要繳多少（場地＋教練；臨時請假、只打球只付場地）
  function oweAmount(m, d){
    return classInfo(d).amt(m.id);
  }

  // 這堂的錢怎麼走
  // 這堂錢怎麼走：① 隊友付給吉哥 ② 吉哥付教練、館方（一張卡看完）
  function moneyCard(d, fl, paidN, mustN, listHtml = ""){
    if(!fl.tr) return "";
    const tr = esc(trName()), cn = esc(S.settings.coachNick || "教練"), s = S.settings;
    const num = x => Number(x).toLocaleString("en-US"), cf = fl.ci.f, pp = fl.ci.pp, n = fl.ci.n, lv = leaveCount(d);
    const trIn = fl.ci.ids.includes(fl.tr.id);
    const got = fl.ci.total, out = fl.coach + fl.venue, left = got - out, due = (fl.coachPaid ? 0 : fl.coach) + (fl.venueDone ? 0 : fl.venue), bk = bkName() || "負責場地的人";
    const early = d > today();
    const st = (ok, kind, rec) => { const sea = kind === "spaid", yes = (sea ? "✓ 已匯款" : "✓ 已付") + (rec && rec.date ? " " + md(rec.date) : ""), no = sea ? "還沒匯款" : early ? "待付" : "還沒付", cls = ok ? "ok" : early && !sea ? "wait" : "bad"; return S.canWrite
      ? `<button class="pill tap ${cls}" data-act="${kind}-${ok ? "undo" : "save"}" data-date="${d}"${dis()}>${ok ? yes : sea ? "記已匯款" : "記已付"}</button>`
      : `<span class="pill ${cls}">${ok ? yes : no}</span>`; };
    const row = (cat, name, note, amt, status) => `<div class="po-row" data-cat="${cat}">
        <div class="po-what"><b>${name.startsWith("<span") ? "" : `<i class="po-dot"></i>`}${name}</b><small>${note}</small>${status ? `<div class="po-st">${status}</div>` : ""}</div>
        <div class="po-right"><span class="po-amt">${amt}</span></div></div>`;
    const step = (k, t, right = "") => `<div class="po-step"><span class="po-no">${k}</span><b>${t}</b>${right}</div>`;
    const courts = `${cf.two ? 2 : 1} 面 × ${s.venueHours} 小時 × ${num(cf.two ? s.venueRate2 : s.venueRate)}`;

    // ① 大家付給吉哥（場地＋教練），② 吉哥付教練、付館方
    const ci = fl.ci, mine = ci.payers.includes(fl.tr.id);
    const ln = ci.payers.filter(id => id !== fl.tr.id && !ci.prac.includes(id)).length, lk = ci.payers.filter(id => id !== fl.tr.id && ci.prac.includes(id)).length;
    const share = row("class", "這堂要收", [ln ? `上課 ${ln} 人 × ${money(pp)}` : "", lk ? `只付場地 ${lk} 人 × ${money(ci.pv)}` : ""].filter(Boolean).join("＋") + (mine ? `（${tr}自己那份不用轉）` : ""), money(got),
      `<span class="pill ${paidN >= mustN ? "ok" : early ? "wait" : "bad"}">已付 ${paidN}／${mustN} 人</span>`);
    const coach = fl.coach > 0
      ? row("coach", `付${cn}`, `${s.coachHours} 小時 × ${num(s.coachRate)}`, money(fl.coach), st(!!fl.coachPaid, "coach", fl.coachPaid))
      : row("coach", "教練費", practiceDay(d) ? "停課，不上教練課" : "教練請假，這堂不用付", "—", `<span class="pill">免付</span>`);
    const venue = row("venue", "付館方", courts, money(fl.venue), fl.pre ? `<span class="pill ok">✓ 已付</span>` : st(fl.venueDone, "venue", fl.venuePaid));
    return `<div class="card payout"><h2>這堂錢怎麼走</h2>
        ${step(1, "大家付給" + tr)}${share}${listHtml ? `<details class="po-list"><summary>看誰付了</summary>${listHtml}</details>` : ""}
        ${step(2, tr + "付出去")}${coach}${venue}
        ${S.canWrite ? `<div class="po-foot"><b>${due ? `還要付${[!fl.coachPaid && fl.coach ? `教練 ${money(fl.coach)}` : "", !fl.venueDone && fl.venue ? `館方 ${money(fl.venue)}` : ""].filter(Boolean).join("、")}` : "✓ 都付清了"}</b><span class="muted">${left > 0 ? `零頭 ${num(left)} 存班費` : left < 0 ? `還差 ${num(-left)}` : "收支剛好打平"}</span></div>` : ""}
      </div>`;
  }

  // 繳費文件：class-<日期>（保留匯款紀錄）
  const payDoc = (key, records) => ({ ...(S.pay[key] || {}), date: key.slice(6), records });
  const payLabel = key => `${md(key.slice(6))} `;

  // 收付狀態標籤：管理員點一下可記下／取消
  const flowPill = (ok, text, kind, d) => { const cat = kind === "coach" ? "coach" : "venue"; return S.canWrite
    ? `<button class="pill ${ok ? "ok" : "bad"} tap" data-cat="${cat}" data-act="${kind}-${ok ? "undo" : "save"}" data-date="${d}"${dis()}>${text}</button>`
    : `<span class="pill ${ok ? "ok" : "bad"}" data-cat="${cat}">${text}</span>`; };

  // 一份繳費名單
  function payList(key, list, defAmt, d, cls = ""){
    const rec = payRecs(key);
    return `<ul class="list${cls ? " " + cls : ""}">` + list.map(m => {
      const r = rec[m.id], tok = key + "|" + m.id;
      const amt = d ? oweAmount(m, d) : defAmt;
      if(!r && d && isTreasurer(m)){
        return `<li class="row"><div class="who"><b>${esc(m.name)}</b></div>${(() => { const fl = flowOf(d), cn = esc(S.settings.coachNick || "教練"), pill = (ok, t, k) => flowPill(ok, (ok ? "✓ 已付給" : "還沒付給") + t, k, d); return `<div class="actions stack">${fl.season ? flowPill(fl.venueDone, fl.venueDone ? "✓ 季租已付館方" : "季租還沒付館方", "spaid", d) : pill(fl.venueDone, "館方", "venue")}${fl.coach > 0 ? pill(!!fl.coachPaid, cn, "coach") : `<span class="pill">教練請假，不用付</span>`}</div>`; })()}</li>`;
      }
      const wait = !r && d && d > today();
      if(r && r.sheet) return `<li class="row"><div class="who"><b>${esc(m.name)}</b></div><div class="actions"><span class="pill ok" title="試算表上註記已付">✓ 已付${r.date ? " " + md(r.date) : "（試算表）"}</span></div></li>`;
      const right = `<div class="actions">${S.canWrite
        ? `<button class="pill ${r ? "ok" : wait ? "wait" : "bad"}" data-act="${r ? "pay-del" : "pay-save"}" data-key="${key}" data-id="${m.id}" data-amt="${amt}">${r ? "✓ 已付" : wait ? "待付" : "還沒付"}</button>`
        : `<span class="pill ${r ? "ok" : wait ? "wait" : "bad"}">${r ? "✓ 已付" : wait ? "待付" : "還沒付"}</span>`}</div>`;
      return `<li class="row">
        <div class="who"><b>${esc(m.name)}</b>
</div>
        ${right}</li>`;
    }).join("") + `</ul>`;
  }

  // 統計
  function viewStats(sch){
    const list = active();
    if(!list.length) return noMembers();
    const t = today();
    const past = sch.filter(i => i.date <= t && i.date >= S.settings.start);
    const held = heldDates(past.map(i => i.date)).length;
    const paused = past.filter(i => i.status === "paused");
    const rows = list.map(m => {
      let p=0, l=0, a=0;
      heldDates(sch.map(i => i.date)).forEach(d => { if(attended(m, d)) p++; else if(classInfo(d).ids.includes(m.id)) a++; });
      past.forEach(i => { if(((S.att[i.date] || {}).records || {})[m.id] === "leave") l++; });
      const owed = m.role === "coach" ? [] : owedBy(m, sch);
      return {m, p, l, a, owed};
    });
    const owing = rows.filter(r => r.owed.length).length, num = x => Number(x).toLocaleString("en-US");
    return `
      ${held || paused.length ? `<div class="summary">

  // ---------- 季租日期編輯 ----------

  // ---------- 班費收支 ----------
  function fundInfo(sch){
    const rows = ledgerRows(sch);
    const settled = rows.filter(r => !r.left && r.venueDone && r.coachDone);
    const extra = settled.reduce((a, r) => a + r.extra, 0);
    const items = (S.fund.items || []).slice().sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
    const inc = items.filter(i => i.type === "in").reduce((a, i) => a + Number(i.amount || 0), 0);
    const out = items.filter(i => i.type !== "in").reduce((a, i) => a + Number(i.amount || 0), 0);
    return { extra, settledN: settled.length, inc, out, bal: extra + inc - out, items };
  }
  const saveFund = () => write("settings/fund", save("settings", "fund", { items: JSON.parse(JSON.stringify(S.fund.items)) }));
  function fundCard(sch){
    const fi = fundInfo(sch), num = v => Number(v).toLocaleString("en-US");

      <h2>班費收支</h2>

      </table>` : ""}
      ${S.canWrite ? `<h3>記一筆</h3>

  // ---------- 出席次數 ----------
  const attended = (m, d) => classInfo(d).ids.includes(m.id) && !["absent", "late"].includes(((S.att[d] || {}).records || {})[m.id]);
  const heldDates = ds => ds.filter(d => d <= today() && !["planned", "paused"].includes(statusOf(d)));

  // ---------- 季末結算（複製到 LINE） ----------
  function seasonReport(){
    const t = today(), x = SEASONS.find(z => z.to >= t) || SEASONS[SEASONS.length - 1]; if(!x) return "";
    const sch = schedule(), sc = seasonCalc(x), N = sc.N, num = v => Number(v).toLocaleString("en-US");
    const held = heldDates(liveDates(x)), done = sc.done + sc.paused >= N;
    const att = players().map(m => ({ m, n: held.filter(d => attended(m, d)).length })).sort((a, b) => b.n - a.n);
    const owe = players().map(m => ({ m, ds: owedBy(m, sch).filter(d => x.dates.includes(d)) })).filter(o => o.ds.length);
    const fi = fundInfo(sch);
    return `🏸【${S.settings.group}】${x.name}${done ? "結算" : "到目前為止"}\n` +
      `上課 ${held.length} 堂${sc.paused ? `、停課 ${sc.paused} 堂` : ""}（共 ${N} 堂${done ? "" : `，還有 ${N - sc.done - sc.paused} 堂`}）\n\n` +
      `📋 出席\n${att.map(a => `${a.m.name} ${a.n} 堂`).join("、")}\n\n` +
      `💰 課費\n${owe.length ? owe.map(o => `${o.m.name} 還沒付 ${o.ds.length} 堂，${money(o.ds.reduce((a, d) => a + oweAmount(o.m, d), 0))}`).join("\n") : "大家都已付 👍"}\n\n` +
      `🏟️ 季租場地\n${S.settings.bookerNick ? `${S.settings.bookerNick}租借，` : ""}${trName()}${seasonPaid(x) ? "已" : "要"}匯款給館方 ${num(sc.total)}（${N} 堂），已上 ${sc.done} 堂、課費收回 ${num(sc.back)}\n\n` +
      `🪙 班費結餘 ${money(fi.bal)}\n` +
      `謝謝大家${done ? "這一季" : ""}的努力，下次球場見！`;

  // 季租場地：吉哥整季匯給館方，每堂課費裡的場地費慢慢收回來

    const ds = liveDates(x), offs = []; if(ds.length) for(let d = ds[0]; d <= ds[ds.length - 1]; d = shiftDate(d, 7)) if(!ds.includes(d)) offs.push(d);

      ${offs.length ? `<p class="sz-dates">停課：${offs.map(d => { const r = offReason(d); return md(d) + (r && r !== "停課" ? " " + esc(r) : ""); }).join("、")}</p>` : ""}
      ${started ? `<div class="sz-bar" role="img" aria-label="已上課 ${pct(back)}"><i class="ok" style="width:${pct(back)}"></i><i class="warn" style="width:${pct(paused * per)}"></i></div>
      <table class="calc sz-calc">
        <tr><td><i class="sz-dot ok"></i>已上 ${done} 堂，課費收回場地費</td><td></td><td>${money(back)}</td></tr>
        ${paused ? `<tr><td><i class="sz-dot warn"></i>停課 ${paused} 堂（場地費下季扣除）</td><td></td><td>${money(paused * per)}</td></tr>` : ""}
        <tr><td><i class="sz-dot"></i>還沒上的 ${N - done - paused} 堂</td><td></td><td>${money(later)}</td></tr>
        <tr class="total"><td>季租合計</td><td></td><td>${money(total)}</td></tr>
      </table>` : ""}
      <details class="sz-rules"><summary><b>${ic("sheet")}場租合約重點</b></summary>${contractList()}</details>
      ${S.canWrite ? `<div class="actions"><button class="btn block" data-act="copy-season">複製${done + paused >= N ? "季末結算" : "本季結算"}</button></div>` : ""}
    </div>`;
  }
  function seasonCalc(x){
    const t = today(), s = S.settings, per = s.venueHours * s.venueRate2;
    const ds = liveDates(x), N = ds.length, total = N * per;
    let done = 0, paused = 0;
    ds.forEach(d => { const st = statusOf(d); if(d > t || st === "planned") return; if(st === "paused") paused++; else done++; });
    return { N, total, per, done, paused, later: (N - done - paused) * per, back: done * per };
  }

  // 吉哥對帳：有點名或收款紀錄、或已經上過的每一堂
  function ledgerRows(sch){
    const t = today();
    return sch.filter(i => i.date >= S.settings.start && billable(i.status) && (i.date <= t || S.pay[payKey(i.date)]))
      .map(i => { const d = i.date, ci = classInfo(d); if(!ci.ids.length) return null;
        const fl = flowOf(d), f = ci.f, rec = payRecs(payKey(d));
        const must = players().filter(m => ci.payers.includes(m.id) && !selfSettled(m, d));
        const due = must.reduce((a, m) => a + ci.amt(m.id), 0), got = must.reduce((a, m) => a + (rec[m.id] ? Number(rec[m.id].amount || ci.amt(m.id)) : 0), 0);
        return { d, n: ci.n, k: ci.k, pp: ci.pp, amt: ci.amt, due, got, left: must.filter(m => !rec[m.id]).length,
          venue: f.venue, venueDone: fl.venueDone, season: fl.season, coach: f.coach, coachDone: !!fl.coachPaid || !f.coach,
          extra: ci.total - f.session };
      }).filter(Boolean);
  }
  function ledgerCard(sch){

    const sum = k => rows.reduce((a, r) => a + r[k], 0);
    const settled = rows.filter(r => !r.left && r.venueDone && r.coachDone);

    function ledgerInner(){ return `

        <tr class="total"><td>班費<small>進位多收的零頭，已結清 ${settled.length} 堂</small></td><td></td><td>${money(settled.reduce((a, r) => a + r.extra, 0))}</td></tr>
      </table>
      <p class="muted">✓ 已付、紅字還沒付。「付館方」「付${cn}」都由${tr}付。班費＝進位的零頭，收付都完成才算。</p>
      ${S.canWrite ? `<div class="actions"><button class="btn small" data-act="export-csv">匯出 Excel 備份</button></div>` : ""}

  function exportCsv(){
    const sch = schedule(), out = [["日期","姓名","出席狀態","應付","已付"]];
    const STN = { present: "出席", leave: "請假", absent: "缺席", practice: "只打球", late: "臨時請假" };
    ledgerRows(sch).forEach(r => {
      const rec = (S.att[r.d] && S.att[r.d].records) || {}, pay = payRecs(payKey(r.d));
      const ids = classInfo(r.d).ids;
      players().forEach(m => {
        const going = ids.includes(m.id), self = going && selfSettled(m, r.d);
        out.push([r.d, m.name, STN[rec[m.id]] || (going ? "出席" : ""), going ? r.amt(m.id) : 0, !going ? "" : self ? "免付（財務）" : pay[m.id] ? "已付" : "還沒付"]);
      });
    });
    const csv = "\ufeff" + out.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = (S.settings.group || "點名簿") + "_備份_" + today() + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    toast("已下載備份，可以用 Excel 打開");
  }

    return `<p class="muted">改完按下方「確認儲存」，才會存進雲端。</p>

  // ---------- events ----------
  document.querySelector(".tabs").addEventListener("click", e => {

    S.tab = b.dataset.tab; S.payOpen = S.payConfirm = S.editId = S.delConfirm = null; render(); window.scrollTo(0,0);
  });
  app.addEventListener("input", e => { if(e.target.id) S.draft[e.target.id] = e.target.value; });
  app.addEventListener("change", e => {
    const t = e.target;
    // 開課日（12/5）之前的日期不列，選到更早就跳回開課日
    const clamp = v => v < S.settings.start ? S.settings.start : v;
    if(t.id === "mePick"){ setMe(t.value); S.meEdit = false; render(); return; }
    if(t.id === "datePick" && t.value){ S.date = clamp(t.value); render(); }
    else if(t.id) S.draft[t.id] = t.value;
    if(t.id && t.id.startsWith("set_")) applySettings();
    if(t.id === "sp_pre"){ VENUE_PREPAID_TO = t.value || ""; saveSpecial(); delete S.draft.sp_pre; setTimeout(scheduleRender, 0); }
    if(t.id === "sp_book"){ BOOKED_TO = t.value || ""; saveSpecial(); delete S.draft.sp_book; setTimeout(scheduleRender, 0); }
  });
  // 設定欄位一改就暫存，按下方「確認儲存」才寫進雲端
  function applySettings(){
    const next = { ...S.settings };
    ["group","location","time","start","manager","treasurer","keeper","payInfo","trNick","keeperNick","bookerNick"].forEach(k => { const el = document.getElementById("set_" + k); if(el) next[k] = el.value.trim(); });
    NUMS.forEach(k => { const el = document.getElementById("set_" + k); if(!el) return; const n = Number(el.value); next[k] = n >= 0 ? n : DEF[k]; });
    if(!next.start) next.start = DEF.start;
    delete next.perTerm;
    if(next.start !== S.settings.start) S.date = null;
    S.settings = next;
    Object.keys(S.draft).filter(k => k.startsWith("set_")).forEach(k => delete S.draft[k]);
    write("settings/main", save("settings", "main", next));
    setTimeout(scheduleRender, 0);
  }

  app.addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
    const act = b.dataset.act, id = b.dataset.id;

    switch(act){
      case "goto": S.tab = b.dataset.tab; render(); break;
      case "me-change": S.meEdit = true; render(); break;
      case "sheet-ok": setSeen(sheetLeaveKeys()); render(); break;
      case "sz-date": case "sz-cancel": {
        const d = b.dataset.date, x = seasonOf(d); if(!x) { toast("這天不在任何一季裡"); break; }
        const was = x.dates.includes(d);
        toggleSeasonDate(d); render();
        toast(`記下了：${md(d)} ${was ? "停課（場地也退），記得 7 天前通知館方" : "恢復上課"}`);
        break;
      }
      case "sp-off-add": {
        const d = S.draft.sp_off_d, r = (S.draft.sp_off_r || "").trim() || "停課";
        if(!d){ toast("請選日期"); break; }
        OFF_DATES[d] = r; saveSpecial(); delete S.draft.sp_off_d; delete S.draft.sp_off_r; render(); toast(`記下了：${md(d)} 停課（${r}），記得 7 天前通知館方`); break;
      }
      case "sp-off-del": { const d = b.dataset.date; delete OFF_DATES[d]; saveSpecial(); render(); toast(`記下了：${md(d)} 恢復上課`); break; }
      case "sp-ct-add": {
        const d = S.draft.sp_ct_d, n = Number(S.draft.sp_ct_n || 2);
        if(!d){ toast("請選日期"); break; }
        COURT_FIX[d] = n; saveSpecial(); delete S.draft.sp_ct_d; render(); toast(`記下了：${md(d)} 開 ${n} 面`); break;
      }
      case "sp-ct-del": { const d = b.dataset.date; delete COURT_FIX[d]; saveSpecial(); render(); toast(`記下了：${md(d)} 改回照人數決定`); break; }
      case "sp-pre-save": {
        const d = S.draft.sp_pre ?? VENUE_PREPAID_TO;
        VENUE_PREPAID_TO = d || ""; saveSpecial(); delete S.draft.sp_pre; render(); toast(d ? `記下了：場地費已預付到 ${md(d)}` : "記下了：取消場地費預付"); break;
      }
      case "sz-del-ask": S.szDel = b.dataset.i === "" ? null : +b.dataset.i; render(); break;
      case "sz-del": { const i = +b.dataset.i, x = SEASONS[i]; S.szDel = null; if(!x) break; SEASONS.splice(i, 1); setSeasons(SEASONS); saveSeasons(); render(); toast(`記下了：刪除「${x.name}」`); break; }
      case "sz-add": {
        const name = (document.getElementById("sz_name").value || "").trim(), from = document.getElementById("sz_from").value, to = document.getElementById("sz_to").value;
        if(!name || !from || !to){ toast("名稱和日期都要填"); break; }
        if(to < from){ toast("結束日要在開始日之後"); break; }
        if(SEASONS.some(x => !(to < x.from || from > x.to))){ toast("日期和其他季重疊了"); break; }
        const x = { name, from, to, dates: [] }; x.dates = seasonWeeks(x);
        setSeasons([...SEASONS, x]); saveSeasons();
        ["sz_name", "sz_from", "sz_to"].forEach(k => delete S.draft[k]);
        render(); toast(`記下了：新增「${name}」${x.dates.length} 堂`);
        break;
      }
      case "fd-type": S.draft.fdType = b.dataset.v; render(); break;
      case "fund-add": {
        const date = document.getElementById("fd_date").value || today(), what = document.getElementById("fd_what").value.trim(), amount = Math.round(Number(document.getElementById("fd_amt").value));
        if(!what){ toast("請填項目"); break; }
        if(!(amount > 0)){ toast("請填金額"); break; }
        const type = S.draft.fdType === "in" ? "in" : "out";
        S.fund.items = [...(S.fund.items || []), { id: "f" + Date.now().toString(36), date, what, amount, type }];
        ["fd_what", "fd_amt"].forEach(k => delete S.draft[k]);
        saveFund(); render(); toast(`記下了：${type === "in" ? "收入" : "支出"} ${what} ${money(amount)}`);
        break;
      }
      case "fund-del": { const it = (S.fund.items || []).find(i => i.id === id); if(!it) break; S.fund.items = S.fund.items.filter(i => i.id !== id); saveFund(); render(); toast(`記下了：刪除 ${it.what}`); break; }
      case "me-cancel": S.meEdit = false; render(); break;
      case "date": {
        const dates = schedule().map(i => i.date);
        const n = +b.dataset.n, i = dates.indexOf(S.date);
        if(i >= 0 && dates[i+n]) S.date = dates[i+n];
        else if(i < 0){ const nb = n > 0 ? dates.find(d => d > S.date) : [...dates].reverse().find(d => d < S.date); S.date = nb || stepWeek(S.date, n); }
        else S.date = stepWeek(S.date, n);
        if(S.date < S.settings.start) S.date = S.settings.start;
        render(); break;
      }
      case "date-next": S.date = nextClassDate(schedule()); render(); break;
      case "paydate": {
        const dates = schedule().map(i => i.date);
        const n = +b.dataset.n, i = dates.indexOf(S.date);
        if(i >= 0 && dates[i+n]) S.date = dates[i+n];
        else if(i < 0){ const nb = n > 0 ? dates.find(d => d > S.date) : [...dates].reverse().find(d => d < S.date); S.date = nb || stepWeek(S.date, n); }
        else S.date = stepWeek(S.date, n);
        if(S.date < S.settings.start) S.date = S.settings.start;
        S.payOpen = S.payConfirm = null; render(); break;
      }
      case "paydate-next": S.date = nextClassDate(schedule()); S.payOpen = S.payConfirm = null; render(); break;
      case "paydate-go": S.date = b.dataset.date; S.payOpen = S.payConfirm = null; render(); window.scrollTo(0,0); break;

      case "att": {
        const date = S.date, s = b.dataset.s;
        const cur = { ...((S.att[date] && S.att[date].records) || {}) };
        if(sheetDay(date) && (s === "leave" || cur[id] === "leave")){ toast("請假以試算表「請假_收費記錄」為準，請到試算表修改"); break; }
        const hadLeave = Object.values(cur).includes("leave");
        if(cur[id] === s) delete cur[id]; else cur[id] = s;
        const hasLeave = Object.values(cur).includes("leave");
        const mode = S.att[date] && S.att[date].mode;
        const doc = { date, records: cur };
        if(hasLeave && mode) doc.mode = mode;
        S.att[date] = doc;
        render();
        write("attendance/"+date, save("attendance", date, cloudDoc(doc)));
        if(hasLeave && !hadLeave) toast(mode === "single" ? "已記請假，其他人照上" : "有人請假，這週先停課（也可以改成其他人照上）");
        else if(!hasLeave && hadLeave) toast("沒人請假了，這週照常上團課");
        break;
      }
      case "mode": {
        const date = S.date, v = b.dataset.v;
        const doc = { date, records: { ...((S.att[date] && S.att[date].records) || {}) }, mode: v };
        S.att[date] = doc; render();
        write("attendance/"+date, save("attendance", date, doc));
        toast(v === "single" ? "其他人照上，費用由沒請假的人平分" : "改回整班停課，這週不收費");
        break;
      }
      case "all-present": {
        const date = S.date;
        const cur = { ...((S.att[date] && S.att[date].records) || {}) };
        active().forEach(m => { if(!cur[m.id]) cur[m.id] = "present"; });
        const doc = { date, records: cur };
        if(S.att[date] && S.att[date].mode && Object.values(cur).includes("leave")) doc.mode = S.att[date].mode;
        S.att[date] = doc; render();
        write("attendance/"+date, save("attendance", date, cloudDoc(doc)));
        toast("全部標好出席了");
        break;
      }

      case "pay-open": S.payOpen = id ? b.dataset.key + "|" + id : null; S.payConfirm = null; delete S.draft.payAmt; delete S.draft.payDate; delete S.draft.payMethod; render(); break;
      case "pay-method": S.draft.payMethod = b.dataset.v; render(); break;
      case "pay-save": {
        const amt = Number(b.dataset.amt) || 0, date = today();
        const key = b.dataset.key;
        const recs = { ...((S.pay[key] && S.pay[key].records) || {}) };
        recs[id] = { amount: amt, date, method: "" };
        const doc = payDoc(key, recs);
        S.pay[key] = doc; S.payOpen = null; render();
        write("payments/"+key, save("payments", key, doc));
        toast(`記下了：${nameOf(id)} ${payLabel(key)}的錢已經${treasurerOf() ? "給" + trName() : "收到"}`);
        break;
      }
      case "pay-confirm": S.payConfirm = id ? b.dataset.key + "|" + id : null; render(); break;

      case "coach-method": S.draft.coachMethod = b.dataset.v; render(); break;
      case "venue-method": S.draft.venueMethod = b.dataset.v; render(); break;
      case "venue-save":
      case "venue-undo": {
        const d = b.dataset.date, key = payKey(d), fl = flowOf(d);
        const doc = { ...(S.pay[key] || {}), date: d, records: (S.pay[key] && S.pay[key].records) || {} };
        if(act === "venue-save") doc.venuePaid = { amount: fl.venue, date: today(), method: S.draft.venueMethod || "LINE Pay" };
        else delete doc.venuePaid;
        S.pay[key] = doc; render();
        write("payments/"+key, save("payments", key, doc));
        toast(act === "venue-save" ? `記下了：${trName()} 已付館方場地費 ${money(fl.venue)}` : "付館方紀錄取消了");
        break;
      }
      case "spaid-save":
      case "spaid-undo": {
        const x = seasonOf(b.dataset.date); if(!x) break;
        const total = liveDates(x).length * S.settings.venueHours * S.settings.venueRate2;
        if(act === "spaid-save") x.paid = { amount: total, date: today(), method: S.draft.venueMethod || "匯款" }; else delete x.paid;
        setSeasons(SEASONS); saveSeasons(); render();
        toast(act === "spaid-save" ? `記下了：${trName()} 已匯「${x.name}」季租 ${money(total)} 給館方` : "季租付款紀錄取消了");
        break;
      }
      case "coach-save":
      case "coach-undo": {
        const d = b.dataset.date, key = payKey(d), fl = flowOf(d);
        const doc = { ...(S.pay[key] || {}), date: d, records: (S.pay[key] && S.pay[key].records) || {} };
        if(act === "coach-save") doc.coachPaid = { amount: fl.coach, date: today(), method: S.draft.coachMethod || "LINE Pay" };
        else delete doc.coachPaid;
        S.pay[key] = doc; render();
        write("payments/"+key, save("payments", key, doc));
        toast(act === "coach-save" ? `記下了：${trName()} 已匯給${S.settings.coachNick || "教練"} ${money(fl.coach)}` : "教練費紀錄取消了");
        break;
      }
      case "pay-del": {
        const key = b.dataset.key;
        const recs = { ...((S.pay[key] && S.pay[key].records) || {}) };
        delete recs[id];
        const doc = payDoc(key, recs);
        S.pay[key] = doc; S.payConfirm = null; render();
        write("payments/"+key, save("payments", key, doc));
        toast(`${nameOf(id)} 改回還沒付`);
        break;
      }
      case "export-csv": exportCsv(); break;
      case "copy-class":
      case "copy-owed":
      case "copy-season":
      case "copy-one": {
        let text;
        const tr = trName(), info = S.settings.payInfo ? `（${S.settings.payInfo}）` : "";
        if(act === "copy-class"){
          const d = b.dataset.date, fl = flowOf(d), ci = fl.ci;
          const rec = payRecs(payKey(d));
          const unpaid = players().filter(m => ci.payers.includes(m.id) && !rec[m.id] && !selfSettled(m, d)).map(m => m.name);
          const leave = leaversOf(d), late = ci.late.map(nameOf), prac = ci.pr.map(nameOf), cf = ci.f;
          text = `🏸【${S.settings.group}】${labelDate(d)} 課費\n` +
            (leave.length || late.length || prac.length ? `${[leave.length ? `${leave.join("、")} 請假` : "", late.length ? `${late.join("、")} 臨時請假` : "", prac.length ? `${prac.join("、")} 只打球` : ""].filter(Boolean).join("，")}，上課 ${ci.n} 位。\n` : `上課 ${ci.n} 位。\n`) +
            `場地 ${cf.two ? 2 : 1} 面 ${money(cf.venue)}，${ci.n + ci.k} 位平分，每人 ${money(ci.pv)}${late.length || prac.length ? "（臨時請假、只打球也要付）" : ""}。\n` +
            (cf.coach ? `教練 ${money(cf.coach)}，上課的 ${ci.n} 位平分，每人 ${money(ci.pc)}。\n👉 上課每人 ${money(ci.pp)}${ci.k ? `，只付場地 ${money(ci.pv)}` : ""}` : `這堂教練請假，只收場地費。\n👉 每人 ${money(ci.pv)}`) +
            (treasurerOf() ? `，轉帳請提前轉給 ${tr}${info}，付現金當天交給 ${tr}。\n` : "。\n") +
            (unpaid.length ? `還沒付的：${unpaid.join("、")}，再麻煩大家囉，謝謝！` : `大家都已付，謝謝大家！`);
        } else if(act === "copy-season"){
          text = seasonReport();
        } else if(act === "copy-one"){
          const m = S.members.find(x => x.id === b.dataset.id); if(!m) break;
          const ds = owedBy(m, schedule()), amts = ds.map(dd => oweAmount(m, dd)), tot = amts.reduce((a, c) => a + c, 0);
          if(!ds.length){ toast(`${m.name} 沒有欠款`); break; }
          text = `${m.name}你好 🏸\n${S.settings.group}${ds.length > 1 ? `這 ${ds.length} 堂` : "這堂"}的課費還沒收到：\n` +
            ds.map((dd, i) => `・${labelDate(dd)}　${money(amts[i])}`).join("\n") + "\n" +
            (ds.length > 1 ? `一共 ${money(tot)}，` : "") + (treasurerOf() ? `方便時再付給${tr}${info}就可以了，` : "") + `謝謝你！`;
        } else {
          const sch = schedule();
          const lines = players().map(m => ({ m, ds: owedBy(m, sch) })).filter(x => x.ds.length)
            .map(x => `・${x.m.name}：${x.ds.map(md).join("、")}，一共 ${money(x.ds.reduce((a, dd) => a + oweAmount(x.m, dd), 0))}`);
          text = `🏸【${S.settings.group}】還沒繳的課費\n${lines.join("\n")}\n` +
            (treasurerOf() ? `請付給 ${tr}${info}，` : "") + `再麻煩大家囉，謝謝！`;
        }
        try { await navigator.clipboard.writeText(text); toast("複製好了，可以貼到 LINE 囉"); }
        catch(_) {
          const box = b.closest(".card") || b.parentElement; const ta = document.createElement("textarea");
          ta.value = text; ta.rows = 5; ta.style.width = "100%"; box.appendChild(ta); ta.select(); toast("請長按選取文字再複製");
        }
        break;
      }

      case "add": {
        const name = document.getElementById("newName").value.trim();
        if(!name){ toast("請先填姓名"); document.getElementById("newName").focus(); break; }
        const data = { name, role: "player",
          phone: "", note: document.getElementById("newNote").value.trim(),
          active: true, createdAt: Date.now() };
        const newId = "m" + Date.now().toString(36);
        S.members = S.members.concat([{ id: newId, ...data }]).sort(byClassThenStroke);
        S.draft.newName = S.draft.newNote = "";
        write("members/"+newId, save("members", newId, data));
        toast(`歡迎 ${name} 加入！`);
        render();
        break;
      }
      case "edit": S.editId = id || null; ["editName","editNote"].forEach(k => delete S.draft[k]); render(); break;
      case "edit-save": {
        const m = S.members.find(x => x.id === id); if(!m) break;
        const name = document.getElementById("editName").value.trim();
        if(!name){ toast("姓名不能空白喔"); break; }
        const data = { name, role: "player", cls: m.cls || "",
          phone: m.phone || "", note: document.getElementById("editNote").value.trim(),
          active: m.active !== false, createdAt: m.createdAt || Date.now() };
        S.members = S.members.map(x => x.id === id ? { id, ...data } : x).sort(byClassThenStroke);
        S.editId = null; render();
        write("members/"+id, save("members", id, data));
        toast("存好了");
        break;
      }
      case "toggle": {
        const m = S.members.find(x => x.id === id); if(!m) break;
        const next = m.active === false;
        const updated = { ...m, active: next }; delete updated.id;
        S.members = S.members.map(x => x.id === id ? { id, ...updated } : x);
        render();
        write("members/"+id, save("members", id, updated));
        toast(next ? `${m.name} 回來上課了，費用已重算` : `${m.name} 先停課，費用已重算`);
        break;
      }
      case "del-ask": S.delConfirm = id || null; render(); break;
      case "del": {
        S.delConfirm = null;
        const nm = nameOf(id);
        S.members = S.members.filter(x => x.id !== id);
        render();
        write("members/"+id, remove("members", id));
        toast(`已刪除 ${nm}`);
        break;
      }
      case "settings-save": {
        const next = { ...S.settings };
        ["group","location","time","start","manager","treasurer","keeper","payInfo","trNick","keeperNick","bookerNick"].forEach(k => { next[k] = document.getElementById("set_"+k).value.trim(); });
        NUMS.forEach(k => { const n = Number(document.getElementById("set_"+k).value); next[k] = n >= 0 ? n : DEF[k]; });
        if(!next.start) next.start = DEF.start;
        delete next.perTerm;
        S.settings = next;
        Object.keys(S.draft).filter(k => k.startsWith("set_")).forEach(k => delete S.draft[k]);
        S.date = null; S.date = null; render();
        write("settings/main", save("settings", "main", next));
        toast("設定存好了，費用已重算");
        break;
      }
    }
  });

  // ---------- data（Google 試算表） ----------
  let pendingWrites = 0;
  const CACHE = "ylCache";
  const hhmm = t => { const x = new Date(t); return `${x.getMonth() + 1}/${x.getDate()} ${pad(x.getHours())}:${pad(x.getMinutes())}`; };
  function applyData(d){
      S.members = Object.keys(d.members || {}).map(id => ({ id, ...d.members[id] })).sort(byClassThenStroke);
      S.rawAtt = d.attendance || {};
      S.pay = d.payments || {};
      const first = !S.loaded.settings;
      const v = (d.settings || {}).main;
      if(v){
        const next = { ...DEF, ...v };
        NUMS.forEach(k => { next[k] = Number(next[k]); if(!(next[k] >= 0)) next[k] = DEF[k]; });
        if(!next.start || next.start < FIRST_DAY) next.start = FIRST_DAY;   // 整個系統從 12/12 開始算
        S.settings = next;
      }
      const sv = (d.settings || {}).seasons;
      setSeasons(sv && Array.isArray(sv.list) ? sv.list : DEF_SEASONS);
      setSpecial((d.settings || {}).special);
      // 刪掉舊版「管理員確認」用的雲端紀錄（管理員登入時自動清掉一次）
      if(S.canWrite && (d.settings || {}).sheetok && !S.oldOkGone){ S.oldOkGone = true; gs("deleteDoc", S.pw, "settings", "sheetok").catch(() => { S.oldOkGone = false; }); }
      const fd = (d.settings || {}).fund;
      S.fund = { items: fd && Array.isArray(fd.items) ? fd.items : [] };
      mergeAtt();
      S.loaded.members = S.loaded.settings = true;
      if(first){ S.date = null; S.date = null; }
  }
  async function load(){
    try {
      const d = await gs("getData");
      if(pendingWrites || staged.size) return; // 還有資料在存或還沒儲存，先不要蓋掉畫面
      applyData(d);
      try { localStorage.setItem(CACHE, JSON.stringify({ t: Date.now(), d })); } catch(_){}
      if(!S.loginOpen) renderAdminBar();   // 名單載入後補上管理員名字
      if(S.offline){ S.offline = false; notice(""); }
      scheduleRender();
    } catch(e){
      S.offline = true;
      if(!S.loaded.members){ S.loaded.members = true; render(); }
      notice(S.cacheAt ? `收訊不好，先顯示 ${hhmm(S.cacheAt)} 存在手機裡的資料；連上網路會自動更新。` : "暫時連不上資料，畫面可能不是最新的，檢查一下網路再重新整理。");
    }
  }
  async function loadSheet(){
    try {
      const r = await fetch(SHEET_CSV + "&t=" + Date.now(), { credentials: "omit", cache: "no-store" });
      const txt = await r.text(), p = parseSheet(txt);
      if(!p) return;
      S.sheet = p; S.sheetAt = Date.now();
      try { localStorage.setItem("ylSheet", txt); } catch(_){}
      document.querySelectorAll(".sync-at").forEach(el => el.textContent = syncAgo());
      if(pendingWrites || staged.size) return;   // 有修改還沒存，等存完重新載入時再合併
      mergeAtt(); scheduleRender();
    } catch(_){}
  }
  try { const p = parseSheet(localStorage.getItem("ylSheet") || ""); if(p) S.sheet = p; } catch(_){}
  try { localStorage.removeItem("ylVenue"); } catch(_){}
  // 先用手機裡上次存的資料把畫面畫出來，不用等網路
  try { const c = JSON.parse(localStorage.getItem(CACHE) || "null"); if(c && c.d){ applyData(c.d); S.cacheAt = c.t; } } catch(_){}
  if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  async function start(){
    S.online = true;
    // 記得這台裝置登入過的管理密碼
    let saved = "", remember = false;
    try { saved = localStorage.getItem("ylAdminPw") || ""; remember = !!saved; if(!saved) saved = sessionStorage.getItem("ylAdminPwS") || ""; } catch(_){}
    if(saved){
      try { if(await gs("checkPassword", saved)){ S.pw = saved; S.canWrite = true; S.remember = remember; } } catch(_){}
    }
    renderAdminBar();
    await Promise.all([load(), loadSheet()]);
    // 每 30 秒自動更新一次，看到別人剛記的資料
    setInterval(() => { if(document.visibilityState === "visible"){ load(); loadSheet(); } }, 30000);
    document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible"){ load(); loadSheet(); } });
  }

  // ---------- 管理員登入 ----------
  const adminBar = document.getElementById("adminBar");
  const IDLE = 2 * 60 * 60 * 1000;   // 沒勾「記住我」時，2 小時沒操作就登出
  let lastAct = Date.now();
  ["click", "keydown", "touchstart"].forEach(ev => addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true }));
  function logout(msg){
    staged.clear(); changes = 0; renderSaveBar();
    S.pw = ""; S.canWrite = false; S.loginOpen = false; S.remember = false;
    try { localStorage.removeItem("ylAdminPw"); sessionStorage.removeItem("ylAdminPwS"); } catch(_){}
    renderAdminBar(); render(); toast(msg);
  }
  const idleCheck = () => { if(S.canWrite && !S.remember && !staged.size && Date.now() - lastAct > IDLE) logout("太久沒操作，已自動登出"); };
  setInterval(idleCheck, 60000);
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") idleCheck(); });
  function renderAdminBar(){
    if(!S.online){ adminBar.hidden = true; return; }
    // 登入表單和管理員模式列都放在頁面最下方（頁尾上面）
    const topWrap = document.getElementById("notice").parentNode, footEl = document.getElementById("foot");
    if(S.canWrite || S.loginOpen){ if(adminBar.previousElementSibling !== footEl.previousElementSibling || adminBar.nextElementSibling !== footEl) footEl.before(adminBar); adminBar.classList.add("wrap", "login-bottom"); }
    else if(adminBar.parentNode !== topWrap){ topWrap.prepend(adminBar); adminBar.classList.remove("wrap", "login-bottom"); }
    adminBar.hidden = false;
    if(S.canWrite){
      adminBar.innerHTML = `<div class="admin on"><span><b>管理員模式</b><small class="muted" style="display:block">${S.remember ? "這支手機會記住登入" : "2 小時沒動作會自動登出"}</small></span><button class="btn small" id="logoutBtn">登出</button></div>`;
    } else if(S.loginOpen){
      adminBar.innerHTML = `<form class="admin" id="loginForm"><label class="field" style="flex:1 1 180px"><span>管理密碼</span><input id="pwInput" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label><button class="btn small" type="button" id="pwShow">顯示</button><button class="btn small primary" type="submit">登入</button><button class="btn small" type="button" id="loginCancel">先不要</button><label class="remember"><input type="checkbox" id="pwRemember">這是我的手機，記住我（沒勾：關網頁或 2 小時沒動就登出）</label><span id="pwHint" class="muted" style="flex-basis:100%" hidden>密碼不對喔。按「顯示」看一下：英數要半形，也注意瀏覽器有沒有自動帶入舊密碼。</span></form>`;
      setTimeout(() => { const el = document.getElementById("pwInput"); if(el) el.focus(); }, 0);
    } else {
      adminBar.hidden = true; adminBar.innerHTML = "";
    }
    const mg = active().find(m => m.id === S.settings.manager), foot = document.getElementById("foot");
    if(foot) foot.innerHTML = S.canWrite || S.loginOpen ? "" : `<span>資料有問題請找${mg ? ` <b>${esc(mg.name.length >= 3 ? mg.name.slice(1) : mg.name)}</b>` : "管理員"}</span><button class="link" id="loginBtn">管理員登入</button>`;
  }
  document.getElementById("foot").addEventListener("click", e => {
    if(e.target.id === "loginBtn"){ S.loginOpen = true; renderAdminBar(); adminBar.scrollIntoView({ block: "center" }); }
  });
  adminBar.addEventListener("click", e => {
    if(e.target.id === "loginBtn"){ S.loginOpen = true; renderAdminBar(); }
    else if(e.target.id === "loginCancel"){ S.loginOpen = false; renderAdminBar(); }
    else if(e.target.id === "pwShow"){
      const el = document.getElementById("pwInput"), show = el.type === "password";
      el.type = show ? "text" : "password"; e.target.textContent = show ? "隱藏" : "顯示"; el.focus();
    }
    else if(e.target.id === "logoutBtn"){
      if(staged.size && !confirm("還有修改沒儲存，登出會放棄這些修改，確定嗎？")) return;
      logout("登出了，現在是查看模式");
    }
  });
  adminBar.addEventListener("submit", async e => {
    e.preventDefault();
    // 中文輸入法常打出全形數字或多一個空白，先轉成半形、去掉前後空白
    const pw = document.getElementById("pwInput").value.normalize("NFKC").trim();
    if(!pw){ toast("請輸入密碼"); return; }
    try {
      if(await gs("checkPassword", pw)){
        S.pw = pw; S.canWrite = true; S.loginOpen = false;
        S.remember = !!(document.getElementById("pwRemember") || {}).checked; lastAct = Date.now();
        try { if(S.remember) localStorage.setItem("ylAdminPw", pw); else { localStorage.removeItem("ylAdminPw"); sessionStorage.setItem("ylAdminPwS", pw); } } catch(_){}
        renderAdminBar(); render(); toast("登入成功，可以開始點名了");
      } else {
        toast("密碼不對，再試一次");
        const h = document.getElementById("pwHint"); if(h) h.hidden = false;
      }
    } catch(err){ toast("連不上資料，請檢查網路後重新整理頁面"); }
  });

  render();
  start();
})();
</script>
</body>
</html>
