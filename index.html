<style>
/* Layout: one-column phone-first app. Court-blue sticky header with four tabs; each tab is a list of member rows with large tap targets. */
:root{
  --bg:#eef3f5;
  --surface:#ffffff;
  --surface-2:#f6f9fa;
  --fg:#11222c;
  --muted:#566874;
  --line:#d5dfe4;
  --court:#0d5870;
  --court-2:#0a4a5f;
  --court-ink:#ffffff;
  --court-soft:rgba(255,255,255,.72);
  --shuttle:#f0b400;
  --accent:#0d6f8c;
  --accent-soft:#dcedf2;
  --ok:#1b7445; --ok-bg:#ddf1e5;
  --warn:#8f5500; --warn-bg:#fcefd3;
  --bad:#ad2a22; --bad-bg:#fae2df;
  --c-coach:#5b45a8; --c-coach-bg:#ebe6f7; --c-venue:#9a5200; --c-venue-bg:#fcebd5;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c161c; --surface:#13222b; --surface-2:#182a34; --fg:#e7f0f3; --muted:#9bb0ba; --line:#28404c;
    --court:#0b3f51; --court-2:#08323f; --court-ink:#f2f8fa; --court-soft:rgba(242,248,250,.7);
    --shuttle:#ffc933; --accent:#5ec3df; --accent-soft:#163947;
    --ok:#6fd49b; --ok-bg:#153626; --warn:#f2bb5c; --warn-bg:#3a2a0d; --bad:#ff8f86; --bad-bg:#3d1714;
    --c-coach:#b8a4f2; --c-coach-bg:#2a2244; --c-venue:#f2bb5c; --c-venue-bg:#3a2a0d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c161c; --surface:#13222b; --surface-2:#182a34; --fg:#e7f0f3; --muted:#9bb0ba; --line:#28404c;
  --court:#0b3f51; --court-2:#08323f; --court-ink:#f2f8fa; --court-soft:rgba(242,248,250,.7);
  --shuttle:#ffc933; --accent:#5ec3df; --accent-soft:#163947;
  --ok:#6fd49b; --ok-bg:#153626; --warn:#f2bb5c; --warn-bg:#3a2a0d; --bad:#ff8f86; --bad-bg:#3d1714;
  --c-coach:#b8a4f2; --c-coach-bg:#2a2244; --c-venue:#f2bb5c; --c-venue-bg:#3a2a0d;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1rem;line-height:1.6;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--court)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--shuttle);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--court);color:var(--court-ink)}
.top .wrap{padding-block:14px 0;display:grid;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;flex:none}
.top .wrap{transition:padding .2s,gap .2s}
.top.shrunk .wrap{padding-top:6px;gap:4px}
.top.shrunk .brand p{display:none}
.top.shrunk .mark{width:28px;height:28px}
.top.shrunk .brand h1{font-size:1.02rem}
.top.shrunk .tabs button{min-height:42px}
.brand h1{margin:0;font-size:1.3rem;font-weight:900;letter-spacing:.02em;line-height:1.2;text-wrap:balance}
.brand p{margin:0;font-size:.88rem;color:var(--court-soft)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{background:none;border:0;border-bottom:4px solid transparent;color:var(--court-soft);padding:10px 4px 9px;font-size:1.02rem;font-weight:700;min-height:48px}
.tabs button[aria-selected="true"]{color:var(--court-ink);border-bottom-color:var(--shuttle)}

main{padding-block:18px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.admin{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;padding:10px 14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:.92rem}
.admin > span{align-self:center}
.admin.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.notice{margin-top:14px;padding:12px 14px;border-radius:var(--radius);background:var(--warn-bg);color:var(--warn);font-weight:500}

.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.5rem;line-height:1;display:grid;place-items:center}
.nav:disabled{opacity:.4;cursor:not-allowed}
.picker{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;height:48px;border-radius:24px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:1.08rem;padding:0 12px}
.picker input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.picker.static{cursor:default}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 6px;min-height:44px}

.banner{padding:12px 14px;border-radius:var(--radius);font-weight:700;display:grid;gap:2px}
.banner small{font-weight:500;font-size:.9rem}
.banner.ok{background:var(--accent-soft);color:var(--accent)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.rules{background:var(--warn-bg);color:var(--fg);border-left:5px solid var(--shuttle);border-radius:var(--radius);padding:12px 14px 12px 16px;display:grid;gap:6px}
.rules b{color:var(--warn);font-size:.95rem;letter-spacing:.04em}
.rules ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.rules li{font-size:.95rem}
.rules strong{font-weight:900}
.rules .rule-list{margin:0;padding-left:1.3em;display:grid;gap:10px}
.rules .rule-list > li::marker{color:var(--warn)}
.rules ol.rule-list ul{margin-top:4px}
.rb .rb-sec{display:grid;gap:6px;padding-top:12px}
.rb .rb-sec + .rb-sec{border-top:1px dashed var(--line);margin-top:4px}
.rb h4{margin:0;font-size:.98rem;display:flex;align-items:center;gap:6px;color:var(--fg)}
.rb ul ul{margin-top:4px;gap:2px}
.rb li b{color:var(--fg);font-size:inherit;letter-spacing:0}
.rb-t{border-collapse:collapse;font-size:.95rem;min-width:200px}
.rb-t th,.rb-t td{padding:5px 14px;border-bottom:1px solid var(--line);text-align:left}
.rb-t th{font-size:.82rem;color:var(--muted);font-weight:700}
.rb-t td:last-child,.rb-t th:last-child{text-align:right;font-weight:800}
.rb .muted{margin:2px 0 0;font-size:.85rem}

.summary{display:flex;flex-wrap:nowrap;gap:6px}
/* 繳費頁：這堂摘要卡 */
.hero{background:linear-gradient(135deg,var(--accent) 0%,#0a4a5f 100%);color:#fff;border-radius:var(--radius);padding:16px 18px;display:grid;gap:10px;box-shadow:0 6px 18px rgba(10,74,95,.18)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:.95rem;opacity:.95}
.hero-chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 10px;font-size:.85rem;white-space:nowrap}
.hero-main{display:flex;align-items:baseline;gap:8px}
.hero-main b{font-size:2.4rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:#ffc933}
.hero-main span{font-weight:700;opacity:.9}
.hero-meta{font-size:.9rem;opacity:.92;line-height:1.5}
.hero-prog{display:grid;gap:5px;font-size:.88rem;font-weight:700}
.hero-bar{height:10px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden}
.hero-bar i{display:block;height:100%;border-radius:999px;background:#ffc933;transition:width .3s}
.hero-note{font-size:.82rem;opacity:.85;border-top:1px dashed rgba(255,255,255,.3);padding-top:8px}
/* 錢怎麼走：流向圖 */
/* 規則收合 */
details.rules > summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.rules > summary::-webkit-details-marker{display:none}
details.rules > summary::after{content:"點開看 ▾";font-size:.8rem;font-weight:700;color:var(--warn)}
details.rules[open] > summary::after{content:"收起 ▴"}
.deadline{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--radius);background:var(--surface);border:1px dashed var(--line);font-size:.92rem}
.deadline b{color:var(--warn)}
.deadline.past b{color:var(--muted)}
/* 統計頁：對帳表 */
.ledger td.ok{color:var(--ok)} .ledger td.bad{color:var(--bad)}
.ledger small{display:block;font-size:.72rem;font-weight:700;color:var(--muted);margin-top:2px;white-space:nowrap}
.ledger td.bad small{color:var(--bad)}
.tablewrap table.ledger{min-width:0;font-size:.95rem}
.tablewrap table.ledger th,.tablewrap table.ledger td{padding:12px 6px;line-height:1.25}
.tablewrap table.ledger th{font-size:.78rem;letter-spacing:0;white-space:nowrap}
.tablewrap table.ledger td:first-child{padding-left:12px}
.tablewrap table.ledger td.num{font-size:.98rem;white-space:nowrap}
.tablewrap table.ledger tbody tr:nth-child(even) td{background:var(--surface-2)}
@media (prefers-reduced-motion: reduce){.hero-bar i{transition:none}}
.stat{flex:1 1 0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center}
.stat b{display:block;font-size:1.15rem;font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{display:block;font-size:.75rem;color:var(--muted);line-height:1.25}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}

.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.actions.stack{flex-direction:column;align-items:flex-end;gap:6px}
.btn{min-height:48px;padding:0 18px;border-radius:24px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:44px;padding:0 16px;font-size:.92rem}
.btn:disabled,.seg button:disabled{opacity:.45;cursor:not-allowed}

.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;padding:12px 14px;flex-wrap:wrap}
.row+.row{border-top:1px solid var(--line)}
.who{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1 1 140px;flex-wrap:wrap}
.who b{font-size:1.12rem;font-weight:700}
.tag{font-size:.75rem;font-weight:700;letter-spacing:.06em;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.tag.role{background:var(--warn-bg);color:var(--warn)}
.steps{margin:0;padding-left:1.4em;display:grid;gap:10px}
.steps li{line-height:1.55}
.steps li::marker{font-weight:900;color:var(--accent)}
.sheet-alert{background:var(--warn-bg);border:1.5px solid var(--warn);border-radius:var(--radius);padding:12px 14px;display:grid;gap:6px;font-size:.92rem;line-height:1.5}
.sheet-alert .sa-h{color:var(--warn);font-size:1rem}
.sheet-alert a.btn{text-decoration:none;display:inline-flex;align-items:center}
.sheet-hint a{color:var(--accent);font-weight:800}
.sz-ed{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;margin-bottom:10px}
.sz-ed-h{display:grid;gap:2px} .sz-ed-h span{font-size:.84rem;color:var(--muted)}
.dchip{min-height:44px;min-width:58px;padding:6px 10px;border-radius:999px;border:2px solid var(--line);background:var(--surface-2);color:var(--muted);font-weight:800;text-decoration:line-through}
.dchip[aria-pressed="true"]{background:var(--c-venue-bg);border-color:var(--c-venue);color:var(--c-venue);text-decoration:none}
.dchip:disabled{opacity:.5}
.calc.fund td small{display:block;font-size:.76rem;color:var(--muted);font-weight:400}
.calc.fund td.ok{color:var(--ok);font-weight:800} .calc.fund td.bad{color:var(--bad);font-weight:800}
.me-att{font-size:.9rem;padding:8px 10px;border-radius:10px;background:var(--accent-soft)}
.me-att b{font-size:1.1rem;color:var(--accent)} .me-att span{color:var(--muted);font-size:.82rem}
.remember{display:flex;align-items:center;gap:8px;flex-basis:100%;font-size:.9rem;min-height:44px}
.remember input{width:22px;height:22px}
.season h2 small{font-size:.8rem;font-weight:700;color:var(--muted);margin-left:8px}
.sz-top{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sz-top>div{background:var(--c-venue-bg);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.sz-top span,.sz-top small{font-size:.8rem;color:var(--muted)}
.sz-top b{font-size:1.3rem;font-weight:900;color:var(--c-venue)}
.sz-bar{display:flex;height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin:12px 0 4px}
.sz-bar i{display:block;height:100%}
.sz-bar .ok,.sz-dot.ok{background:var(--ok)} .sz-bar .bad,.sz-dot.bad{background:var(--bad)} .sz-bar .warn,.sz-dot.warn{background:var(--warn)}
.sz-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:.05em}
.sz-paid{margin-top:10px;padding:8px 12px;border-radius:10px;font-weight:800;font-size:.9rem}
.sz-paid.ok{background:var(--ok-bg);color:var(--ok)} .sz-paid.bad{background:var(--bad-bg);color:var(--bad)}
.sz-calc tr.bad td{color:var(--bad);font-weight:800}
.fc{display:grid;margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem;font-weight:700;color:var(--muted)}
.legend i,.pill[data-cat]::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:.05em;background:var(--cat)}
[data-cat="class"]{--cat:var(--accent)} [data-cat="venue"]{--cat:var(--c-venue)} [data-cat="coach"]{--cat:var(--c-coach)}
.tablewrap th.c-class,.tablewrap th.c-venue,.tablewrap th.c-coach{box-shadow:inset 0 -3px 0 var(--cat)}
.big-money{margin:0;font-size:1.8rem;font-weight:900;color:var(--warn);font-variant-numeric:tabular-nums}
button.pill{border:0;cursor:pointer;font:inherit;font-size:.88rem;font-weight:700;min-height:44px;padding:8px 14px;white-space:normal;text-align:left;line-height:1.3}
.sub{font-size:.88rem;color:var(--muted);flex-basis:100%}

.seg{display:grid;grid-template-columns:repeat(3,minmax(64px,1fr));gap:6px;flex:1 1 240px;max-width:330px}
.seg button{min-height:52px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);font-weight:700;font-size:1.02rem}
.seg button[aria-pressed="true"][data-s="present"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed="true"][data-s="leave"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.seg button[aria-pressed="true"][data-s="absent"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg.two button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
/* 點名：兩人一排 */
.list.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.list.pair .row{flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:space-between;gap:8px;padding:10px;border-top:0;min-width:0}
.list.pair .row:nth-child(n+3){border-top:1px solid var(--line)}
.list.pair .row:nth-child(odd){border-right:1px solid var(--line)}
.list.pair .who{flex:none;gap:4px 6px}
.list.pair .seg{flex:none;max-width:none;grid-template-columns:repeat(var(--n,3),1fr);gap:4px}
.list.pair .seg button{min-height:46px;padding:0;font-size:.92rem}
.list.pair .row.wide{grid-column:1/-1;border-right:0}
/* 統計卡片：出席／請假／缺席小格＋付款狀態 */
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.mini div{background:var(--surface-2);border-radius:8px;text-align:center;padding:5px 0 4px}
.mini b{display:block;font-size:1.15rem;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums}
.mini span{display:block;font-size:.72rem;color:var(--muted)}
.mini .ok{background:var(--ok-bg)} .mini .ok b{color:var(--ok)}
.mini .warn{background:var(--warn-bg)} .mini .warn b{color:var(--warn)}
.mini .bad{background:var(--bad-bg)} .mini .bad b{color:var(--bad)}
.mini .zero b{color:var(--muted);opacity:.55}
.paybar{border-radius:8px;padding:6px 8px;font-size:.88rem;display:grid;gap:6px;text-align:center}
.paybar.ok{background:var(--ok-bg);color:var(--ok)}
.paybar.bad{background:var(--bad-bg);color:var(--bad)}
.paybar .chips{justify-content:center}
.list.pair .actions{gap:8px}
.list.pair .actions.stack{align-items:flex-start}

.me{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:var(--radius);padding:12px 14px;display:grid;gap:10px}
.me-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.me-hi{font-weight:900;font-size:1.05rem}
.me-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.me-cell{border-radius:10px;padding:10px 8px;background:var(--accent-soft);display:grid;gap:2px;text-align:center;align-content:start}
.me-cell span{font-size:.8rem;font-weight:700;color:var(--muted)}
.me-cell b{font-size:1.4rem;font-weight:900;color:var(--accent);line-height:1.25}
.me-cell small{font-size:.76rem;color:var(--muted);line-height:1.4}
.me-cell.ok{background:var(--ok-bg)} .me-cell.ok b{color:var(--ok)}
.me-cell.bad{background:var(--bad-bg)} .me-cell.bad b{color:var(--bad)}
.me-cell.mute{background:var(--surface-2)} .me-cell.mute b{color:var(--fg);font-size:1.05rem}
.me .muted{font-size:.82rem}
.pill{display:inline-block;font-size:.85rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
body{font-variant-numeric:tabular-nums}
.ic{width:1.1em;height:1.1em;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.pill[data-cat]::before{display:none}
.pill.wait{background:var(--surface-2,#eef3f5);color:var(--muted)}
.sp-list{list-style:none;margin:6px 0 10px;padding:0;display:grid;gap:6px}

.next{display:grid;gap:12px;padding:16px;border-radius:var(--radius);background:var(--court-2);color:var(--court-ink);margin-bottom:14px}
.cc-nav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.next .nav{width:44px;height:44px;background:rgba(255,255,255,.14);border:0;color:inherit}
.next .picker{height:auto;min-height:48px;padding:4px 10px;background:rgba(255,255,255,.1);border:0;color:inherit;font-size:1.2rem}
.next .picker>span{display:grid;justify-items:center;line-height:1.25}
.next .picker small{font-size:.75rem;font-weight:700;opacity:.8}
.next.off .nav,.next.off .picker{background:var(--surface);border:1px solid var(--line)}
.att-t td small{display:block}
.att-t td:first-child b{white-space:nowrap}
.att-t th:first-child{width:38%}
.att-t .link{font-size:.8rem;padding:0;min-height:0}
.sz-dates{margin:10px 0 0;font-size:.88rem;color:var(--muted);line-height:1.7}
.next .nx-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.next .nx-h small{opacity:.8;font-size:.85rem}
.next .nx-h b{font-size:1.35rem}
.next .nx-s{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.next .nx-s div{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px;display:grid;gap:2px}
.next .nx-s span{font-size:.8rem;opacity:.85;display:flex;gap:5px;align-items:center}
.next .nx-s b{font-size:1.15rem}
.next .nx-f{font-size:.88rem;opacity:.9;display:flex;gap:6px;align-items:center}
.next.off{background:var(--surface-2,#eef3f5);color:var(--fg)}
.fold{margin:10px 0}
.fold>summary{cursor:pointer;font-weight:800;padding:10px 0;color:var(--muted);list-style:none}
.fold>summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.sync-at{white-space:nowrap}
.payout{padding:14px 16px}
.po-step{display:flex;align-items:center;gap:8px;margin:14px 0 2px;color:var(--muted)}
.po-step b{font-size:.92rem}
.po-no{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--court);color:var(--court-ink);font-size:.8rem;font-weight:800}
.po-note.left{text-align:left;margin:4px 0 0}
.payout h2{margin:0}
.po-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line,#e3e8ee)}
.po-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line,#e3e8ee)}
.po-what{display:flex;flex-direction:column;gap:2px;min-width:0}
.po-what b{font-size:1.02rem}
.po-what small{color:var(--muted,#6b7785);font-size:.85rem}
.po-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--cat)}
.po-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.po-amt{font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.po-right button.pill{min-height:36px;padding:6px 12px;text-align:center}
.po-foot{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;font-weight:700}
.po-foot b{font-size:1.2rem}
.po-note{color:var(--muted,#6b7785);font-size:.85rem;text-align:right}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.form{flex-basis:100%;display:grid;gap:12px;padding:14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field span{font-size:.85rem;font-weight:700;color:var(--muted)}
.field input,.field select{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:12px}
h2{margin:0;font-size:1.1rem;font-weight:900;text-wrap:balance}
h3{margin:4px 0 0;font-size:.95rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
h4{margin:0;font-size:.95rem;font-weight:800}
.rules summary b,.rules > b{font-size:1.05rem;letter-spacing:.02em}
.fold>summary{font-size:.95rem;letter-spacing:.04em}
.roster{display:grid;gap:12px}
.roster p{margin:4px 0 0;line-height:1.7}
.foot{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px 32px;color:var(--muted);font-size:.88rem}
.foot .link{font-size:.88rem}
.login-bottom{margin-top:8px;margin-bottom:32px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dates{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.date{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2);display:grid;gap:4px;justify-items:start}
.date b{font-size:1.02rem;font-variant-numeric:tabular-nums}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:var(--radius);padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:1.1rem;margin-bottom:4px}
.muted{color:var(--muted);font-size:.9rem;margin:0}
.notes{margin:0;padding-left:1.2em;color:var(--muted);font-size:.92rem;display:grid;gap:4px}
.notes strong{color:var(--fg)}

.calc{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.calc td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:baseline}
.calc td:nth-child(2){color:var(--muted);font-size:.9rem}
.calc td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.calc small{display:block;font-size:.75rem;font-weight:700;color:var(--muted);margin-top:2px}
.calc tr.total td{font-weight:900;font-size:1.08rem;color:var(--fg)}
.calc tr.big td{font-size:1.25rem;color:var(--accent);border-bottom:0}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.tablewrap table{border-collapse:collapse;width:100%;min-width:520px;font-variant-numeric:tabular-nums}
.tablewrap th,.tablewrap td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.tablewrap th{font-size:.82rem;color:var(--muted);font-weight:700;letter-spacing:.04em;background:var(--surface-2)}
.tablewrap tr:last-child td{border-bottom:0}
.tablewrap td.num{text-align:center;font-weight:700;font-size:1.05rem}
.tablewrap th.num{text-align:center}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center;z-index:20}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--warn-bg);color:var(--warn);border-top:2px solid var(--warn);font-weight:700;box-shadow:0 -4px 14px rgba(0,0,0,.12)}
.savebar[hidden]{display:none}
.savebar span{flex:1 1 auto;min-width:0}
body.has-save{padding-bottom:84px}
body.has-save #toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
</style>
</head>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="19" fill="var(--court-2)"/>
        <path d="M12 9 L20 24 L28 9 Z" fill="var(--court-ink)" opacity=".9"/>
        <path d="M16 9 L20 24 M24 9 L20 24" stroke="var(--court-2)" stroke-width="1.2"/>
        <circle cx="20" cy="28" r="5" fill="var(--shuttle)"/>
      </svg>
      <div>
        <h1 id="groupName">老楊輪羽班</h1>
        <p id="groupSub">輪椅羽球點名簿</p>
      </div>

    <nav class="tabs" role="tablist" aria-label="功能">
      <button role="tab" data-tab="checkin" aria-selected="true">點名</button>
      <button role="tab" data-tab="pay" aria-selected="false">繳費</button>
      <button role="tab" data-tab="stats" aria-selected="false">統計</button>
      <button role="tab" data-tab="members" aria-selected="false">隊友</button>
    </nav>
  </div>
</header>
<div class="wrap"><div id="adminBar" hidden></div><div id="notice" class="notice" hidden></div></div>
<main id="app" class="wrap">
  <div class="empty"><b>名單載入中…</b>馬上好～</div>
</main>
<footer class="wrap foot" id="foot"></footer>
<div id="saveBar" class="savebar" role="region" aria-label="儲存修改" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const CLASSES = ["WH1","WH2","SL3","SL4","SU5","SH6","未分級"];
  const METHODS = ["現金","LINE Pay"];
  const ST = {present:"出席", leave:"請假", absent:"缺席"};
  const DEF = { group:"老楊輪羽班", location:"", time:"每週六 14:00–17:00", start:"2026-12-12",
    coachHours:2, coachRate:1000, venueHours:3, venueRate:300, venueRate2:500, bigMin:6,
    venuePayer:"", treasurer:"m04", payInfo:"", manager:"m01", trNick:"吉哥", vpNick:"芳玉", bookerNick:"芳玉", coachNick:"楊教練" };   // 誰先付場地費、誰負責收錢、收款方式說明、誰負責維護管理
  const NUMS = ["coachHours","coachRate","venueHours","venueRate","venueRate2","bigMin"];
  // 季租 2 面場地：從 SEASON_FROM 起不論人數都是 2 面；季內沒列到的週六不上課
  let SEASON_FROM = "2027-01-02";
  const DEF_SEASONS = [
    { name:"2027 年 1～3 月", from:"2027-01-01", to:"2027-03-31", dates:["2027-01-02","2027-01-09","2027-01-16","2027-01-30","2027-02-13","2027-02-20","2027-02-27","2027-03-06","2027-03-13","2027-03-20","2027-03-27"] },
  ];
  let SEASONS = [];
  function setSeasons(list){
    SEASONS = (list || []).filter(x => x && x.from && x.to).map(x => ({ name: String(x.name || ""), from: x.from, to: x.to, dates: [...new Set(x.dates || [])].sort(), ...(x.paid ? { paid: x.paid } : {}) })).sort((a, b) => a.from < b.from ? -1 : 1);
    SEASON_FROM = SEASONS.flatMap(x => x.dates).sort()[0] || "9999-12-31";
  }
  setSeasons(DEF_SEASONS);
  const liveDates = x => x.dates.filter(d => !offReason(d));
  const seasonOf = d => SEASONS.find(x => d >= x.from && d <= x.to) || null;
  // 季內、但沒租到場地的週六（開季租之前的日期不算）
  // 往前／往後跳一週，遇到季內沒租場地的週六再多跳一週
  const stepWeek = (d, n) => { let x = shiftDate(d, 7 * n); for(let g = 0; seasonOff(x) && g < 20; g++) x = shiftDate(x, 7 * n); return x; };
  // 季租以外、個別指定的日期：取消的週六（含原因），和固定開幾面場地的週六
  const FIRST_DAY = "2026-12-12";   // 團課第一堂，之前的日期都不算
  // 停課日、指定開幾面、場地費預付到哪天：管理員在「隊友」頁的「特別日期」改，存在 settings/special
  const DEF_SPECIAL = { off: { "2026-12-05": "沒借到場地" }, courts: { "2026-12-12": 1, "2026-12-19": 1, "2026-12-26": 2 }, prepaidTo: "2027-03-31" };
  let OFF_DATES = {}, COURT_FIX = {}, VENUE_PREPAID_TO = "";
  function setSpecial(x){ x = x || DEF_SPECIAL; OFF_DATES = { ...(x.off || {}) }; COURT_FIX = { ...(x.courts || {}) }; VENUE_PREPAID_TO = x.prepaidTo || ""; }
  setSpecial(DEF_SPECIAL);
  // ---------- 請假紀錄試算表：請假、停課、教練請假都以試算表為準 ----------
  const SHEET_ID = "1o25HNU0IXbPkbgb9Zk37M_DjVjSo9zOCqqp34Ke1U_Y", SHEET_GID = "361843830";
  const SHEET_CSV = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}`;
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?gid=${SHEET_GID}`;
  const NAME_ALIAS = { "簡建民": "簡健民", "簡健民": "簡建民" };   // 改名前後都對得上
  function parseCsv(t){
    const rows = []; let row = [], v = "", q = false;
    for(let i = 0; i < t.length; i++){
      const c = t[i];
      if(q){ if(c === '"'){ if(t[i + 1] === '"'){ v += '"'; i++; } else q = false; } else v += c; }
      else if(c === '"') q = true;
      else if(c === ","){ row.push(v); v = ""; }
      else if(c === "\n"){ row.push(v); rows.push(row); row = []; v = ""; }
      else if(c !== "\r") v += c;
    }
    if(v || row.length){ row.push(v); rows.push(row); }
    return rows;
  }
  function parseSheet(text){
    const rows = parseCsv(text || ""), hi = rows.findIndex(r => r.some(x => x.trim() === "日期"));
    if(hi < 0) return null;
    const h = rows[hi].map(x => x.trim()), di = h.indexOf("日期"), col = k => h.indexOf(k);
    const names = []; for(let c = di + 1; c < h.length && h[c]; c++) names.push([c, h[c]]);
    const ci = col("教練請假"), si = col("停課"), ni = col("備註"), yes = x => /是|停|請假|v|✓|ˇ/i.test(x || "");
    const dates = {};
    rows.slice(hi + 1).forEach(r => {
      const m = (r[di] || "").trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/); if(!m) return;
      dates[`${m[1]}-${pad(m[2])}-${pad(m[3])}`] = {
        leave: names.filter(([c]) => (r[c] || "").includes("請假")).map(([, n]) => n),
        paid: names.filter(([c]) => /已付|已繳|付清/.test(r[c] || "")).map(([, n]) => n),
        stop: si >= 0 && yes(r[si]), coachOff: ci >= 0 && yes(r[ci]), note: ni >= 0 ? (r[ni] || "").trim() : "" };
    });
    return { dates, names: names.map(x => x[1]) };
  }
  const syncAgo = () => { if(!S.sheetAt) return ""; const m = Math.floor((Date.now() - S.sheetAt) / 60000); return m < 1 ? "・剛剛更新" : `・${m} 分鐘前更新`; };
  const sheetDay = d => (S.sheet && S.sheet.dates[d]) || null;
  const memberByName = n => players().find(m => m.name === n) || players().find(m => NAME_ALIAS[n] && m.name === NAME_ALIAS[n]) || null;
  const sheetUnknown = () => S.sheet ? S.sheet.names.filter(n => !memberByName(n)) : [];
  const offReason = d => OFF_DATES[d] || (sheetDay(d) && sheetDay(d).stop ? (sheetDay(d).note || "停課") : "");
  const coachOff = d => !!(sheetDay(d) && sheetDay(d).coachOff);
  // 雲端點名紀錄＋試算表：試算表上有的日期，請假只看試算表；出席、缺席還是看網頁
  function mergeAtt(){
    const out = { ...(S.rawAtt || {}) };
    if(S.sheet) Object.entries(S.sheet.dates).forEach(([d, x]) => {
      const rec = {};
      Object.entries((out[d] && out[d].records) || {}).forEach(([id, v]) => { if(v !== "leave") rec[id] = v; });
      x.leave.forEach(n => { const m = memberByName(n); if(m) rec[m.id] = "leave"; });
      if(!out[d] && !Object.keys(rec).length) return;   // 沒有紀錄的日期不用建
      const doc = { date: d, records: rec };
      if(Object.values(rec).includes("leave")) doc.mode = "single";
      out[d] = doc;
    });
    S.att = out;
  }
  // 請假表有新增／取消請假時，提醒管理員確認（記在這支手機）
  const SEEN_KEY = "ylSheetSeen";
  const leaveKeys = () => { const out = []; if(S.sheet) Object.entries(S.sheet.dates).forEach(([d, x]) => { if(d >= S.settings.start) x.leave.forEach(n => out.push(d + "|" + n)); }); return out.sort(); };
  const getSeen = () => { try { const v = localStorage.getItem(SEEN_KEY); return v == null ? null : JSON.parse(v); } catch(_){ return []; } };
  const setSeen = a => { try { localStorage.setItem(SEEN_KEY, JSON.stringify(a)); } catch(_){} };
  function sheetAlert(){
    if(!S.canWrite || !S.sheet) return "";
    const cur = leaveKeys(), seen = getSeen();
    if(seen === null){ setSeen(cur); return ""; }   // 第一次打開：先記下目前的請假，不跳提醒
    const add = cur.filter(k => !seen.includes(k)), del = seen.filter(k => !cur.includes(k) && k >= S.settings.start);
    if(!add.length && !del.length) return "";
    const fmt = k => { const [d, n] = k.split("|"); return `<b>${md(d)}</b> ${esc(n)}`; };
    const dates = [...new Set([...add, ...del].map(k => k.split("|")[0]))].sort();
    return `<div class="sheet-alert" role="status">
      <b class="sa-h">${ic("sheet")} 請假紀錄表有更新，已同步到網頁</b>
      ${add.length ? `<div>新增請假：${add.map(fmt).join("、")}</div>` : ""}
      ${del.length ? `<div>取消請假：${del.map(fmt).join("、")}</div>` : ""}
      <div class="muted">重新計算：${dates.map(d => { const ci = classInfo(d); return offReason(d) ? `${md(d)} 停課` : `${md(d)} 出席 ${ci.n} 人、每人 ${money(ci.pp)}`; }).join("；")}</div>
      <div class="actions"><button class="btn small primary" data-act="sheet-ok">確認，知道了</button><a class="btn small" href="${SHEET_URL}" target="_blank" rel="noopener">打開請假表</a></div>
    </div>`;
  }
  // 寫回雲端時，試算表管的日期不存請假（以試算表為準）
  const cloudDoc = doc => !sheetDay(doc.date) ? doc : { date: doc.date, records: Object.fromEntries(Object.entries(doc.records || {}).filter(([, v]) => v !== "leave")) };
  const seasonOff = d => { if(offReason(d)) return true; const x = seasonOf(d); return !!x && d >= SEASON_FROM && !x.dates.includes(d); };

  const pad = n => String(n).padStart(2,"0");
  // 線條圖示（跟著文字顏色）
  const ICONS = {
    sheet: '<path d="M8 3h8l4 4v14H4V3h4z"/><path d="M8 11h8M8 15h8M8 7h4"/>',
    cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    people: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.6c2 .7 3.2 2.5 3.5 5.4"/>',
    coin: '<circle cx="12" cy="12" r="9"/><path d="M14.8 9.2c-.5-1-1.6-1.6-2.8-1.6-1.6 0-2.8.9-2.8 2.2 0 3 5.8 1.6 5.8 4.4 0 1.3-1.3 2.2-3 2.2-1.3 0-2.5-.6-3-1.7M12 6v1.6M12 16.4V18"/>',
    court: '<rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M12 5v14M3 12h18"/>',
    sync: '<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/>',
  };
  const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ""}</svg>`;
  const weekday = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d).getDay(); };
  const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const today = () => fmtDate(new Date());
  const shiftDate = (s,n) => { const [y,m,d] = s.split("-").map(Number); return fmtDate(new Date(y,m-1,d+n)); };
  const WD = "日一二三四五六";

  // 資料存在 Google 試算表，透過 Apps Script 的資料接口（Api.gs）讀寫

  // 管理員：季租快到期時提醒續約

  // ---------- 課表與費用 ----------
  function statusOf(d){
    const doc = S.att[d] || {};

  }
  function leaversOf(d){

  }
  // 從開課日起每週一次，排到今天之後 8 週；點名過的非固定日期（補課）也算一堂
  function schedule(){
    const start = S.settings.start || today();
    const until = shiftDate(today() > start ? today() : start, 56);
    const extra = Object.keys(S.att).filter(d => d >= start && !offReason(d) && Object.keys(S.att[d].records || {}).length);
    const set = new Set(extra);
    for(let w = start, g = 0; w <= until && g < 600; w = shiftDate(w, 7), g++) if(!seasonOff(w)) set.add(w);
    return [...set].sort().map(d => ({ date: d, status: statusOf(d) }));
  }
  const billable = st => st !== "paused";
  // 這堂要分攤的人：沒請假的學員（整班暫停就沒有人要付）
  function classInfo(d){
    const st = statusOf(d);
    const r = (S.att[d] && S.att[d].records) || {};
    const ids = billable(st) ? players().filter(m => r[m.id] !== "leave").map(m => m.id) : [];
    const n = ids.length;

  }

  function payRecs(key){

  }

  // 這堂的錢怎麼走：訂場地的人先付場地費，他的課費從裡面扣，差額由財務匯還（或由他補給財務）
  function flowOf(d){

    return { ci, tr, venue: f.venue, coach: f.coach, coachPaid, venuePaid, venueDone, season: inSeason, sz, pre };

  // 已經上過、還沒繳的課
  function owedBy(m, sch){
    return pastClasses(sch)
      .filter(i => classInfo(i.date).ids.includes(m.id) && !paidRec(i.date, m.id) && !selfSettled(m, i.date))

  // 財務還沒付給教練的課
  const coachOwed = sch => pastClasses(sch).map(i => ({ d: i.date, fl: flowOf(i.date) })).filter(x => x.fl.ci.n && x.fl.coach > 0 && !x.fl.coachPaid);
  // 「記下已付款」的小按鈕組：選付款方式＋記下；已付就顯示紀錄和取消

  const save = (c, id, data) => () => gs("saveDoc", S.pw, c, id, data);

  // ---------- render ----------

  }

  function noMembers(){
    return `<div class="empty"><b>還沒有隊友喔</b>先到「隊友」加人，就能點名、記帳。<div style="margin-top:14px"><button class="btn primary" data-act="goto" data-tab="members">去加隊友</button></div></div>`;
  }

  // 我的帳單：隊友選一次自己的名字（記在這支手機），打開就看到自己要付多少（只能看）
  const ME_KEY = "ylMe";
  const getMe = () => { try { return localStorage.getItem(ME_KEY) || ""; } catch(_){ return ""; } };
  const setMe = v => { try { v ? localStorage.setItem(ME_KEY, v) : localStorage.removeItem(ME_KEY); } catch(_){} };
  function meCard(sch){
    const ps = players(); if(!ps.length) return "";
    const id = getMe(), m = ps.find(x => x.id === id);
    if(!m || S.meEdit) return `<div class="me"><label class="field"><span>你是哪位？選一次就記住，之後打開直接看自己的帳單</span><select id="mePick"><option value="">－ 選自己的名字 －</option>${ps.slice().sort(byClassThenStroke).map(x => `<option value="${x.id}"${x.id === id ? " selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>${m ? `<div><button class="link" data-act="me-cancel">取消</button></div>` : ""}</div>`;
    const nd = S.date || nextClassDate(sch), ci = classInfo(nd), rec = ((S.att[nd] || {}).records || {})[m.id], how = `轉給${esc(trName())}，LINE Pay 或現金${S.settings.payInfo ? "・" + esc(S.settings.payInfo) : ""}`;
    let next;
    if(nd < S.settings.start) next = { cls: "mute", big: "還沒開課", note: `第一堂 ${md(S.settings.start)}` };
    else if(offReason(nd) || seasonOff(nd) || ci.st === "paused") next = { cls: "mute", big: "停課", note: "這週不用付" };
    else if(rec === "leave") next = { cls: "mute", big: "已請假", note: "這堂不用付" };
    else if(isTreasurer(m)) next = { cls: "mute", big: "不用轉", note: "你負責收錢，自己那份不用轉" };
    else if(paidRec(nd, m.id)) next = { cls: "ok", big: "✓ 已付", note: money(oweAmount(m, nd)) };
    else next = { cls: "", big: money(oweAmount(m, nd)), note: how };
    const owed = owedBy(m, sch).filter(d => d !== nd), total = owed.reduce((a, d) => a + oweAmount(m, d), 0);
    const pay = owed.length || next.cls === "";
    return `<div class="me">
      <div class="me-top"><span class="me-hi">${esc(m.name)} 的帳單</span><button class="link" data-act="me-change">不是我</button></div>
      <div class="me-grid">
        <div class="me-cell ${next.cls}"><span>${md(nd)} 這堂</span><b>${next.big}</b><small>${next.note}</small></div>
        <div class="me-cell ${owed.length ? "bad" : "ok"}"><span>之前的課</span><b>${owed.length ? money(total) : "✓ 沒有欠款"}</b>${owed.length ? `<small>還沒付 ${owed.length} 堂：${owed.map(md).join("、")}</small>` : ""}</div>
      </div>
      ${(() => { const t = today(), x = SEASONS.find(z => z.dates.length && z.dates[0] <= t && z.to >= t);
        const ds = x ? heldDates(liveDates(x)) : pastClasses(sch).map(i => i.date).filter(d => statusOf(d) !== "paused");
        if(!ds.length) return "";
        const a = ds.filter(d => attended(m, d)).length;
        return `<div class="me-att">🏸 ${x ? "本季" : "開課以來"}出席 <b>${a}</b>／${ds.length} 堂${x ? `<span>（本季共 ${liveDates(x).length} 堂）</span>` : ""}${a === ds.length && a >= 2 ? "　全勤，太棒了！" : ""}</div>`; })()}
      ${owed.length && next.cls !== "" ? `<p class="muted">${how}</p>` : ""}
    </div>`;
  }

  // 有人請假時：整班暫停，或其他人照上
  const modeSwitch = cur => !S.canWrite || sheetDay(S.date) ? "" : `<div class="field"><span>有人請假，這週要怎麼辦？</span>
    <div class="seg two" role="group" aria-label="有人請假時這週怎麼辦">
      <button data-act="mode" data-v="paused" aria-pressed="${cur==="paused"}"${dis()}>整班停課</button>
      <button data-act="mode" data-v="single" aria-pressed="${cur==="single"}"${dis()}>其他人照上</button>
    </div></div>`;

  // 操作說明只給管理員看，一般人只看資訊
  const adminHint = text => S.canWrite ? text : "";
  const adminHintP = text => S.canWrite ? `<p class="muted">${text}</p>` : "";

  // 這堂：日期切換＋人數、每人、場地＋請假名單、截止日（點名、繳費共用一張）
  function classCard(sch, where){
    const d = S.date, nd = nextClassDate(sch), isNext = d === nd, t = today();
    const nav = `<div class="cc-nav">
        <button class="nav" data-act="date" data-n="-1" aria-label="上一堂"${d <= S.settings.start ? " disabled" : ""}>‹</button>
        <label class="picker"><span><small>${isNext ? "下一堂" : d < t ? "上過的課" : "之後的課"}</small>${labelDate(d)}</span><input type="date" id="datePick" value="${d}" min="${S.settings.start}" aria-label="選擇哪一堂"></label>
        <button class="nav" data-act="date" data-n="1" aria-label="下一堂">›</button>
      </div>`;
    const back = isNext ? "" : `<div><button class="link" data-act="date-next">回到下一堂（${md(nd)}）</button></div>`;
    const box = (cls, body, after = "") => `<div class="next ${cls}">${nav}${body}</div>${back}${where === "checkin" ? after : ""}`;
    const msg = x => `<div class="nx-f">${x}</div>`;
    if(offReason(d)) return box("off", msg(`停課：${esc(offReason(d))}，不上課、不收費`));
    if(seasonOff(d) && statusOf(d) === "planned") return box("off", msg("停課：這天沒租場地，不上課、不收費"),
      S.canWrite && d >= t ? `<div class="actions"><button class="btn small" data-act="sz-cancel" data-date="${d}">恢復這堂（有租場地）</button></div>` : "");
    if(d < S.settings.start) return box("off", msg(`還沒開課，第一堂是 ${md(S.settings.start)}`));
    const ci = classInfo(d), f = fees(ci.n, d), lv = leaversOf(d);
    if(ci.st === "paused") return box("off", msg(`停課：${esc(lv.join("、"))} 請假，這週不上課、不收費`), modeSwitch("paused"));
    const dl = shiftDate(d, -7);
    const foot = [lv.length ? `${esc(lv.join("、"))} 請假` : "沒有人請假",
      d >= t ? `請假截止 ${labelDate(dl)}${t > dl ? "（已過，請假也要分攤）" : ""}` : "",
      f.coachOff ? "教練請假，只收場地費" : ""].filter(Boolean).join("・");
    const szCancel = S.canWrite && d >= t && statusOf(d) === "planned" && seasonOf(d) && seasonOf(d).dates.includes(d)
      ? `<div class="actions"><button class="btn small" data-act="sz-cancel" data-date="${d}">這堂停課（場地也退）</button></div>` : "";
    return box("", `<div class="nx-s">
        <div><span>${ic("people")}上課</span><b>${ci.n} 人</b></div>
        <div><span>${ic("coin")}每人</span><b>${money(ci.pp)}</b></div>
        <div><span>${ic("court")}場地</span><b>${f.two ? 2 : 1} 面</b></div>
      </div>
      <div class="nx-f">${ic("clock")}<span>${foot}</span></div>`, (ci.st === "single" ? modeSwitch("single") : "") + szCancel);
  }

  // 點名
  function viewCheckin(sch){
    const list = active();
    const rec = (S.att[S.date] && S.att[S.date].records) || {};
    const st = statusOf(S.date);
    const c = {present:0, leave:0, absent:0};
    list.forEach(m => { if(c[rec[m.id]] !== undefined) c[rec[m.id]]++; });
    const unmarked = list.length - c.present - c.leave - c.absent;
    const past = S.date <= today();
    const ci0 = classInfo(S.date), on = active().filter(m => ci0.ids.includes(m.id));
    const absentL = on.filter(m => rec[m.id] === "absent"), goL = on.filter(m => rec[m.id] !== "absent"), leaveL = active().filter(m => rec[m.id] === "leave");
    let h = `
      ${classCard(sch, "checkin")}
      ${S.sheet ? `<p class="muted sheet-hint">${ic("sheet")} 請假、停課以「<a href="${SHEET_URL}" target="_blank" rel="noopener">請假紀錄試算表</a>」為準，會自動同步<span class="sync-at">${syncAgo()}</span>${S.canWrite ? `<br><small>想記已繳，也可以在試算表名字格填「已付」。</small>` : ""}${S.canWrite && sheetUnknown().length ? `<br><b class="bad">試算表有對不到的名字：${esc(sheetUnknown().join("、"))}</b>（名字要和隊友名單一樣）` : ""}</p>` : ""}
`;
    if(!list.length) return h + noMembers();
    h += `
      ${!S.canWrite ? (ci0.n && !offReason(S.date) && !seasonOff(S.date) ? `<div class="card roster">
        <div><h4>${past ? "出席" : "上課"} ${goL.length} 人</h4><p>${goL.map(m => esc(m.name)).join("、") || "－"}</p></div>
        ${leaveL.length ? `<div><h4>請假 ${leaveL.length} 人</h4><p>${leaveL.map(m => esc(m.name)).join("、")}</p></div>` : ""}
        ${absentL.length ? `<div><h4>缺席 ${absentL.length} 人</h4><p>${absentL.map(m => esc(m.name)).join("、")}</p></div>` : ""}
      </div>` : "") + leaveBox() : `<ul class="list pair">` +
      list.map(m => {
        const s = rec[m.id];
        return `<li class="row">
          <div class="who"><b>${esc(m.name)}</b>${tagHtml(m)}</div>
          <div class="seg" style="--n:${st === "single" ? 2 : 3}" role="group" aria-label="${esc(m.name)} 的出席狀態">
            ${(st === "single" ? ["present","leave"] : ["present","leave","absent"]).map(k => `<button data-act="att" data-id="${m.id}" data-s="${k}" aria-pressed="${s===k}"${sheetDay(S.date) && (k === "leave" || s === "leave") ? " disabled" : dis()}>${ST[k]}</button>`).join("")}
          </div></li>`;
      }).join("") + `</ul>
      <p class="muted">沒請假就算出席，只要標「缺席」的人。點完記得按下方「確認儲存」；點錯再點一次就取消。</p>
      ${leaveBox()}`}`;
    return h;
  }

  // 繳費（每堂）
  function viewPay(sch){
    const d = S.date, ci = classInfo(d);
    const key = payKey(d);
    const rec = payRecs(key);
    let h = `
      ${classCard(sch, "pay")}
      ${meCard(sch)}`;
    if(!players().length) return h + noMembers();
    const offWhy = offReason(d) || (seasonOff(d) ? "這天沒租場地" : "");
    if(!offWhy && ci.n && d >= S.settings.start){
      const fl = flowOf(d);
      const who = players().filter(m => ci.ids.includes(m.id));
      const mustPay = who.filter(m => !selfSettled(m, d));
      const paid = mustPay.filter(m => rec[m.id]);
      const unpaid = mustPay.filter(m => !rec[m.id]);
      // 財務、場地負責人不用轉課費，另外列在下面（財務在前）
      const special = who.filter(m => !mustPay.includes(m) && !rec[m.id]).sort((a, b) => isTreasurer(a) - isTreasurer(b));
      const listed = [...unpaid, ...paid, ...who.filter(m => !mustPay.includes(m) && rec[m.id])];
      const total = Object.values(rec).reduce((a,r) => a + Number(r.amount||0), 0);
      h += `
        ${unpaid.length ? (S.canWrite ? `<div class="actions"><button class="btn small" data-act="copy-class" data-date="${d}">複製收費訊息，貼到 LINE</button></div>` : "") : `<div class="banner ok">✓ 大家都已付，辛苦了！</div>`}
        ${fl.tr ? moneyCard(d, fl, paid.length, mustPay.length) : ""}
        ${S.canWrite ? `<h3>隊友課費・已付 ${paid.length}／${mustPay.length} 人</h3>${payList(key, listed, ci.pp, d, "pair")}`
          : `<details class="fold"><summary>大家繳費狀況（已付 ${paid.length}／${mustPay.length} 人）</summary>${payList(key, listed, ci.pp, d, "pair")}</details>`}
        `;
    }
    h += rulesBox();
    return h;
  }


  // 某人這堂要繳多少（訂場地的人如果課費比場地費多，只要補差額）
  function oweAmount(m, d){
    const fl = flowOf(d);
    return fl.ci.pp;
  }

  // 這堂的錢怎麼走
  // 這堂錢怎麼走：① 隊友轉給吉哥 ② 吉哥付教練、館方（一張卡看完）
  function moneyCard(d, fl, paidN, mustN){
    if(!fl.tr) return "";
    const tr = esc(trName()), cn = esc(S.settings.coachNick || "教練"), s = S.settings;
    const num = x => Number(x).toLocaleString("en-US"), cf = fees(fl.ci.n, d), pp = fl.ci.pp, n = fl.ci.n, lv = leaveCount(d);
    const trIn = fl.ci.ids.includes(fl.tr.id);
    const got = n * pp, out = fl.coach + fl.venue, left = got - out, due = (fl.coachPaid ? 0 : fl.coach) + (fl.venueDone ? 0 : fl.venue);
    const early = d > today();
    const st = (ok, kind, rec) => { const sea = kind === "spaid", yes = (sea ? "✓ 已匯款" : "✓ 已付") + (rec && rec.date ? " " + md(rec.date) : ""), no = sea ? "還沒匯款" : early ? "待付" : "還沒付", cls = ok ? "ok" : early && !sea ? "wait" : "bad"; return S.canWrite
      ? `<button class="pill tap ${cls}" data-act="${kind}-${ok ? "undo" : "save"}" data-date="${d}"${dis()}>${ok ? yes : no + "・點我記下"}</button>`
      : `<span class="pill ${cls}">${ok ? yes : no}</span>`; };
    const row = (cat, name, note, amt, status) => `<div class="po-row" data-cat="${cat}">
        <div class="po-what"><b><i class="po-dot"></i>${name}</b><small>${note}</small></div>
        <div class="po-right"><span class="po-amt">${amt}</span>${status}</div></div>`;
    const step = (k, t, right = "") => `<div class="po-step"><span class="po-no">${k}</span><b>${t}</b>${right}</div>`;
    const courts = `${cf.two ? 2 : 1} 面 × ${s.venueHours} 小時 × ${num(cf.two ? s.venueRate2 : s.venueRate)}`;

    // ① 隊友轉帳
    const share = row("class", "每人課費", `${n} 人上課${lv ? `、${lv} 人請假` : ""}，${num(cf.session)} 平分${trIn ? `・${tr}自己那份不用轉` : ""}`, money(pp),
      `<span class="pill ${paidN >= mustN ? "ok" : early ? "wait" : "bad"}">已轉 ${paidN}／${mustN} 人</span>`);
    // ② 吉哥付出去
    const coach = fl.coach > 0
      ? row("coach", "教練費", `${s.coachHours} 小時 × ${num(s.coachRate)}`, money(fl.coach), st(!!fl.coachPaid, "coach", fl.coachPaid))
      : row("coach", "教練費", "教練請假，這堂不用付", "—", `<span class="pill">免付</span>`);
    let venue;
    if(fl.pre) venue = row("venue", "場地費", `${bkName() ? `${bkName()}租借・` : ""}${tr}已匯款・${fl.season ? "季租 2 面" : courts}`, money(fl.venue), `<span class="pill ok">✓ 已匯款</span>`);
    else if(fl.season){ const c = seasonCalc(fl.sz); venue = row("venue", "場地費", `${bkName() ? `${bkName()}租借・` : ""}${tr}整季 ${c.N} 堂一次匯 ${num(c.total)}`, money(fl.venue), st(fl.venueDone, "spaid", seasonPaid(fl.sz))); }
    else venue = row("venue", "場地費", `${bkName() ? `${bkName()}租借・${tr}匯款・` : ""}${courts}`, money(fl.venue), st(fl.venueDone, "venue", fl.venuePaid));

    const tail = left > 0 ? `，零頭 ${num(left)} 存班費` : left < 0 ? `，還差 ${num(-left)}` : "，剛好打平";
    const sum = fl.pre ? `收 ${num(got)} ＝ ${fl.coach ? `教練 ${num(fl.coach)} ＋ ` : ""}還${tr}場地費 ${num(fl.venue)}${tail}` : `收 ${num(got)}、付 ${num(out)}${tail}`;
    return `<div class="card payout"><h2>這堂錢怎麼走</h2>
        ${step(1, `隊友轉給${tr}`)}${share}
        ${step(2, `${tr}付出去`)}${coach}${venue}
        ${S.canWrite ? `<div class="po-foot"><span>${tr}這堂還要付</span><b>${due ? money(due) : out && !(fl.pre && !fl.coach) ? "✓ 都已付" : "不用付"}</b></div>
        <div class="po-note">${sum}</div>` : ""}
      </div>`;
  }

  // 繳費文件：class-<日期>（保留匯款紀錄）
  const payDoc = (key, records) => ({ ...(S.pay[key] || {}), date: key.slice(6), records });
  const payLabel = key => `${md(key.slice(6))} `;

  // 收付狀態標籤：管理員點一下可記下／取消
  const flowPill = (ok, text, kind, d) => { const cat = kind === "coach" ? "coach" : "venue"; return S.canWrite
    ? `<button class="pill ${ok ? "ok" : "bad"} tap" data-cat="${cat}" data-act="${kind}-${ok ? "undo" : "save"}" data-date="${d}"${dis()}>${text}</button>`
    : `<span class="pill ${ok ? "ok" : "bad"}" data-cat="${cat}">${text}</span>`; };

  // 一份繳費名單
  function payList(key, list, defAmt, d, cls = ""){
    const rec = payRecs(key);
    return `<ul class="list${cls ? " " + cls : ""}">` + list.map(m => {
      const r = rec[m.id], tok = key + "|" + m.id;
      const amt = d ? oweAmount(m, d) : defAmt;
      if(!r && d && isTreasurer(m)){
        return `<li class="row"><div class="who"><b>${esc(m.name)}</b>${tagHtml(m)}</div>${(() => { const fl = flowOf(d), cn = esc(S.settings.coachNick || "教練"), pill = (ok, t, k) => flowPill(ok, (ok ? "✓ 已付給" : "還沒付給") + t, k, d); return `<div class="actions stack">${fl.season ? flowPill(fl.venueDone, fl.venueDone ? "✓ 季租已付館方" : "季租還沒付館方", "spaid", d) : pill(fl.venueDone, "館方", "venue")}${fl.coach > 0 ? pill(!!fl.coachPaid, cn, "coach") : `<span class="pill">教練請假，不用付</span>`}</div>`; })()}</li>`;
      }
      const wait = !r && d && d > today();
      if(r && r.sheet) return `<li class="row"><div class="who"><b>${esc(m.name)}</b>${tagHtml(m)}</div><div class="actions"><span class="pill ok" title="試算表上填了已付">✓ 已付（試算表）</span></div></li>`;
      const right = `<div class="actions">${S.canWrite
        ? `<button class="pill ${r ? "ok" : wait ? "wait" : "bad"}" data-act="${r ? "pay-del" : "pay-save"}" data-key="${key}" data-id="${m.id}" data-amt="${amt}">${r ? "✓ 已付" : wait ? "待繳" : "還沒付"}</button>`
        : `<span class="pill ${r ? "ok" : wait ? "wait" : "bad"}">${r ? "✓ 已付" : wait ? "待繳" : "還沒付"}</span>`}</div>`;
      return `<li class="row">
        <div class="who"><b>${esc(m.name)}</b>${tagHtml(m)}
</div>
        ${right}</li>`;
    }).join("") + `</ul>`;
  }

  // 統計
  function viewStats(sch){
    const list = active();
    if(!list.length) return noMembers();
    const t = today();
    const past = sch.filter(i => i.date <= t && i.date >= S.settings.start);
    const held = heldDates(past.map(i => i.date)).length;
    const paused = past.filter(i => i.status === "paused");
    const rows = list.map(m => {
      let p=0, l=0, a=0;
      heldDates(sch.map(i => i.date)).forEach(d => { if(attended(m, d)) p++; else if(classInfo(d).ids.includes(m.id)) a++; });
      past.forEach(i => { if(((S.att[i.date] || {}).records || {})[m.id] === "leave") l++; });
      const owed = m.role === "coach" ? [] : owedBy(m, sch);
      return {m, p, l, a, owed};
    });
    const owing = rows.filter(r => r.owed.length).length, num = x => Number(x).toLocaleString("en-US");
    return `
      ${held || paused.length ? `<div class="summary">
        <div class="stat ok"><b>${held} 堂</b><span>已上課</span></div>
        <div class="stat warn"><b>${paused.length} 週</b><span>停課</span></div>
        <div class="stat bad"><b>${owing} 人</b><span>有欠費</span></div>
      </div>` : ""}
      ${!held && !paused.length ? `<div class="empty"><b>還沒開始上課</b>第一堂上完後，這裡會開始統計出席和欠費。</div>` : `<div class="card"><h2>出席和欠費</h2>
      <div class="tablewrap"><table class="ledger att-t">
        <thead><tr><th>隊友</th><th class="num">出席</th><th class="num">請假</th><th class="num">缺席</th><th class="num">欠費</th></tr></thead>
        <tbody>${rows.map(r => { const owe = r.owed.reduce((a, x) => a + oweAmount(r.m, x), 0); return `<tr>
          <td><b>${esc(r.m.name)}</b><small>${esc(r.m.cls && r.m.cls !== "未分級" ? r.m.cls : "")}</small></td>
          <td class="num">${r.p || "–"}</td><td class="num">${r.l || "–"}</td><td class="num">${r.a || "–"}</td>

  // ---------- 季租日期編輯 ----------
  const classDay = () => weekday(S.settings.start || SEASON_FROM);

    return out;
  }
  const saveSpecial = () => write("settings/special", save("settings", "special", { off: { ...OFF_DATES }, courts: { ...COURT_FIX }, prepaidTo: VENUE_PREPAID_TO }));

  function toggleSeasonDate(d){
    const x = seasonOf(d); if(!x) return false;
    x.dates = x.dates.includes(d) ? x.dates.filter(y => y !== d) : [...x.dates, d].sort();

      ${SEASONS.map((x, i) => `<div class="sz-ed">

  // ---------- 班費收支 ----------
  function fundInfo(sch){
    const rows = ledgerRows(sch);
    const settled = rows.filter(r => !r.left && r.venueDone && r.coachDone);
    const extra = settled.reduce((a, r) => a + r.extra, 0);
    const items = (S.fund.items || []).slice().sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
    const inc = items.filter(i => i.type === "in").reduce((a, i) => a + Number(i.amount || 0), 0);
    const out = items.filter(i => i.type !== "in").reduce((a, i) => a + Number(i.amount || 0), 0);
    return { extra, settledN: settled.length, inc, out, bal: extra + inc - out, items };
  }
  const saveFund = () => write("settings/fund", save("settings", "fund", { items: JSON.parse(JSON.stringify(S.fund.items)) }));
  function fundCard(sch){
    const fi = fundInfo(sch), num = v => Number(v).toLocaleString("en-US");
    if(!S.canWrite && !fi.items.length && !fi.extra) return "";
    const type = S.draft.fdType || "out", v = (k, fb) => esc(S.draft[k] ?? fb);
    return `<div class="card">
      <h2>班費收支</h2>
      <div class="summary">
        <div class="stat ok"><b>${money(fi.extra + fi.inc)}</b><span>收入</span></div>
        <div class="stat bad"><b>${money(fi.out)}</b><span>支出</span></div>
        <div class="stat"><b>${money(fi.bal)}</b><span>結餘</span></div>

        ${fi.items.map(i => `<tr><td>${esc(i.what)}<small>${md(i.date)}</small></td><td>${S.canWrite ? `<button class="link" data-act="fund-del" data-id="${esc(i.id)}">刪除</button>` : ""}</td><td class="${i.type === "in" ? "ok" : "bad"}">${i.type === "in" ? "＋" : "－"}${num(i.amount)}</td></tr>`).join("")}
        <tr class="total"><td>結餘</td><td></td><td>${money(fi.bal)}</td></tr>
      </table>
      ${S.canWrite ? `<h3>記一筆</h3>
      <div class="seg two" role="group" aria-label="收入或支出" style="max-width:260px"><button data-act="fd-type" data-v="out" aria-pressed="${type === "out"}">支出</button><button data-act="fd-type" data-v="in" aria-pressed="${type === "in"}">收入</button></div>
      <div class="fields">

        <label class="field"><span>金額</span><input id="fd_amt" type="number" inputmode="numeric" min="0" value="${v("fd_amt", "")}"></label>
      </div>
      <div class="actions"><button class="btn" data-act="fund-add">記下這一筆</button></div>` : ""}
      <p class="muted">班費來自每堂進位的零頭；買球、雜支記在這裡，大家都看得到。</p>
