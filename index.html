  // ---------- 出席次數 ----------
  const attended = (m, d) => classInfo(d).ids.includes(m.id) && ((S.att[d] || {}).records || {})[m.id] !== "absent";
  const heldDates = ds => ds.filter(d => d <= today() && !["planned", "paused"].includes(statusOf(d)));

  // ---------- 季末結算（複製到 LINE） ----------
  function seasonReport(){
    const t = today(), x = SEASONS.find(z => z.to >= t) || SEASONS[SEASONS.length - 1]; if(!x) return "";
    const sch = schedule(), sc = seasonCalc(x), N = sc.N, num = v => Number(v).toLocaleString("en-US");
    const held = heldDates(liveDates(x)), done = sc.done + sc.paused >= N;
    const att = players().map(m => ({ m, n: held.filter(d => attended(m, d)).length })).sort((a, b) => b.n - a.n);
    const owe = players().map(m => ({ m, ds: owedBy(m, sch).filter(d => x.dates.includes(d)) })).filter(o => o.ds.length);
    const fi = fundInfo(sch);
    return `🏸【${S.settings.group}】${x.name}${done ? "結算" : "到目前為止"}\n` +
      `上課 ${held.length} 堂${sc.paused ? `、停課 ${sc.paused} 堂` : ""}（共 ${N} 堂${done ? "" : `，還有 ${N - sc.done - sc.paused} 堂`}）\n\n` +
      `📋 出席\n${att.map(a => `${a.m.name} ${a.n} 堂`).join("、")}\n\n` +
      `💰 課費\n${owe.length ? owe.map(o => `${o.m.name} 還沒付 ${o.ds.length} 堂，${money(o.ds.reduce((a, d) => a + oweAmount(o.m, d), 0))}`).join("\n") : "大家都已付 👍"}\n\n` +
      `🏟️ 季租場地\n${S.settings.bookerNick ? `${S.settings.bookerNick}租借，` : ""}${trName()}${seasonPaid(x) ? "已" : "要"}匯款給館方 ${num(sc.total)}（${N} 堂），已上 ${sc.done} 堂、課費收回 ${num(sc.back)}\n\n` +
      `🪙 班費結餘 ${money(fi.bal)}\n` +
      `謝謝大家${done ? "這一季" : ""}的努力，下次球場見！`;
  }

  // 季租場地：吉哥整季匯給館方，每堂課費裡的場地費慢慢收回來
  function seasonCard(){
    const t = today(), x = SEASONS.find(z => z.to >= t);
    if(!x) return "";
    const tr = esc(trName()), num = v => Number(v).toLocaleString("en-US");
    const { N, total, per, done, paused, later, back } = seasonCalc(x);
    const pct = v => (total ? Math.round(v / total * 1000) / 10 : 0) + "%";
    const started = done + paused > 0, paid = seasonPaid(x), auto = paid && !x.paid;
    return `<div class="card season">
      <h2>季租場地<small>${esc(x.name)}</small></h2>
      <div class="sz-top">
        <div><span>${auto ? `${tr}已匯款給館方` : `${tr}匯款給館方`}</span><b>${money(total)}</b><small>${N} 堂 × ${num(per)}</small></div>
        <div><span>上課進度</span><b>${started ? `第 ${done + paused}／${N} 堂` : `${md(liveDates(x)[0] || x.from)} 開始`}</b><small>${started ? `還有 ${N - done - paused} 堂` : `共 ${N} 堂`}</small></div>
      </div>
      <div class="sz-paid ${paid ? "ok" : "bad"}">${auto ? `✓ ${bkName() ? `${bkName()}租借、` : ""}${tr}已匯款付清` : paid ? `✓ 季租已匯給館方（${md(paid.date)}・${esc(paid.method || "")}）` : "季租還沒匯給館方"}${S.canWrite && !auto ? ` <button class="link" data-act="spaid-${paid ? "undo" : "save"}" data-date="${liveDates(x)[0] || x.from}">${paid ? "取消紀錄" : "記下已匯款"}</button>` : ""}</div>
      <p class="sz-dates">${liveDates(x).map(d => d < t ? `<s>${md(d)}</s>` : md(d)).join("、")}</p>
      ${started ? `<div class="sz-bar" role="img" aria-label="已上課 ${pct(back)}"><i class="ok" style="width:${pct(back)}"></i><i class="warn" style="width:${pct(paused * per)}"></i></div>
      <table class="calc sz-calc">
        <tr><td><i class="sz-dot ok"></i>已上 ${done} 堂，課費收回場地費</td><td></td><td>${money(back)}</td></tr>
        ${paused ? `<tr><td><i class="sz-dot warn"></i>停課 ${paused} 堂（場地費下季扣除）</td><td></td><td>${money(paused * per)}</td></tr>` : ""}
        <tr><td><i class="sz-dot"></i>還沒上的 ${N - done - paused} 堂</td><td></td><td>${money(later)}</td></tr>
        <tr class="total"><td>季租合計</td><td></td><td>${money(total)}</td></tr>
      </table>` : ""}
      <p class="muted">每堂課費含場地費 ${num(per)}，上完 ${N} 堂剛好收回${started ? "" : "；開季後會顯示進度"}。</p>
      ${S.canWrite ? `<div class="actions"><button class="btn small" data-act="copy-season">複製${done + paused >= N ? "季末結算" : "本季目前結算"}，貼到 LINE</button></div>` : ""}
    </div>`;
  }
  function seasonCalc(x){
    const t = today(), s = S.settings, per = s.venueHours * s.venueRate2;
    const ds = liveDates(x), N = ds.length, total = N * per;
    let done = 0, paused = 0;
    ds.forEach(d => { const st = statusOf(d); if(d > t || st === "planned") return; if(st === "paused") paused++; else done++; });
    return { N, total, per, done, paused, later: (N - done - paused) * per, back: done * per };
  }

  // 吉哥對帳：有點名或收款紀錄、或已經上過的每一堂
  function ledgerRows(sch){
    const t = today();
    return sch.filter(i => i.date >= S.settings.start && billable(i.status) && (i.date <= t || S.pay[payKey(i.date)]))
      .map(i => { const d = i.date, ci = classInfo(d); if(!ci.n) return null;
        const fl = flowOf(d), f = fees(ci.n, d), rec = payRecs(payKey(d));
        const must = players().filter(m => ci.ids.includes(m.id) && !selfSettled(m, d));
        const due = must.length * ci.pp, got = must.reduce((a, m) => a + (rec[m.id] ? Number(rec[m.id].amount || ci.pp) : 0), 0);
        return { d, n: ci.n, pp: ci.pp, due, got, left: must.filter(m => !rec[m.id]).length,
          venue: f.venue, venueDone: fl.venueDone, season: fl.season, coach: f.coach, coachDone: !!fl.coachPaid || !f.coach,
          extra: ci.pp * ci.n - f.session };
      }).filter(Boolean);
  }
  function ledgerCard(sch){
    const rows = ledgerRows(sch);
    if(!rows.length) return "";
    const num = x => Number(x).toLocaleString("en-US"), tr = esc(trName()), vp = esc(vpName()), cn = esc(S.settings.coachNick || "教練");
    const sum = k => rows.reduce((a, r) => a + r[k], 0);
    const settled = rows.filter(r => !r.left && r.venueDone && r.coachDone);
    const ok = (b, t) => `<td class="num ${b ? "ok" : "bad"}">${b ? "✓ " + t : t}<small>${b ? "已付" : "還沒付"}</small></td>`;
    if(!S.canWrite) return `<details class="fold card"><summary>財務對帳（${rows.length} 堂）</summary>${ledgerInner()}</details>`;
    return `<div class="card">
      <h2>財務對帳</h2>${ledgerInner()}</div>`;
    function ledgerInner(){ return `
      <div class="tablewrap"><table class="ledger">
        <thead><tr><th>日期</th><th class="num c-class" data-cat="class">隊友繳費</th><th class="num c-venue" data-cat="venue">付館方</th><th class="num c-coach" data-cat="coach">付${cn}</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td><b>${md(r.d)}</b><small>${r.n} 人</small></td><td class="num ${r.left ? "bad" : "ok"}">${r.left ? num(r.got) : "✓ " + num(r.got)}<small>${r.left ? `差 ${r.left} 人` : "全部已付"}</small></td>${r.season ? `<td class="num ${r.venueDone ? "ok" : "bad"}">${r.venueDone ? "✓ " : ""}${num(r.venue)}<small>${prepaid(r.d) ? "季租・已先付" : r.venueDone ? "季租已付" : "季租還沒付"}</small></td>` : ok(r.venueDone, num(r.venue))}${r.coach ? ok(r.coachDone, num(r.coach)) : `<td class="num muted">—<small>教練請假</small></td>`}</tr>`).join("")}</tbody>
      </table></div>
      <table class="calc">
        <tr><td>隊友應付給${tr}</td><td></td><td>${money(sum("due"))}</td></tr>
        <tr><td>已經收到</td><td></td><td>${money(sum("got"))}</td></tr>
        <tr><td>還沒收到</td><td></td><td>${money(sum("due") - sum("got"))}</td></tr>
        <tr class="total"><td>班費<small>進位多收的零頭，已結清 ${settled.length} 堂</small></td><td></td><td>${money(settled.reduce((a, r) => a + r.extra, 0))}</td></tr>
      </table>
      <p class="muted">「付館方」「付${cn}」是${tr}付出去的錢，✓＝已付、紅字＝還沒付。${prepaidDates().length ? `${md(prepaidDates()[0])}～${md(prepaidDates().slice(-1)[0])} 場地費${tr}已匯款付清。` : "季租場地費整季一次匯，到「季租場地」記下。"}班費只算收付都完成的堂。</p>
      ${S.canWrite ? `<div class="actions"><button class="btn small" data-act="export-csv">匯出 Excel 備份</button></div>` : ""}
    `; }
  }
  function exportCsv(){
    const sch = schedule(), out = [["日期","姓名","分級","出席狀態","應付","已付"]];
    const STN = { present: "出席", leave: "請假", absent: "缺席" };
    ledgerRows(sch).forEach(r => {
      const rec = (S.att[r.d] && S.att[r.d].records) || {}, pay = payRecs(payKey(r.d));
      const ids = classInfo(r.d).ids;
      players().forEach(m => {
        const going = ids.includes(m.id), self = going && selfSettled(m, r.d);
        out.push([r.d, m.name, m.cls || "", STN[rec[m.id]] || (going ? "出席" : ""), going ? r.pp : 0, !going ? "" : self ? "免轉（財務）" : pay[m.id] ? "已付" : "還沒付"]);
      });
    });
    const csv = "\ufeff" + out.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = (S.settings.group || "點名簿") + "_備份_" + today() + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    toast("已下載備份，可以用 Excel 打開");
  }

  // 隊友
  function viewMembers(){
    const d = S.draft, s = S.settings;
    const on = active(), off = S.members.filter(m => m.active === false);
    const v = (k, fallback) => esc(d[k] ?? fallback ?? "");
    const row = m => {
      if(S.editId === m.id){
        return `<li class="row wide"><div class="form">
          <div class="fields">
            <label class="field"><span>姓名</span><input id="editName" value="${v("editName", m.name)}"></label>
            <label class="field"><span>分級</span><select id="editCls">${CLASSES.map(c => `<option${(d.editCls ?? (m.cls||"未分級"))===c?" selected":""}>${c}</option>`).join("")}</select></label>
            <label class="field"><span>備註</span><input id="editNote" value="${v("editNote", m.note)}"></label>
          </div>
          <div class="actions"><button class="btn primary" data-act="edit-save" data-id="${m.id}">存檔</button><button class="btn" data-act="edit" data-id="">先不要</button></div>
        </div></li>`;
      }
      const delBtns = S.delConfirm === m.id
        ? `<span class="muted">刪掉就救不回來了，確定嗎？</span><button class="btn small danger" data-act="del" data-id="${m.id}"${dis()}>確定刪除</button><button class="btn small" data-act="del-ask" data-id="">先不要</button>`
        : `<button class="btn small danger" data-act="del-ask" data-id="${m.id}"${dis()}>刪除</button>`;
      return `<li class="row${S.delConfirm === m.id ? " wide" : ""}">
        <div class="who"><b>${esc(m.name)}</b>${tagHtml(m)}
          ${m.note ? `<span class="sub">${esc(m.note)}</span>` : ""}</div>
        ${!S.canWrite ? "" : `<div class="actions">${m.active === false
          ? `<button class="btn small" data-act="toggle" data-id="${m.id}"${dis()}>回來上課</button>${delBtns}`
          : `<button class="btn small" data-act="edit" data-id="${m.id}"${dis()}>編輯</button><button class="btn small" data-act="toggle" data-id="${m.id}"${dis()}>暫時停課</button>`}</div>`}
      </li>`;
    };
    const f = fees(null, nextClassDate(schedule()));
    return `
      ${on.length ? `<h3>上課中的隊友（${on.length} 人）</h3><ul class="list pair">${on.map(row).join("")}</ul>${adminHintP("排序：先看分級，同分級再照姓名筆畫。")}` : `<div class="empty"><b>名單還是空的</b>${S.canWrite ? "用下面的表單加入第一位隊友吧。" : "請管理員登入後加入隊友。"}</div>`}
      ${!S.canWrite ? "" : `<div class="card">
        <h2>加入新隊友</h2>
        <div class="fields">
          <label class="field"><span>姓名</span><input id="newName" placeholder="例如：陳小美" value="${v("newName")}"${dis()}></label>
          <label class="field"><span>分級</span><select id="newCls"${dis()}>${CLASSES.map(c => `<option${(d.newCls||"未分級")===c?" selected":""}>${c}</option>`).join("")}</select></label>
          <label class="field"><span>備註（可以不填）</span><input id="newNote" placeholder="例如：運輪放球館" value="${v("newNote")}"${dis()}></label>
        </div>
        <div class="actions"><button class="btn primary" data-act="add"${dis()}>加進名單</button></div>
        <p class="muted">加人或停課，費用會自動重算。</p>
      </div>`}
      ${off.length ? `<h3>暫時停課（${off.length} 人）</h3><p class="muted">停課的隊友不點名、不分攤，以前的紀錄都留著。</p><ul class="list pair">${off.map(row).join("")}</ul>` : ""}
      ${!S.canWrite ? "" : `<div class="card">
        <h2>課程和費用設定</h2>
        <div class="fields">
          <label class="field"><span>班名</span><input id="set_group" value="${v("set_group", s.group)}"${dis()}></label>
          <label class="field"><span>地點</span><input id="set_location" value="${v("set_location", s.location)}"${dis()}></label>
          <label class="field"><span>上課時間</span><input id="set_time" value="${v("set_time", s.time)}"${dis()}></label>
          <label class="field"><span>第一堂是哪天</span><input id="set_start" type="date" value="${v("set_start", s.start)}"${dis()}></label>
          <label class="field"><span>教練課幾小時（每堂）</span><input id="set_coachHours" type="number" inputmode="decimal" min="0" step="0.5" value="${v("set_coachHours", s.coachHours)}"${dis()}></label>
          <label class="field"><span>教練費（每小時）</span><input id="set_coachRate" type="number" inputmode="numeric" min="0" value="${v("set_coachRate", s.coachRate)}"${dis()}></label>
          <label class="field"><span>場地租幾小時（每堂）</span><input id="set_venueHours" type="number" inputmode="decimal" min="0" step="0.5" value="${v("set_venueHours", s.venueHours)}"${dis()}></label>
          <label class="field"><span>1 面場地費（每小時，身障半價後）</span><input id="set_venueRate" type="number" inputmode="numeric" min="0" value="${v("set_venueRate", s.venueRate)}"${dis()}></label>
          <label class="field"><span>季租前才用：幾人以上開 2 面場地（填 0 ＝不開）</span><input id="set_bigMin" type="number" inputmode="numeric" min="0" value="${v("set_bigMin", s.bigMin)}"${dis()}></label>
          <label class="field"><span>2 面包場費（每小時，身障半價後）</span><input id="set_venueRate2" type="number" inputmode="numeric" min="0" value="${v("set_venueRate2", s.venueRate2)}"${dis()}></label>
          <label class="field"><span>誰負責維護管理</span><select id="set_manager"${dis()}><option value="">（沒有指定）</option>${on.map(m => `<option value="${m.id}"${(d.set_manager ?? s.manager) === m.id ? " selected" : ""}>${esc(m.name)}</option>`).join("")}</select></label>
          <label class="field"><span>財務</span><select id="set_treasurer"${dis()}><option value="">（沒有指定）</option>${on.map(m => `<option value="${m.id}"${(d.set_treasurer ?? s.treasurer) === m.id ? " selected" : ""}>${esc(m.name)}</option>`).join("")}</select></label>
          <label class="field"><span>場地租借人的稱呼（空白＝不顯示）</span><input id="set_bookerNick" placeholder="例如：芳玉" value="${v("set_bookerNick", s.bookerNick)}"${dis()}></label>
          <label class="field"><span>財務的稱呼（提醒裡用）</span><input id="set_trNick" placeholder="例如：吉哥" value="${v("set_trNick", s.trNick)}"${dis()}></label>
          <label class="field" style="grid-column:1/-1"><span>收款方式（會顯示給大家看）</span><input id="set_payInfo" placeholder="例如：LINE Pay 轉給吳宗吉，或上課時給現金" value="${v("set_payInfo", s.payInfo)}"${dis()}></label>
        </div>
        <div class="actions"><button class="btn primary" data-act="settings-save"${dis()}>存檔</button></div>
      </div>`}
      ${S.canWrite ? seasonEditor() + specialEditor() : ""}
      `;
  }

  // 往下捲時把標題列縮小，畫面多看一點內容
  { const topEl = document.querySelector("header.top"); let mini = false;
    addEventListener("scroll", () => { const y = scrollY; if(!mini && y > 80){ mini = true; topEl.classList.add("shrunk"); } else if(mini && y < 20){ mini = false; topEl.classList.remove("shrunk"); } }, { passive: true }); }

  // ---------- events ----------
  document.querySelector(".tabs").addEventListener("click", e => {
    const b = e.target.closest("[data-tab]"); if(!b) return;
    S.tab = b.dataset.tab; S.payOpen = S.payConfirm = S.editId = S.delConfirm = null; render(); window.scrollTo(0,0);
  });
  app.addEventListener("input", e => { if(e.target.id) S.draft[e.target.id] = e.target.value; });
  app.addEventListener("change", e => {
    const t = e.target;
    // 開課日（12/5）之前的日期不列，選到更早就跳回開課日
    const clamp = v => v < S.settings.start ? S.settings.start : v;
    if(t.id === "mePick"){ setMe(t.value); S.meEdit = false; render(); return; }
    if(t.id === "datePick" && t.value){ S.date = clamp(t.value); render(); }
    else if(t.id) S.draft[t.id] = t.value;
  });

  app.addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
    const act = b.dataset.act, id = b.dataset.id;

    switch(act){
      case "goto": S.tab = b.dataset.tab; render(); break;
      case "me-change": S.meEdit = true; render(); break;
      case "sheet-ok": setSeen(leaveKeys()); render(); toast("好的，已確認請假更新"); break;
      case "sz-date": case "sz-cancel": {
        const d = b.dataset.date, x = seasonOf(d); if(!x) { toast("這天不在任何一季裡"); break; }
        const was = x.dates.includes(d);
        toggleSeasonDate(d); render();
        toast(`記下了：${md(d)} ${was ? "停課（場地也退），記得 7 天前通知館方" : "恢復上課"}`);
        break;
      }
      case "sp-off-add": {
        const d = S.draft.sp_off_d, r = (S.draft.sp_off_r || "").trim() || "停課";
        if(!d){ toast("請選日期"); break; }
        OFF_DATES[d] = r; saveSpecial(); delete S.draft.sp_off_d; delete S.draft.sp_off_r; render(); toast(`記下了：${md(d)} 停課（${r}），記得 7 天前通知館方`); break;
      }
      case "sp-off-del": { const d = b.dataset.date; delete OFF_DATES[d]; saveSpecial(); render(); toast(`記下了：${md(d)} 恢復上課`); break; }
      case "sp-ct-add": {
        const d = S.draft.sp_ct_d, n = Number(S.draft.sp_ct_n || 2);
        if(!d){ toast("請選日期"); break; }
        COURT_FIX[d] = n; saveSpecial(); delete S.draft.sp_ct_d; render(); toast(`記下了：${md(d)} 開 ${n} 面`); break;
      }
      case "sp-ct-del": { const d = b.dataset.date; delete COURT_FIX[d]; saveSpecial(); render(); toast(`記下了：${md(d)} 改回照人數決定`); break; }
      case "sp-pre-save": {
        const d = S.draft.sp_pre ?? VENUE_PREPAID_TO;
        VENUE_PREPAID_TO = d || ""; saveSpecial(); delete S.draft.sp_pre; render(); toast(d ? `記下了：場地費已預付到 ${md(d)}` : "記下了：取消場地費預付"); break;
      }
      case "sz-del-ask": S.szDel = b.dataset.i === "" ? null : +b.dataset.i; render(); break;
      case "sz-del": { const i = +b.dataset.i, x = SEASONS[i]; S.szDel = null; if(!x) break; SEASONS.splice(i, 1); setSeasons(SEASONS); saveSeasons(); render(); toast(`記下了：刪除「${x.name}」`); break; }
      case "sz-add": {
        const name = (document.getElementById("sz_name").value || "").trim(), from = document.getElementById("sz_from").value, to = document.getElementById("sz_to").value;
        if(!name || !from || !to){ toast("名稱和日期都要填"); break; }
        if(to < from){ toast("結束日要在開始日之後"); break; }
        if(SEASONS.some(x => !(to < x.from || from > x.to))){ toast("日期和其他季重疊了"); break; }
        const x = { name, from, to, dates: [] }; x.dates = seasonWeeks(x);
        setSeasons([...SEASONS, x]); saveSeasons();
        ["sz_name", "sz_from", "sz_to"].forEach(k => delete S.draft[k]);
        render(); toast(`記下了：新增「${name}」${x.dates.length} 堂`);
        break;
      }
      case "fd-type": S.draft.fdType = b.dataset.v; render(); break;
      case "fund-add": {
        const date = document.getElementById("fd_date").value || today(), what = document.getElementById("fd_what").value.trim(), amount = Math.round(Number(document.getElementById("fd_amt").value));
        if(!what){ toast("請填項目"); break; }
        if(!(amount > 0)){ toast("請填金額"); break; }
        const type = S.draft.fdType === "in" ? "in" : "out";
        S.fund.items = [...(S.fund.items || []), { id: "f" + Date.now().toString(36), date, what, amount, type }];
        ["fd_what", "fd_amt"].forEach(k => delete S.draft[k]);
        saveFund(); render(); toast(`記下了：${type === "in" ? "收入" : "支出"} ${what} ${money(amount)}`);
        break;
      }
      case "fund-del": { const it = (S.fund.items || []).find(i => i.id === id); if(!it) break; S.fund.items = S.fund.items.filter(i => i.id !== id); saveFund(); render(); toast(`記下了：刪除 ${it.what}`); break; }
      case "me-cancel": S.meEdit = false; render(); break;
      case "date": {
        const dates = schedule().map(i => i.date);
        const n = +b.dataset.n, i = dates.indexOf(S.date);
        if(i >= 0 && dates[i+n]) S.date = dates[i+n];
        else if(i < 0){ const nb = n > 0 ? dates.find(d => d > S.date) : [...dates].reverse().find(d => d < S.date); S.date = nb || stepWeek(S.date, n); }
        else S.date = stepWeek(S.date, n);
        if(S.date < S.settings.start) S.date = S.settings.start;
        render(); break;
      }
      case "date-next": S.date = nextClassDate(schedule()); render(); break;
      case "paydate": {
        const dates = schedule().map(i => i.date);
        const n = +b.dataset.n, i = dates.indexOf(S.date);
        if(i >= 0 && dates[i+n]) S.date = dates[i+n];
        else if(i < 0){ const nb = n > 0 ? dates.find(d => d > S.date) : [...dates].reverse().find(d => d < S.date); S.date = nb || stepWeek(S.date, n); }
        else S.date = stepWeek(S.date, n);
        if(S.date < S.settings.start) S.date = S.settings.start;
        S.payOpen = S.payConfirm = null; render(); break;
      }
      case "paydate-next": S.date = nextClassDate(schedule()); S.payOpen = S.payConfirm = null; render(); break;
      case "paydate-go": S.date = b.dataset.date; S.payOpen = S.payConfirm = null; render(); window.scrollTo(0,0); break;

      case "att": {
        const date = S.date, s = b.dataset.s;
        const cur = { ...((S.att[date] && S.att[date].records) || {}) };
        if(sheetDay(date) && (s === "leave" || cur[id] === "leave")){ toast("請假以請假紀錄試算表為準，請到試算表修改"); break; }
        const hadLeave = Object.values(cur).includes("leave");
        if(cur[id] === s) delete cur[id]; else cur[id] = s;
        const hasLeave = Object.values(cur).includes("leave");
        const mode = S.att[date] && S.att[date].mode;
        const doc = { date, records: cur };
        if(hasLeave && mode) doc.mode = mode;
        S.att[date] = doc;
        render();
        write("attendance/"+date, save("attendance", date, cloudDoc(doc)));
        if(hasLeave && !hadLeave) toast(mode === "single" ? "已記請假，其他人照上" : "有人請假，這週先停課（也可以改成其他人照上）");
        else if(!hasLeave && hadLeave) toast("沒人請假了，這週照常上團課");
        break;
      }
      case "mode": {
        const date = S.date, v = b.dataset.v;
        const doc = { date, records: { ...((S.att[date] && S.att[date].records) || {}) }, mode: v };
        S.att[date] = doc; render();
        write("attendance/"+date, save("attendance", date, doc));
        toast(v === "single" ? "其他人照上，費用由沒請假的人平分" : "改回整班停課，這週不收費");
        break;
      }
      case "all-present": {
        const date = S.date;
        const cur = { ...((S.att[date] && S.att[date].records) || {}) };
        active().forEach(m => { if(!cur[m.id]) cur[m.id] = "present"; });
        const doc = { date, records: cur };
        if(S.att[date] && S.att[date].mode && Object.values(cur).includes("leave")) doc.mode = S.att[date].mode;
        S.att[date] = doc; render();
        write("attendance/"+date, save("attendance", date, cloudDoc(doc)));
        toast("全部標好出席了");
        break;
      }

      case "pay-open": S.payOpen = id ? b.dataset.key + "|" + id : null; S.payConfirm = null; delete S.draft.payAmt; delete S.draft.payDate; delete S.draft.payMethod; render(); break;
      case "pay-method": S.draft.payMethod = b.dataset.v; render(); break;
      case "pay-save": {
        const amt = Number(b.dataset.amt) || 0, date = today();
        const key = b.dataset.key;
        const recs = { ...((S.pay[key] && S.pay[key].records) || {}) };
        recs[id] = { amount: amt, date, method: "" };
        const doc = payDoc(key, recs);
        S.pay[key] = doc; S.payOpen = null; render();
        write("payments/"+key, save("payments", key, doc));
        toast(`記下了：${nameOf(id)} ${payLabel(key)}的錢已經${treasurerOf() ? "給" + trName() : "收到"}`);
        break;
      }
      case "pay-confirm": S.payConfirm = id ? b.dataset.key + "|" + id : null; render(); break;

      case "coach-method": S.draft.coachMethod = b.dataset.v; render(); break;
      case "venue-method": S.draft.venueMethod = b.dataset.v; render(); break;
      case "venue-save":
      case "venue-undo": {
        const d = b.dataset.date, key = payKey(d), fl = flowOf(d);
        const doc = { ...(S.pay[key] || {}), date: d, records: (S.pay[key] && S.pay[key].records) || {} };
        if(act === "venue-save") doc.venuePaid = { amount: fl.venue, date: today(), method: S.draft.venueMethod || "LINE Pay" };
        else delete doc.venuePaid;
        S.pay[key] = doc; render();
        write("payments/"+key, save("payments", key, doc));
        toast(act === "venue-save" ? `記下了：${trName()} 已付館方場地費 ${money(fl.venue)}` : "付館方紀錄取消了");
        break;
      }
      case "spaid-save":
      case "spaid-undo": {
        const x = seasonOf(b.dataset.date); if(!x) break;
        const total = liveDates(x).length * S.settings.venueHours * S.settings.venueRate2;
        if(act === "spaid-save") x.paid = { amount: total, date: today(), method: S.draft.venueMethod || "匯款" }; else delete x.paid;
        setSeasons(SEASONS); saveSeasons(); render();
        toast(act === "spaid-save" ? `記下了：${trName()} 已匯「${x.name}」季租 ${money(total)} 給館方` : "季租付款紀錄取消了");
        break;
      }
      case "coach-save":
      case "coach-undo": {
        const d = b.dataset.date, key = payKey(d), fl = flowOf(d);
        const doc = { ...(S.pay[key] || {}), date: d, records: (S.pay[key] && S.pay[key].records) || {} };
        if(act === "coach-save") doc.coachPaid = { amount: fl.coach, date: today(), method: S.draft.coachMethod || "LINE Pay" };
        else delete doc.coachPaid;
        S.pay[key] = doc; render();
        write("payments/"+key, save("payments", key, doc));
        toast(act === "coach-save" ? `記下了：${trName()} 已匯給${S.settings.coachNick || "教練"} ${money(fl.coach)}` : "教練費紀錄取消了");
        break;
      }
      case "pay-del": {
        const key = b.dataset.key;
        const recs = { ...((S.pay[key] && S.pay[key].records) || {}) };
        delete recs[id];
        const doc = payDoc(key, recs);
        S.pay[key] = doc; S.payConfirm = null; render();
        write("payments/"+key, save("payments", key, doc));
        toast(`${nameOf(id)} 改回還沒付`);
        break;
      }
      case "export-csv": exportCsv(); break;
      case "copy-class":
      case "copy-owed":
      case "copy-season":
      case "copy-one": {
        let text;
        const tr = trName(), info = S.settings.payInfo ? `（${S.settings.payInfo}）` : "";
        if(act === "copy-class"){
          const d = b.dataset.date, fl = flowOf(d), ci = fl.ci;
          const rec = payRecs(payKey(d));
          const unpaid = players().filter(m => ci.ids.includes(m.id) && !rec[m.id] && !selfSettled(m, d)).map(m => m.name);
          const leave = leaversOf(d);
          text = `🏸【${S.settings.group}】${labelDate(d)} 課費\n` +
            (leave.length ? `${leave.join("、")} 請假，其他 ${ci.n} 位照常上課。\n` : "") +
            `一堂 ${money(fees(ci.n, d).session)}（${courtLabel(fees(ci.n, d))}），${ci.n} 位平分，每人 ${money(ci.pp)}。\n` +
            (treasurerOf() ? `👉 請把 ${money(ci.pp)} 轉給 ${tr}${info}。\n` : "") +
            (treasurerOf() ? (fl.pre ? `場地費 ${money(fl.venue)}${S.settings.bookerNick ? `（${S.settings.bookerNick}租借）` : ""}${tr} 已匯款給館方，${fl.coach ? `${tr} 收齊後付教練費 ${money(fl.coach)}` : "這堂教練請假，不用付教練費"}。\n` :`${tr} 收齊後付教練費 ${money(fl.coach)}${fl.coach ? "" : "（教練請假）"}、場地費 ${money(fl.venue)}${fl.season ? "（季租）" : ""}。\n`) : "") +
            (unpaid.length ? `還沒轉的：${unpaid.join("、")}，再麻煩大家囉，謝謝！` : `大家都已付，謝謝大家！`);
        } else if(act === "copy-season"){
          text = seasonReport();
        } else if(act === "copy-one"){
          const m = S.members.find(x => x.id === b.dataset.id); if(!m) break;
          const ds = owedBy(m, schedule()), amts = ds.map(dd => oweAmount(m, dd)), tot = amts.reduce((a, c) => a + c, 0);
          if(!ds.length){ toast(`${m.name} 沒有欠款`); break; }
          text = `${m.name}你好 🏸\n${S.settings.group}${ds.length > 1 ? `這 ${ds.length} 堂` : "這堂"}的課費還沒收到：\n` +
            ds.map((dd, i) => `・${labelDate(dd)}　${money(amts[i])}`).join("\n") + "\n" +
            (ds.length > 1 ? `一共 ${money(tot)}，` : "") + (treasurerOf() ? `方便時再轉給${tr}${info}就可以了，` : "") + `謝謝你！`;
        } else {
          const sch = schedule();
          const lines = players().map(m => ({ m, ds: owedBy(m, sch) })).filter(x => x.ds.length)
            .map(x => `・${x.m.name}：${x.ds.map(md).join("、")}，一共 ${money(x.ds.reduce((a, dd) => a + oweAmount(x.m, dd), 0))}`);
          text = `🏸【${S.settings.group}】還沒繳的課費\n${lines.join("\n")}\n` +
            (treasurerOf() ? `請轉給 ${tr}${info}，` : "") + `再麻煩大家囉，謝謝！`;
        }
        try { await navigator.clipboard.writeText(text); toast("複製好了，可以貼到 LINE 囉"); }
        catch(_) {
          const box = b.closest(".card") || b.parentElement; const ta = document.createElement("textarea");
          ta.value = text; ta.rows = 5; ta.style.width = "100%"; box.appendChild(ta); ta.select(); toast("請長按選取文字再複製");
        }
        break;
      }

      case "add": {
        const name = document.getElementById("newName").value.trim();
        if(!name){ toast("請先填姓名"); document.getElementById("newName").focus(); break; }
        const data = { name, role: "player", cls: document.getElementById("newCls").value,
          phone: "", note: document.getElementById("newNote").value.trim(),
          active: true, createdAt: Date.now() };
        const newId = "m" + Date.now().toString(36);
        S.members = S.members.concat([{ id: newId, ...data }]).sort(byClassThenStroke);
        S.draft.newName = S.draft.newNote = "";
        write("members/"+newId, save("members", newId, data));
        toast(`歡迎 ${name} 加入！`);
        render();
        break;
      }
      case "edit": S.editId = id || null; ["editName","editCls","editNote"].forEach(k => delete S.draft[k]); render(); break;
      case "edit-save": {
        const m = S.members.find(x => x.id === id); if(!m) break;
        const name = document.getElementById("editName").value.trim();
        if(!name){ toast("姓名不能空白喔"); break; }
        const data = { name, role: "player", cls: document.getElementById("editCls").value,
          phone: m.phone || "", note: document.getElementById("editNote").value.trim(),
          active: m.active !== false, createdAt: m.createdAt || Date.now() };
        S.members = S.members.map(x => x.id === id ? { id, ...data } : x).sort(byClassThenStroke);
        S.editId = null; render();
        write("members/"+id, save("members", id, data));
        toast("存好了");
        break;
      }
      case "toggle": {
        const m = S.members.find(x => x.id === id); if(!m) break;
        const next = m.active === false;
        const updated = { ...m, active: next }; delete updated.id;
        S.members = S.members.map(x => x.id === id ? { id, ...updated } : x);
        render();
        write("members/"+id, save("members", id, updated));
        toast(next ? `${m.name} 回來上課了，費用已重算` : `${m.name} 先停課，費用已重算`);
        break;
      }
      case "del-ask": S.delConfirm = id || null; render(); break;
      case "del": {
        S.delConfirm = null;
        const nm = nameOf(id);
        S.members = S.members.filter(x => x.id !== id);
        render();
        write("members/"+id, remove("members", id));
        toast(`已刪除 ${nm}`);
        break;
      }
      case "settings-save": {
        const next = { ...S.settings };
        ["group","location","time","start","manager","treasurer","payInfo","trNick","bookerNick"].forEach(k => { next[k] = document.getElementById("set_"+k).value.trim(); });
        NUMS.forEach(k => { const n = Number(document.getElementById("set_"+k).value); next[k] = n >= 0 ? n : DEF[k]; });
        if(!next.start) next.start = DEF.start;
        delete next.perTerm;
        S.settings = next;
        Object.keys(S.draft).filter(k => k.startsWith("set_")).forEach(k => delete S.draft[k]);
        S.date = null; S.date = null; render();
        write("settings/main", save("settings", "main", next));
        toast("設定存好了，費用已重算");
        break;
      }
    }
  });

  // ---------- data（Google 試算表） ----------
  let pendingWrites = 0;
  const CACHE = "ylCache";
  const hhmm = t => { const x = new Date(t); return `${x.getMonth() + 1}/${x.getDate()} ${pad(x.getHours())}:${pad(x.getMinutes())}`; };
  function applyData(d){
      S.members = Object.keys(d.members || {}).map(id => ({ id, ...d.members[id] })).sort(byClassThenStroke);
      S.rawAtt = d.attendance || {};
      S.pay = d.payments || {};
      const first = !S.loaded.settings;
      const v = (d.settings || {}).main;
      if(v){
        const next = { ...DEF, ...v };
        NUMS.forEach(k => { next[k] = Number(next[k]); if(!(next[k] >= 0)) next[k] = DEF[k]; });
        if(!next.start || next.start < FIRST_DAY) next.start = FIRST_DAY;   // 整個系統從 12/12 開始算
        S.settings = next;
      }
      const sv = (d.settings || {}).seasons;
      setSeasons(sv && Array.isArray(sv.list) ? sv.list : DEF_SEASONS);
      setSpecial((d.settings || {}).special);
      const fd = (d.settings || {}).fund;
      S.fund = { items: fd && Array.isArray(fd.items) ? fd.items : [] };
      mergeAtt();
      S.loaded.members = S.loaded.settings = true;
      if(first){ S.date = null; S.date = null; }
  }
  async function load(){
    try {
      const d = await gs("getData");
      if(pendingWrites || staged.size) return; // 還有資料在存或還沒儲存，先不要蓋掉畫面
      applyData(d);
      try { localStorage.setItem(CACHE, JSON.stringify({ t: Date.now(), d })); } catch(_){}
      if(!S.loginOpen) renderAdminBar();   // 名單載入後補上管理員名字
      if(S.offline){ S.offline = false; notice(""); }
      scheduleRender();
    } catch(e){
      S.offline = true;
      if(!S.loaded.members){ S.loaded.members = true; render(); }
      notice(S.cacheAt ? `收訊不好，先顯示 ${hhmm(S.cacheAt)} 存在手機裡的資料；連上網路會自動更新。` : "暫時連不上資料，畫面可能不是最新的，檢查一下網路再重新整理。");
    }
  }
  async function loadSheet(){
    try {
      const r = await fetch(SHEET_CSV + "&t=" + Date.now(), { credentials: "omit", cache: "no-store" });
      const txt = await r.text(), p = parseSheet(txt);
      if(!p) return;
      S.sheet = p; S.sheetAt = Date.now();
      try { localStorage.setItem("ylSheet", txt); } catch(_){}
      document.querySelectorAll(".sync-at").forEach(el => el.textContent = syncAgo());
      if(pendingWrites || staged.size) return;   // 有修改還沒存，等存完重新載入時再合併
      mergeAtt(); scheduleRender();
    } catch(_){}
  }
  try { const p = parseSheet(localStorage.getItem("ylSheet") || ""); if(p) S.sheet = p; } catch(_){}
  // 先用手機裡上次存的資料把畫面畫出來，不用等網路
  try { const c = JSON.parse(localStorage.getItem(CACHE) || "null"); if(c && c.d){ applyData(c.d); S.cacheAt = c.t; } } catch(_){}
  if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  async function start(){
    S.online = true;
    // 記得這台裝置登入過的管理密碼
    let saved = "", remember = false;
    try { saved = localStorage.getItem("ylAdminPw") || ""; remember = !!saved; if(!saved) saved = sessionStorage.getItem("ylAdminPwS") || ""; } catch(_){}
    if(saved){
      try { if(await gs("checkPassword", saved)){ S.pw = saved; S.canWrite = true; S.remember = remember; } } catch(_){}
    }
    renderAdminBar();
    await Promise.all([load(), loadSheet()]);
    // 每 30 秒自動更新一次，看到別人剛記的資料
    setInterval(() => { if(document.visibilityState === "visible"){ load(); loadSheet(); } }, 30000);
    document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible"){ load(); loadSheet(); } });
  }

  // ---------- 管理員登入 ----------
  const adminBar = document.getElementById("adminBar");
  const IDLE = 2 * 60 * 60 * 1000;   // 沒勾「記住我」時，2 小時沒操作就登出
  let lastAct = Date.now();
  ["click", "keydown", "touchstart"].forEach(ev => addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true }));
  function logout(msg){
    staged.clear(); changes = 0; renderSaveBar();
    S.pw = ""; S.canWrite = false; S.loginOpen = false; S.remember = false;
    try { localStorage.removeItem("ylAdminPw"); sessionStorage.removeItem("ylAdminPwS"); } catch(_){}
    renderAdminBar(); render(); toast(msg);
  }
  const idleCheck = () => { if(S.canWrite && !S.remember && !staged.size && Date.now() - lastAct > IDLE) logout("太久沒操作，已自動登出"); };
  setInterval(idleCheck, 60000);
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") idleCheck(); });
  function renderAdminBar(){
    if(!S.online){ adminBar.hidden = true; return; }
    // 登入表單放在頁面最下方（頁尾上面）；登入後的管理員列回到最上方
    const topWrap = document.getElementById("notice").parentNode, footEl = document.getElementById("foot");
    if(!S.canWrite && S.loginOpen){ footEl.before(adminBar); adminBar.classList.add("wrap", "login-bottom"); }
    else if(adminBar.parentNode !== topWrap){ topWrap.prepend(adminBar); adminBar.classList.remove("wrap", "login-bottom"); }
    adminBar.hidden = false;
    if(S.canWrite){
      adminBar.innerHTML = `<div class="admin on"><span>管理員模式：可以點名、記收款、改設定<small class="muted" style="display:block">${S.remember ? "這支手機會記住登入" : "關掉網頁或 2 小時沒操作會自動登出"}</small></span><button class="btn small" id="logoutBtn">登出</button></div>`;
    } else if(S.loginOpen){
      adminBar.innerHTML = `<form class="admin" id="loginForm"><label class="field" style="flex:1 1 180px"><span>管理密碼</span><input id="pwInput" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label><button class="btn small" type="button" id="pwShow">顯示</button><button class="btn small primary" type="submit">登入</button><button class="btn small" type="button" id="loginCancel">先不要</button><label class="remember"><input type="checkbox" id="pwRemember">這是我的手機，記住我（沒勾：關網頁或 2 小時沒動就登出）</label><span id="pwHint" class="muted" style="flex-basis:100%" hidden>密碼不對喔。按「顯示」看一下：英數要半形，也注意瀏覽器有沒有自動帶入舊密碼。</span></form>`;
      setTimeout(() => { const el = document.getElementById("pwInput"); if(el) el.focus(); }, 0);
    } else {
      adminBar.hidden = true; adminBar.innerHTML = "";
    }
    const mg = active().find(m => m.id === S.settings.manager), foot = document.getElementById("foot");
    if(foot) foot.innerHTML = S.canWrite || S.loginOpen ? "" : `<span>資料有問題請找${mg ? ` <b>${esc(mg.name)}</b>` : "管理員"}</span><button class="link" id="loginBtn">管理員登入</button>`;
  }
  document.getElementById("foot").addEventListener("click", e => {
    if(e.target.id === "loginBtn"){ S.loginOpen = true; renderAdminBar(); adminBar.scrollIntoView({ block: "center" }); }
  });
  adminBar.addEventListener("click", e => {
    if(e.target.id === "loginBtn"){ S.loginOpen = true; renderAdminBar(); }
    else if(e.target.id === "loginCancel"){ S.loginOpen = false; renderAdminBar(); }
    else if(e.target.id === "pwShow"){
      const el = document.getElementById("pwInput"), show = el.type === "password";
      el.type = show ? "text" : "password"; e.target.textContent = show ? "隱藏" : "顯示"; el.focus();
    }
    else if(e.target.id === "logoutBtn"){
      if(staged.size && !confirm("還有修改沒儲存，登出會放棄這些修改，確定嗎？")) return;
      logout("登出了，現在是查看模式");
    }
  });
  adminBar.addEventListener("submit", async e => {
    e.preventDefault();
    // 中文輸入法常打出全形數字或多一個空白，先轉成半形、去掉前後空白
    const pw = document.getElementById("pwInput").value.normalize("NFKC").trim();
    if(!pw){ toast("請輸入密碼"); return; }
    try {
      if(await gs("checkPassword", pw)){
        S.pw = pw; S.canWrite = true; S.loginOpen = false;
        S.remember = !!(document.getElementById("pwRemember") || {}).checked; lastAct = Date.now();
        try { if(S.remember) localStorage.setItem("ylAdminPw", pw); else { localStorage.removeItem("ylAdminPw"); sessionStorage.setItem("ylAdminPwS", pw); } } catch(_){}
        renderAdminBar(); render(); toast("登入成功，可以開始點名了");
      } else {
        toast("密碼不對，再試一次");
        const h = document.getElementById("pwHint"); if(h) h.hidden = false;
      }
    } catch(err){ toast("連不上資料，請檢查網路後重新整理頁面"); }
  });

  render();
  start();
})();
</script>
</body>
</html>
